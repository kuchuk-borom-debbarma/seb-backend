extend type Query {
  seb: SebQuery!
}

scalar Date
scalar Money

enum RegistrationType { NONE CIN UDYAM }
enum BusinessSector {
  AGRICULTURE_AND_ALLIED
  HANDLOOM_TEXTILE_AND_HANDICRAFTS
  FOOD_PROCESSING
  TOURISM_AND_HOSPITALITY
  INFORMATION_TECHNOLOGY
  MANUFACTURING_AND_SERVICES
  OTHER
}
enum EnterpriseStatus { PROPOSED ACTIVE INACTIVE }
enum ApplicationStatus {
  DRAFT
  SUBMITTED
  DESK_REVIEW
  REVISION_REQUIRED
  PARTNER_BANK_EVALUATION
  TTM_REVIEW
  APPROVED
  REJECTED
  SANCTIONED
  DISBURSED
  CANCELLED
}
enum ApplicationType { INITIAL EXPANSION }
enum ApplicationCategory { CATEGORY_A CATEGORY_B }
enum ApplicantDesignation { PROPRIETOR MANAGING_PARTNER DIRECTOR AUTHORIZED_SIGNATORY }
enum Gender { MALE FEMALE OTHER }
enum CreditStatus { STANDARD NPA }
enum RelationshipType { SON_OF DAUGHTER_OF WIFE_OF }
enum DocumentType {
  IDENTITY_AGE_PROOF
  ST_CERTIFICATE
  ADDRESS_PROOF
  BUSINESS_REGISTRATION
  GST_REGISTRATION
  DPR
  BANK_DETAILS
  NOC
}
enum ApplicationSection {
  ENTERPRISE
  APPLICANT_PROFILE
  FINANCIAL
  PRIOR_FUNDING
  EXPANSION
  DOCUMENTS
  DECLARATION
}

type SebQuery {
  enterprise: SebEnterpriseQuery!
  application: SebApplicationQuery!
}

type SebEnterpriseQuery {
  mine(first: Int, after: String, includeDeleted: Boolean): EnterpriseConnectionResult!
  byId(id: ID!): EnterpriseResult!
}

type SebApplicationQuery {
  # Cycles a new application may be started in right now. A "start application"
  # action may only ever be offered from this list.
  availableProgrammeCycles: ProgrammeCyclesResult!
  # Cycles this applicant already has work in, whatever their state, so closed
  # and archived cycles render as read-only history.
  myProgrammeCycles: ProgrammeCyclesResult!
  # Plain-language explanation and next action for every application status.
  statusGuide: ApplicationStatusGuideResult!
  mine(
    first: Int
    after: String
    enterpriseId: ID
    status: ApplicationStatus
    includeDeleted: Boolean
  ): ApplicationConnectionResult!
  byId(id: ID!): ApplicationResult!
  validate(applicationId: ID!): ApplicationValidationResult!
  expansionEligibility(
    enterpriseId: ID!
    programmeCycleId: ID!
  ): ExpansionEligibilityResult!
  timeline(applicationId: ID!, first: Int, after: String): TimelineConnectionResult!
  funding(applicationId: ID!): ApplicantFundingResult!
  # What this draft changes relative to the last submission, for a final review
  # before resubmitting.
  draftChanges(applicationId: ID!): ApplicationChangedSectionsResult!
  documentDownloadUrl(documentId: ID!): DocumentDownloadResult!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Enterprise {
  id: ID!
  name: String!
  establishmentDate: Date
  registrationType: RegistrationType!
  registrationNumber: String
  gstin: String
  businessSector: BusinessSector
  otherBusinessSector: String
  businessBlockOrVillage: String
  businessDistrict: String
  businessPinCode: String
  contactNumber: String
  contactEmail: String
  status: EnterpriseStatus!
  currentVersion: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type EnterpriseConnection {
  nodes: [Enterprise!]!
  pageInfo: PageInfo!
}

type ProgrammeCycle {
  id: ID!
  cycleCode: String!
  displayName: String!
  cycleYear: Int!
  policyReference: String
  applicantGuidance: String
  # The cycle's own lifecycle state, which is not the same as whether an
  # application may start in it. The application window is opensAt/closesAt.
  status: ProgrammeCycleStatus!
  currentVersion: Int!
  opensAt: DateTime
  closesAt: DateTime
}

# Who the applicant is waiting on. NOBODY means the application has finished.
enum NextActor { APPLICANT PROGRAMME_OFFICE NOBODY }

# Deliberately carries no dates: a status says who holds the work, never when
# they will finish it.
type ApplicationStatusGuideEntry {
  status: ApplicationStatus!
  label: String!
  explanation: String!
  nextActor: NextActor!
  # What the applicant can do now; null when nothing is theirs to do.
  nextAction: String
}
type ApplicationStatusGuide { statuses: [ApplicationStatusGuideEntry!]! }

type ApplicationChangedSections {
  sections: [ApplicationSection!]!
  comparedToSubmissionNumber: Int!
}

type ProgrammeCyclesResponse { cycles: [ProgrammeCycle!]! }

type ApplicationSummary {
  id: ID!
  enterpriseId: ID!
  fundingCaseId: ID!
  programmeCycleId: ID!
  applicationType: ApplicationType!
  phaseNumber: Int!
  referenceNumber: String
  currentVersion: Int!
  status: ApplicationStatus!
  statusVersion: Int!
  firstSubmittedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  businessName: String
  cycleCode: String!
  cycleYear: Int!
}

type ApplicationConnection {
  nodes: [ApplicationSummary!]!
  pageInfo: PageInfo!
}

type EnterpriseSnapshot {
  businessName: String
  establishmentDate: Date
  registrationType: RegistrationType
  registrationNumber: String
  gstin: String
  businessSector: BusinessSector
  otherBusinessSector: String
  applicationCategory: ApplicationCategory
  majorityOwnershipConfirmed: Boolean
}

type ApplicantProfileSnapshot {
  primaryApplicantName: String
  designation: ApplicantDesignation
  dateOfBirth: Date
  gender: Gender
  businessBlockOrVillage: String
  businessDistrict: String
  businessPinCode: String
  contactNumber: String
  contactEmail: String
}

type FinancialSnapshot {
  totalProjectCostPaise: Money
  seedFundRequestedPaise: Money
  bankLoanProposedPaise: Money
  promoterContributionPaise: Money
}

type PriorFundingSnapshot {
  receivedGovernmentFunding: Boolean
  governmentSchemeName: String
  governmentFundingAmountPaise: Money
  governmentFundingSanctionYear: Int
  hasExistingBankCredit: Boolean
  existingBankName: String
  existingCreditAmountPaise: Money
  existingCreditStatus: CreditStatus
}

type DocumentRequirementsSnapshot { nocRequired: Boolean }

type DeclarationSnapshot {
  relationshipType: RelationshipType
  relatedPersonName: String
  declarationAccepted: Boolean
  declarationPlace: String
}

type ApplicationSnapshot {
  version: Int!
  programmeCycleVersion: Int!
  applicationType: ApplicationType!
  phaseNumber: Int!
  changeType: String!
  createdAt: DateTime!
  declarationAcceptedAt: DateTime
  enterprise: EnterpriseSnapshot!
  applicantProfile: ApplicantProfileSnapshot!
  financial: FinancialSnapshot!
  priorFunding: PriorFundingSnapshot!
  documents: DocumentRequirementsSnapshot!
  declaration: DeclarationSnapshot!
  priorSanctionOrderNumber: String
  priorSanctionDate: Date
  priorNetDisbursedAmountPaise: Money
  continuousOperationMonths: Int
}

type ApplicationDocument {
  id: ID!
  documentType: DocumentType!
  currentVersion: Int!
  originalFilename: String!
  contentType: String!
  sizeBytes: Int!
  createdAt: DateTime!
  deletedAt: DateTime
}

type RevisionRequest {
  id: ID!
  section: ApplicationSection!
  note: String!
  requestedAt: DateTime!
  resolvedAt: DateTime
  cancelledAt: DateTime
}

type Application {
  id: ID!
  enterpriseId: ID!
  fundingCaseId: ID!
  programmeCycleId: ID!
  applicationType: ApplicationType!
  phaseNumber: Int!
  referenceNumber: String
  currentVersion: Int!
  status: ApplicationStatus!
  statusVersion: Int!
  firstSubmittedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  snapshot: ApplicationSnapshot!
  documents: [ApplicationDocument!]!
  revisionRequests: [RevisionRequest!]!
  # Sections the applicant may change right now. Every section while the
  # application is a draft, only the sections named by unresolved revision
  # requests while revision is required, and none otherwise.
  editableSections: [ApplicationSection!]!
}

type ValidationIssue {
  section: ApplicationSection!
  field: String!
  code: String!
  message: String!
}
type ValidationReport { valid: Boolean!, issues: [ValidationIssue!]! }

# One unmet expansion rule, stated separately so an applicant blocked by three
# things sees three things.
type ExpansionReason {
  code: String!
  message: String!
  # The release obligation this reason is about, for utilization results.
  # Null for reasons that apply to the award as a whole.
  obligationId: ID
}

type ExpansionEligibility {
  eligible: Boolean!
  nextPhaseNumber: Int
  qualifyingAwardId: ID
  # The first calendar instant the twelve-month operating rule is satisfied.
  eligibleAt: DateTime
  reasons: [ExpansionReason!]!
}

type TimelineEvent {
  id: ID!
  eventType: String!
  fromStatus: ApplicationStatus
  toStatus: ApplicationStatus
  section: ApplicationSection
  message: String
  createdAt: DateTime!
}
type TimelineConnection { nodes: [TimelineEvent!]!, pageInfo: PageInfo! }

# The applicant's view of what an award has actually paid out. Amounts are
# derived from the append-only ledger, so they cannot drift from the releases
# and reversals behind them.
type ApplicantAward {
  sanctionOrderNumber: String!
  sanctionDate: Date!
  sanctionedAmountPaise: Money!
  applicantConditions: String
  status: AwardStatus!
  closureDisposition: AwardClosureDisposition
  grossReleasedPaise: Money!
  reversedPaise: Money!
  netReleasedPaise: Money!
  remainingPlannedPaise: Money!
}

# One payment. A correction is folded in as `reversedAmountPaise` rather than
# listed as its own entry, and internal banking prerequisites are never shown.
type ApplicantRelease {
  sequenceNumber: Int!
  occurredAt: DateTime!
  amountPaise: Money!
  paymentReference: String
  reversedAmountPaise: Money!
}

# Reviewer-only evidence references and internal notes are deliberately absent.
type ApplicantAssessment {
  assessmentType: AssessmentType!
  assessmentNumber: Int!
  outcome: AssessmentOutcome!
  assessedAt: DateTime!
  summary: String!
  # True when this is the current result rather than a superseded one. Utilization
  # is assessed per release, so several can be current at once.
  latest: Boolean!
}

type ApplicantFunding {
  award: ApplicantAward!
  releases: [ApplicantRelease!]!
  assessments: [ApplicantAssessment!]!
}

type DocumentDownloadResponse { downloadUrl: String!, expiresAt: DateTime! }

# One application that has to be dealt with before its enterprise can be deleted.
type EnterpriseDeletionBlocker {
  applicationId: ID!
  # Null while the application has never been submitted.
  referenceNumber: String
  status: ApplicationStatus!
  hasAward: Boolean!
}

# Deletion carries an extra field so a refusal can name what blocked it. Always
# present and empty on every other outcome.
type EnterpriseDeletionResult implements BaseResponse {
  success: Boolean!
  message: String
  response: Enterprise
  blockers: [EnterpriseDeletionBlocker!]!
}

type ApplicationStatusGuideResult implements BaseResponse {
  success: Boolean!
  message: String
  response: ApplicationStatusGuide
}

type ApplicationChangedSectionsResult implements BaseResponse {
  success: Boolean!
  message: String
  response: ApplicationChangedSections
}

type EnterpriseResult implements BaseResponse {
  success: Boolean!
  message: String
  response: Enterprise
}
type EnterpriseConnectionResult implements BaseResponse {
  success: Boolean!
  message: String
  response: EnterpriseConnection
}
type ProgrammeCyclesResult implements BaseResponse {
  success: Boolean!
  message: String
  response: ProgrammeCyclesResponse
}
type ApplicationResult implements BaseResponse {
  success: Boolean!
  message: String
  response: Application
}
type ApplicationConnectionResult implements BaseResponse {
  success: Boolean!
  message: String
  response: ApplicationConnection
}
type ApplicantFundingResult implements BaseResponse {
  success: Boolean!
  message: String
  response: ApplicantFunding
}
type ApplicationValidationResult implements BaseResponse {
  success: Boolean!
  message: String
  response: ValidationReport
}
type ExpansionEligibilityResult implements BaseResponse {
  success: Boolean!
  message: String
  response: ExpansionEligibility
}
type TimelineConnectionResult implements BaseResponse {
  success: Boolean!
  message: String
  response: TimelineConnection
}
type DocumentDownloadResult implements BaseResponse {
  success: Boolean!
  message: String
  response: DocumentDownloadResponse
}
