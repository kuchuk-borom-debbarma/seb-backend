"""A download link, or the reason there is none."""
type DocumentDownloadResult implements BaseResponse {
  """Whether a link was issued."""
  success: Boolean!

  """
  What to show when `success` is false — a document that is not the
  applicant's, or one whose file is not yet safe to release.
  """
  message: String

  """The link. Null whenever `success` is false."""
  response: DocumentDownloadResponse
}

"""Where an application is, as its applicant is told."""
type ApplicationJourney {
  """What the applicant is told about the stage their file is at; null once its journey has ended."""
  stageLabel: String

  """A sentence more about that stage, when the pipeline gives one."""
  stageExplanation: String

  """How the journey ended, such as "Completed" or "Not approved"; null while it is still being worked."""
  ended: String

  """The statuses the applicant may see that the file holds now."""
  flags: [ApplicationJourneyFlag!]!

  """What the office recorded that the applicant may see, such as the grant approved."""
  recordedValues: [ApplicationJourneyValue!]!
}

"""A status the applicant's file holds."""
type ApplicationJourneyFlag {
  """The status's key, stable for a client to branch on."""
  key: String!

  """What the applicant is shown."""
  label: String!

  """A sentence more, when the pipeline gives one."""
  explanation: String
}

"""A value the office recorded on the applicant's file."""
type ApplicationJourneyValue {
  """The recorded value's key."""
  key: String!

  """What the pipeline calls it."""
