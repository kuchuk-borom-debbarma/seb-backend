  """Which submission was reviewed."""
  submissionId: ID!

  """What was decided, as a stable code."""
  outcome: String!

  """Who reviewed it."""
  reviewedByUserId: ID!

  """When."""
  reviewedAt: DateTime!

  """
  Whether the reviewer said they were the applicant on this file.

  True marks a review somebody carried out on their own application, which is
  allowed once declared. Show it beside the outcome wherever a reviewer's
  judgement is presented as independent.
  """
  conflictAcknowledged: Boolean!
}

"""One of the nine checks in a desk review."""
type AdminReviewCheck {
  """Stable identifier."""
