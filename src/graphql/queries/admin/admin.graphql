}

"""
One committee decision.

Never edited: a correction is a new decision superseding the earlier one.
"""
type AdminDecisionRecord {
  """Stable identifier."""
  id: ID!

  """What the committee decided."""
  outcome: TtmDecisionOutcome!

  """The committee's reference for the decision."""
  decisionReference: String!

  """When the committee met, which may precede when this was recorded."""
  decisionDate: Date!

  """
  How much was approved, in paise. Null for anything but an approval, and
  never more than was requested.
  """
  approvedAmountPaise: Money

  """The wording shown to the applicant."""
  applicantMessage: String!

  """When the office recorded it."""
