extend type Query {
  """
  Everything the programme office reads.

  **Use case:** the office screens under `/admin`. Requires a staff role;
  every field is refused to an applicant. A reviewer may read all of this and
  change none of it.
  """
  admin: AdminQuery!
}

"""The four things the office works on, in the order a file passes through."""
type AdminQuery {
  """Programme cycles: the rules each round of funding applies."""
  programmeCycle: AdminProgrammeCycleQuery!

  """Applications arriving, and the desk review of them."""
  intake: AdminIntakeQuery!

  """Awards, payments, assessments and recovery."""
  funding: AdminFundingQuery!

  """Aggregate reporting over the intake casework."""
  analytics: AdminAnalyticsQuery!

  """The landing page's announcement banner, as its authors see it."""
  announcement: AdminAnnouncementQuery!
}

"""Reading the announcement banner with its drafts and its ordering guard."""
type AdminAnnouncementQuery {
  """
  Every card, drafts and expired ones included, with the version the reorder
  must quote.

  **Use case:** `/admin/announcements` — the whole screen renders from this
  one read, so it can never show a list and a version from two moments.

  **Refuses:** a caller without the authority to manage the banner.
  """
  board: AdminAnnouncementBoardResult!
}

"""The board, or the reason it could not be read."""
type AdminAnnouncementBoardResult implements BaseResponse {
  """Whether the board was read."""
  success: Boolean!

  """
  What to show when `success` is false — an authority refusal, a stale
  `expectedBoardVersion` on a reorder, or a reorder list the board outgrew.
  """
  message: String

  """The board. Null whenever `success` is false."""
  response: AdminAnnouncementBoard
}

"""The whole banner as the office sees it."""
type AdminAnnouncementBoard {
  """
  Send back as `expectedBoardVersion` when reordering. Creating or removing a
  card moves it too, so a reorder built from an outdated list is refused
  rather than renumbering the wrong set.
  """
  boardVersion: Int!

  """Every card that has not been removed, in display order."""
  announcements: [AdminAnnouncement!]!
}

"""One card, or the reason the operation on it was refused."""
type AdminAnnouncementResult implements BaseResponse {
  """Whether the operation succeeded."""
  success: Boolean!

  """
  What to show when `success` is false — a field over its cap, a link of the
  wrong shape, or a stale `expectedVersion` when somebody else acted first.
  """
  message: String

  """The card as it now stands. Null whenever `success` is false."""
  response: AdminAnnouncement
}

"""One card, with the lifecycle the public read hides."""
type AdminAnnouncement {
  """Stable identifier, named by every edit."""
  id: ID!

  """The short category chip on the card. **Example:** `"Notice"`."""
  tag: String!

  """The optional free-text label beside the tag. Null when left off."""
  dateLabel: String

  """The card's headline, and the text of its link when it has one."""
  title: String!

  """One or two sentences under the headline."""
  body: String!

  """Which of the fixed pictograms the card carries."""
  icon: AnnouncementIcon!

  """Where the card leads. Null for a card that is only a statement."""
  link: AnnouncementLink

  """
  When the card stops showing to the public. Null means it stays until
  withdrawn. A past value is legal — the card simply is not shown.
  """
  endsAt: DateTime

  """
  Whether the public may see it. A hidden card is a draft the office can
  finish and flip live later.
  """
  published: Boolean!

  """Where the card sits in the display order. Rewritten by every reorder."""
  sortOrder: Int!

  """
  Optimistic-concurrency token for this card. Read it with the card, send it
  back in `expectedVersion`; a concurrent edit refuses instead of silently
  overwriting.
  """
  currentVersion: Int!

  """When the card was first authored."""
  createdAt: DateTime!

  """When the card last changed, edits and reorders alike."""
  updatedAt: DateTime!
}

"""Reading the intake casework as aggregates rather than rows."""
type AdminAnalyticsQuery {
  """
  One filtered set of applications, counted along every reporting dimension.

  **Use case:** the analytics panel on `/admin`. Takes the queue's own filter
  shape minus paging, and describes exactly the set `intake.queue` would list
  under the same filters — the counts and the rows can never disagree.
  """
  summary(
    """Filters, all optional, combined with AND. Omit for the whole intake."""
    input: AdminIntakeAnalyticsInput
  ): AdminAnalyticsSummaryResult!
}

"""Reading the programme cycles and their rules."""
type AdminProgrammeCycleQuery {
  """
  Every cycle, newest first.

  **Use case:** `/admin/cycles`. Filters combine with AND.
  """
  list(
    """How many to return, 1–100. Defaults to 20."""
    first: Int

    """The previous page's `endCursor`. Opaque; omit for the first page."""
    after: String

    """Include removed draft cycles. Defaults to false."""
    includeDeleted: Boolean

    """Only cycles in this lifecycle state."""
    status: ProgrammeCycleStatus

    """Only cycles for this policy year."""
    cycleYear: Int

    """
    Matches the **start** of the cycle code, case-insensitively. A prefix
    match rather than a search.
    """
    search: String
  ): AdminCycleConnectionResult!

  """
  One cycle with its complete rule set.

  **Use case:** `/admin/cycles/$id`, and the editor that seeds a new cycle
  from an existing one.
  """
  byId(
    """Which cycle."""
    id: ID!
  ): AdminCycleResult!

  """
  A short-lived download URL for one version of a cycle's policy PDF.

  **Use case:** the download links on the policy document card. Fetched on
  click — the URL expires in minutes, so it must never sit in a cached query.

  **Refuses:** a missing document, and any version whose latest scan verdict
  is not ACCEPTED.
  """
  policyDocumentDownloadUrl(
    """The cycle whose policy PDF to download."""
    cycleId: ID!

    """Which retained version. Omit for the current one."""
    version: Int
  ): DocumentDownloadResult!

  """
  How many applications sit in each status for one cycle.

  **Use case:** the summary on a cycle's page, and deciding whether a cycle
  can safely be closed.
  """
  counts(
    """Which cycle."""
    id: ID!
  ): AdminCycleCountsResult!

  """
  What has happened to one cycle: opened, edited, closed, archived.

  **Use case:** the history on `/admin/cycles/$id`. Newest first, and capped
  rather than paged — it is a short tail, not a list to walk.
  """
  events(
    """Which cycle."""
    id: ID!

    """How many of the most recent to return, 1–100. Defaults to 20."""
    first: Int
  ): AdminCycleEventsResult!
}

"""Reading applications as they arrive and are reviewed."""
type AdminIntakeQuery {
  """
  The work queue, filtered and ordered as the office needs it.

  **Use case:** `/admin/queue`. Filters combine with AND.
  """
  queue(
    """Filters, ordering and paging. Every field is optional."""
    input: AdminIntakeQueueInput
  ): AdminApplicationConnectionResult!

  """
  How many applications sit in each named queue.

  **Use case:** the counts on the queue chips. Every queue is reported even
  when empty, so the chips do not come and go as work moves.
  """
  queues(
    """Narrow the counts to one cycle. Omit to count across all of them."""
    cycleId: ID
  ): AdminQueueSummaryResult!

  """
  Finds one application by its exact reference number.

  **Use case:** the lookup box, for somebody holding a reference from a letter
  or a phone call. Exact match — use `queue(search:)` for a prefix.
  """
  byReference(
    """The programme's reference, exactly as issued."""
    referenceNumber: String!
  ): AdminApplicationResult!

  """
  One application's whole case file, in a single request.

  **Use case:** `/admin/applications/$id`. Everything the office has on the
  application comes back together so the screen cannot show two moments at
  once, which a dozen separate queries would.
  """
  workspace(
    """The application whose case file to load. Any status but `DRAFT`."""
    applicationId: ID!
  ): AdminWorkspaceResult!

  """
  A short-lived link to one document attached to a submission.

  **Use case:** the download on the workspace. Needs only a staff role — a
  reviewer may read every piece of evidence.

  **Refuses:** a file whose latest malware scan is not accepted, and a draft
  application, which is refused identically to one that does not exist.
  """
  documentDownloadUrl(
    """Which application the document belongs to."""
    applicationId: ID!

    """
    Which pinned document. This is the submission's copy, not the applicant's
    document id — a submission freezes the exact version it carried.
    """
    submissionDocumentId: ID!
  ): DocumentDownloadResult!
}

"""Reading the money on an application."""
type AdminFundingQuery {
  """
  The award, its ledger, and everything downstream, for one application.

  **Use case:** `/admin/applications/$id/funding`.

  **Refuses:** an application with no award yet, which is ordinary rather than
  an error.
  """
  byApplication(
    """The application to read the money on. Needs an award to exist."""
    applicationId: ID!
  ): AdminFundingWorkspaceResult!

  """
  One recovery case with its entries and its running balance.

  **Use case:** `/admin/recovery/$id`.
  """
  recoveryById(
    """From `AdminRecoveryCase.id` on the funding workspace."""
    recoveryCaseId: ID!
  ): AdminRecoveryWorkspaceResult!
}

"""
How the queue is filtered, ordered and paged.

Every field is optional and they combine with AND.
"""
input AdminIntakeQueueInput {
  """How many to return, 1–100. Defaults to 20."""
  first: Int

  """
  The previous page's `endCursor`. Opaque, and it remembers which ordering it
  came from — reusing a cursor under a different `order` is refused rather
  than silently seeking against the wrong column.
  """
  after: String

  """Only applications in this programme cycle."""
  cycleId: ID

  """
  Only applications in this status. Mutually exclusive with `queue`.
  """
  status: ApplicationStatus

  """Only applications at this phase: 1 for a first application."""
  phaseNumber: Int

  """Only first applications, or only later phases."""
  applicationType: ApplicationType

  """
  Only applications this person worked last. Advisory rather than ownership —
  nothing is reserved, so this narrows a list rather than describing a claim.
  """
  assigneeUserId: ID

  """Only the application with this exact reference."""
  referenceNumber: String

  """Only applications from enterprises in this sector."""
  sector: BusinessSector

  """Only applications in this funding band."""
  category: ApplicationCategory

  """Only applications submitted at or after this instant."""
  submittedFrom: DateTime

  """Only applications submitted at or before this instant."""
  submittedTo: DateTime

  """
  Which column to order by. Defaults to oldest waiting — the order the office
  works in. A cursor belongs to whichever ordering produced it.
  """
  order: AdminIntakeOrder

  """
  Matches the **start** of a reference number or an enterprise name,
  case-insensitively. A prefix match rather than a search: a word from the
  middle of a name finds nothing, and the interface says so.
  """
  search: String

  """
  Only applications in this named queue.

  Mutually exclusive with `status`: two queues are subsets of one status, so
  supplying both is **refused** rather than silently intersected into an empty
  page.
  """
  queue: AdminIntakeQueueKey

  """
  Only applications in any of these funding bands. When given and non-empty
  this **supersedes** `category`; an empty list means no category filter.
  """
  categories: [ApplicationCategory!]

  """
  Only applications from enterprises in any of these sectors. When given and
  non-empty this **supersedes** `sector`; an empty list means no sector filter.
  """
  sectors: [BusinessSector!]

  """
  Only applications from enterprises operating in any of these districts,
  read live from the enterprise profile. An empty list filters nothing.
  """
  districts: [TripuraDistrict!]

  """
  Only applications in any of these statuses. When given and non-empty this
  **supersedes** `status`, and it is refused alongside `queue` for the same
  reason `status` is. An empty list means no status filter.
  """
  statuses: [ApplicationStatus!]

  """
  Only applications in any of these programme cycles. When given and non-empty
  this **supersedes** `cycleId`; an empty list means no cycle filter.
  """
  cycleIds: [ID!]

  """
  Only applications from enterprises constituted under any of these
  instruments, read live from the enterprise profile. An empty list filters
  nothing.
  """
  registrationTypes: [RegistrationType!]

  """
  Only applications asking for at least this many paise, **inclusive**. An
  application whose requested amount is unanswered or unreadable never
  matches an amount bound.
  """
  requestedMinPaise: Money

  """Only applications asking for at most this many paise, **inclusive**."""
  requestedMaxPaise: Money

  """
  Only applications with a programme decision recorded at or after this
  instant. A correction is a decision too: either recording puts the
  application in the range.
  """
  decidedFrom: DateTime

  """Only applications with a programme decision recorded at or before this instant."""
  decidedTo: DateTime
}

"""
The district a Tripura enterprise operates in.

The same closed eight-value set the enterprise profile stores — prose
spellings of one place would silently split a district's count in two.
"""
enum TripuraDistrict {
  """Dhalai district."""
  DHALAI

  """Gomati district."""
  GOMATI

  """Khowai district."""
  KHOWAI

  """North Tripura district."""
  NORTH_TRIPURA

  """Sepahijala district."""
  SEPAHIJALA

  """South Tripura district."""
  SOUTH_TRIPURA

  """Unakoti district."""
  UNAKOTI

  """West Tripura district."""
  WEST_TRIPURA
}

"""
How the analytics summary is filtered: the queue's filters, minus paging.

Every field is optional and they combine with AND, exactly as they do on
`AdminIntakeQueueInput` — the summary describes the set the queue would list.
"""
input AdminIntakeAnalyticsInput {
  """Only applications in this programme cycle."""
  cycleId: ID

  """
  Only applications in any of these cycles. Supersedes `cycleId` when given
  and non-empty; an empty list filters nothing.
  """
  cycleIds: [ID!]

  """Only applications in this status. Mutually exclusive with `queue`."""
  status: ApplicationStatus

  """
  Only applications in any of these statuses. Supersedes `status` when given
  and non-empty, and is refused alongside `queue` just as `status` is.
  """
  statuses: [ApplicationStatus!]

  """
  Only applications in this named queue. Mutually exclusive with `status` and
  `statuses`, which is **refused** rather than silently intersected.
  """
  queue: AdminIntakeQueueKey

  """Only applications at this phase: 1 for a first application."""
  phaseNumber: Int

  """Only first applications, or only later phases."""
  applicationType: ApplicationType

  """Only applications this person worked last. Advisory, not ownership."""
  assigneeUserId: ID

  """Only the application with this exact reference."""
  referenceNumber: String

  """
  Matches the **start** of a reference number or an enterprise name,
  case-insensitively — the same prefix rule the queue applies.
  """
  search: String

  """Only applications from enterprises in this sector."""
  sector: BusinessSector

  """
  Only applications from enterprises in any of these sectors. Supersedes
  `sector` when given and non-empty; an empty list filters nothing.
  """
  sectors: [BusinessSector!]

  """Only applications in this funding band."""
  category: ApplicationCategory

  """
  Only applications in any of these funding bands. Supersedes `category`
  when given and non-empty; an empty list filters nothing.
  """
  categories: [ApplicationCategory!]

  """
  Only applications from enterprises operating in any of these districts,
  read live from the enterprise profile. An empty list filters nothing.
  """
  districts: [TripuraDistrict!]

  """
  Only applications from enterprises constituted under any of these
  instruments. An empty list filters nothing.
  """
  registrationTypes: [RegistrationType!]

  """Only applications submitted at or after this instant."""
  submittedFrom: DateTime

  """Only applications submitted at or before this instant."""
  submittedTo: DateTime

  """
  Only applications asking for at least this many paise, **inclusive**. An
  unanswered or unreadable requested amount never matches an amount bound.
  """
  requestedMinPaise: Money

  """Only applications asking for at most this many paise, **inclusive**."""
  requestedMaxPaise: Money

  """
  Only applications with a programme decision recorded at or after this
  instant. A correction is a decision too: either recording puts the
  application in the range.
  """
  decidedFrom: DateTime

  """Only applications with a programme decision recorded at or before this instant."""
  decidedTo: DateTime
}

"""Which column the queue is ordered by."""
enum AdminIntakeOrder {
  """Longest-waiting first, by submission time. The order work is done in."""
  OLDEST_WAITING

  """Most recently submitted first."""
  NEWEST_SUBMISSION

  """Most recently touched first, whoever touched it."""
  LAST_ACTIVITY
}

"""
The named work queues staff operate from.

`NEW_SUBMISSIONS` and `REVISION_RESPONSES` are both `SUBMITTED` applications,
separated by whether this is a first submission or an answer to a correction
request — two completely different jobs that must never land in one pile.
"""
enum AdminIntakeQueueKey {
  """First submissions waiting to be picked up."""
  NEW_SUBMISSIONS

  """Applications the office has started reviewing."""
  DESK_REVIEW

  """Answers to correction requests, waiting to be checked."""
  REVISION_RESPONSES

  """Sent to a bank and awaiting its assessment. Nothing for the office to do."""
  PARTNER_BANK_EVALUATION

  """Cleared the bank stage and waiting to be decided."""
  AWAITING_DECISION

  """Approved, awaiting a sanction order."""
  APPROVED

  """Not approved."""
  REJECTED

  """Sanctioned, awaiting payment."""
  SANCTIONED

  """At least partly paid."""
  DISBURSED
}

"""
Whether the programme has settled its maximum award.

Unresolved is an honest state rather than a missing value: TTAADC has not yet
stated one authoritative ceiling, and pretending otherwise would put a number
into sanction decisions that nobody approved.
"""
enum FundingCeilingState {
  """No ceiling has been settled. Amounts are not checked against one."""
  UNRESOLVED

  """A ceiling is settled, and `fundingCeilingAmountPaise` carries it."""
  RESOLVED
}

"""What a funding ceiling is measured across."""
enum FundingCeilingScope {
  """Each application separately."""
  APPLICATION

  """Each phase separately."""
  PHASE

  """Everything one enterprise ever receives."""
  ENTERPRISE

  """Everything in one funding chain, across every phase."""
  FUNDING_CASE
}

"""Whose rules a cycle applies."""
enum ProgrammeJurisdiction {
  """The state of Tripura."""
  TRIPURA

  """The Tripura Tribal Areas Autonomous District Council."""
  TTAADC
}

"""
Which administrative action a reason category may be used for.

Every reason belongs to exactly one context, so the reasons offered for
rejecting an application can never be offered for closing a cycle.
"""
enum ProgrammeReasonContext {
  """Closing a cycle to new applications."""
  CYCLE_CLOSE

  """Asking the applicant to correct a section."""
  REVISION

  """Rejecting an application at desk review."""
  REJECTION

  """Cancelling a referral to a partner bank."""
  BANK_REFERRAL_CANCEL

  """Correcting a bank outcome already recorded."""
  BANK_OUTCOME_CORRECTION

  """Correcting a programme decision already recorded."""
  DECISION_CORRECTION

  """Changing an award after it was made."""
  AWARD_AMENDMENT

  """Suspending an award."""
  AWARD_SUSPENSION

  """Cancelling an award."""
  AWARD_CANCELLATION

  """Closing an award."""
  AWARD_CLOSURE

  """Reversing a payment already made."""
  RELEASE_REVERSAL

  """Opening or acting on a recovery case."""
  RECOVERY

  """Writing off part of a recovery."""
  RECOVERY_WAIVER
}

"""What a partner bank concluded. Advisory evidence, never the decision."""
enum BankOutcome {
  """The bank supports the proposal."""
  RECOMMENDED

  """
  The bank does not support it. The application is still decided by the
  programme — bank feedback is evidence, not a veto.
  """
  NOT_RECOMMENDED

  """The bank cannot conclude without more from the applicant."""
  MORE_INFORMATION_REQUIRED
}

"""What the programme decided on an application."""
enum DecisionOutcome {
  """Approved. An award follows."""
  APPROVED

  """Not approved."""
  REJECTED

  """Sent back to the applicant for correction."""
  REVISION_REQUIRED
}

"""What one recovery ledger entry does to the balance."""
enum RecoveryEntryType {
  """Money claimed back. Increases what is outstanding."""
  DEMAND

  """Money received. Reduces what is outstanding."""
  RECEIPT

  """Money written off. Reduces what is outstanding without being received."""
  WAIVER

  """A correction to an earlier entry, posted rather than edited in place."""
  REVERSAL
}

"""Which part of a recovery an entry applies to."""
enum RecoveryComponent {
  """The money itself."""
  PRINCIPAL

  """Interest charged on late recovery."""
  PENAL_INTEREST
}

"""A reusable structure a cycle defines, as the editor reads it back."""
type FormGroupDefinition {
  """How the structure is addressed."""
  definitionKey: String!

  """What the structure is called where the editor lists it."""
  label: String!

  """The questions each entry asks, in order."""
  members: [FormGroupDefinitionMember!]!
}

"""One member of a reusable structure, as authored."""
type FormGroupDefinitionMember {
  """How the member is addressed inside its structure."""
  memberKey: String!

  """What kind of answer it takes."""
  fieldType: FormFieldType!

  """The role it plays, where it plays one."""
  role: String

  """The words the applicant reads."""
  label: String!

  """A sentence of guidance under the control."""
  helpText: String

  """Whether an answer is needed in every entry."""
  requirement: FormFieldRequirement!

  """Fewest characters."""
  minLength: Int

  """Most characters."""
  maxLength: Int

  """The format rule, where one is set."""
  pattern: String

  """What to say when the format rule does not match."""
  patternMessage: String

  """Smallest permitted number."""
  minValue: Money

  """Largest permitted number."""
  maxValue: Money

  """Earliest permitted day."""
  minDate: Date

  """Latest permitted day."""
  maxDate: Date

  """`"NOT_FUTURE"` or `"NOT_PAST"`, or null."""
  relativeDateBound: String

  """Ghost text inside the empty control."""
  placeholder: String

  """An inline hint under the control."""
  note: String

  """How to colour the note."""
  tone: String

  """How wide to draw the control."""
  widthHint: String

  """Decoration before the value."""
  prefixText: String

  """Decoration after the value."""
  suffixText: String

  """The HTML `autocomplete` token."""
  autocompleteHint: String

  """Whether to show characters-remaining."""
  showCharCount: Boolean!

  """How many rows a `LONG_TEXT` control opens with."""
  textareaRows: Int

  """Which control draws a choice."""
  choiceStyle: String

  """The choices offered, in order."""
  options: [FormGroupDefinitionMemberOption!]!
}

"""One choice a structure's member offers, as authored."""
type FormGroupDefinitionMemberOption {
  """What is stored when the choice is taken."""
  optionValue: String!

  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card."""
  optionDescription: String

  """A kebab-case icon token for the card rendering."""
  iconName: String
}

"""One programme cycle, as the office sees it."""
type AdminProgrammeCycle {
  """Stable identifier."""
  id: ID!

  """Short code used in correspondence."""
  cycleCode: String!

  """The cycle's name, as shown to applicants."""
  displayName: String!

  """The policy year this cycle belongs to."""
  cycleYear: Int!

  """Guidance written for applicants."""
  applicantGuidance: String

  """
  Guidance written for partner banks. Never shown to applicants.
  """
  partnerBankGuidance: String

  """
  The cycle's lifecycle state, which is not the same as whether its window is
  open. The window is `opensAt`/`closesAt`.
  """
  status: ProgrammeCycleStatus!

  """When the application window opens. Null while unscheduled."""
  opensAt: DateTime

  """When the window closes. Null while unscheduled."""
  closesAt: DateTime

  """
  Send back as `expectedVersion` when editing. Every rule change makes a new
  version, and applications keep the version they were submitted against.
  """
  currentVersion: Int!

  """When the cycle was created."""
  createdAt: DateTime!

  """When it last changed."""
  updatedAt: DateTime!

  """When a draft cycle was removed, or null while it is listed."""
  deletedAt: DateTime
}

"""
The eligibility and funding rules of one cycle version.

Every value is nullable because every one is genuinely optional: a cycle that
sets no minimum age has none, and that is a decision rather than a gap. The
editor shows them back as they are, so an unconfigured cycle is visible.
"""
type AdminCyclePolicy {
  """Youngest applicant the cycle accepts, in years."""
  minimumApplicantAge: Int

  """Oldest applicant the cycle accepts, in years."""
  maximumApplicantAge: Int

  """
  How many months of trading separates the two funding bands. At or below this
  is `CATEGORY_A`; above it is `CATEGORY_B`.
  """
  categoryAMaximumMonths: Int

  """How long after an award before a later phase may be applied for."""
  expansionWaitMonths: Int

  """Whether the applicant must confirm majority ownership."""
  majorityOwnershipRequired: Boolean

  """Whose rules this cycle applies."""
  jurisdiction: ProgrammeJurisdiction

  """
  Whether a maximum award has been settled. `UNRESOLVED` is honest rather than
  missing: no amount is checked against a ceiling nobody has approved.
  """
  fundingCeilingState: FundingCeilingState!

  """The ceiling, in paise. Present only where the state is `RESOLVED`."""
  fundingCeilingAmountPaise: Money

  """What the ceiling is measured across. Present only where `RESOLVED`."""
  fundingCeilingScope: FundingCeilingScope
}

"""
Where a stored file stands with the malware scanner. Everything fails closed:
only ACCEPTED may be downloaded or published.
"""
enum AdminDocumentScanStatus {
  """Queued or in progress. Not yet downloadable."""
  PENDING

  """Scanned clean. Downloadable."""
  ACCEPTED

  """The scanner refused it. Upload a clean copy."""
  REJECTED

  """The scanner could not conclude. It will be retried; not downloadable."""
  ERROR
}

"""One retained version of a cycle's policy PDF."""
type AdminCyclePolicyDocumentVersion {
  """1 for the first upload, counting up with each replacement."""
  version: Int!

  """`UPLOAD` for the first version, `REPLACE` for every later one."""
  operation: String!

  """The file's own name, as it uploads and downloads."""
  originalFilename: String!

  """The exact stored size in bytes."""
  sizeBytes: Int!

  """When this version was recorded."""
  uploadedAt: DateTime!

  """This version's scan verdict. Only ACCEPTED may be downloaded."""
  scanStatus: AdminDocumentScanStatus!
}

"""A cycle's policy PDF: the current file and its whole retained history."""
type AdminCyclePolicyDocument {
  """Stable identifier."""
  id: ID!

  """The version currently published. Send back when replacing."""
  currentVersion: Int!

  """The current file's own name."""
  originalFilename: String!

