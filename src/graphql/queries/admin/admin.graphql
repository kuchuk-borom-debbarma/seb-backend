type AdminMeetingWorkspace {
  """The meeting itself."""
  meeting: AdminTtmMeeting!

  """Its agenda, in order."""
  agenda: [AdminAgendaItem!]!

  """Decisions taken at it, including superseded corrections."""
  decisions: [AdminDecisionRecord!]!
}

"""Everything about the money on one application."""
type AdminFundingWorkspace {
  """The award itself."""
  award: AdminAward!

  """Every ledger entry: payments and reversals, oldest first."""
  ledger: [AdminDisbursement!]!

  """When each payment must be accounted for."""
  obligations: [AdminUtilizationObligation!]!

  """Every assessment, including superseded ones."""
  assessments: [AdminAssessment!]!

  """Any recovery cases opened against this award."""
  recovery: [AdminRecoveryCase!]!
}

"""One award: what was sanctioned, and where it stands."""
type AdminAward {
  """Stable identifier."""
  id: ID!

  """Which application it was awarded on."""
  applicationId: ID!

  """The programme's sanction order number."""
  sanctionOrderNumber: String!

  """The date of the sanction order."""
  sanctionDate: Date!

  """What was sanctioned, in paise. The ceiling, not what has been paid."""
  sanctionedAmountPaise: Money!

  """Conditions the applicant must meet."""
  applicantConditions: String

  """Where the award is in its own life."""
  status: AwardStatus!

  """How a closed award ended. Null while still open."""
  closureDisposition: AwardClosureDisposition

  """Send back as `expectedVersion` when amending the award itself."""
  currentVersion: Int!

  """
  Send back as `expectedLedgerVersion` when posting money.

  Separate from `currentVersion` on purpose: recording a payment must not
  invalidate somebody's in-flight amendment, and the reverse.
  """
  ledgerVersion: Int!
}

"""
One entry in the award ledger.

Append-only. A correction is posted as its own reversal entry rather than
editing what was there, so the ledger always reconciles.
"""
type AdminDisbursement {
  """Stable identifier."""
  id: ID!

  """Which entry this is, counting from 1."""
  sequenceNumber: Int!

  """Whether this is a payment or a reversal, as a stable code."""
  entryType: String!

  """The payment this reverses. Null on a payment."""
  relatedDisbursementId: ID

  """The amount, in paise. Always positive; the type says the direction."""
  amountPaise: Money!

  """When the money moved."""
  occurredAt: DateTime!

  """The bank's reference, for reconciliation."""
  externalReference: String
}

"""When one payment must be accounted for."""
type AdminUtilizationObligation {
  """Stable identifier."""
  id: ID!

  """Which payment this obligation is about."""
  releaseDisbursementId: ID!

  """When the accounting for it is due."""
  dueAt: DateTime!
}

"""One assessment of how an award is being used."""
type AdminAssessment {
  """Stable identifier."""
  id: ID!

  """What was assessed."""
  assessmentType: AssessmentType!

  """Which assessment of this type this is, counting from 1."""
  assessmentNumber: Int!

  """What was concluded."""
  outcome: AssessmentOutcome!

  """
  Which payment this assesses, for utilization. Null for assessments about the
  award as a whole.
  """
  utilizationObligationId: ID

  """The office's reference for the evidence. Never shown to the applicant."""
  evidenceReference: String!

  """The wording shown to the applicant."""
  applicantSummary: String!

  """When it was concluded."""
  assessedAt: DateTime!
}

"""One recovery case against an award."""
type AdminRecoveryCase {
  """Stable identifier."""
  id: ID!

  """Which award is being recovered against."""
  fundingAwardId: ID!

  """Where the case is, as a stable code."""
  status: String!

  """Send back as `expectedVersion` when acting on the case itself."""
  currentVersion: Int!

  """Send back as `expectedLedgerVersion` when posting an entry."""
  ledgerVersion: Int!
}

"""
One entry in a recovery ledger.

Append-only, like the award ledger: a mistake is corrected by posting a
reversal, never by editing what is there.
"""
type AdminRecoveryEntry {
  """Stable identifier."""
  id: ID!

  """Which entry this is, counting from 1."""
  sequenceNumber: Int!

  """What this entry does to the balance."""
  entryType: RecoveryEntryType!

  """Which part of the recovery it applies to."""
  component: RecoveryComponent!

  """The amount, in paise. Always positive; the type says the direction."""
  amountPaise: Money!

  """The external reference, for reconciliation."""
  externalReference: String!

  """When it happened."""
  occurredAt: DateTime!
}

"""
A recovery case's running balance, folded from its entries.

Derived rather than stored, so it cannot drift from the ledger behind it.
"""
type AdminRecoveryBalance {
  """Principal claimed back, in paise."""
  principalDemanded: Money!

  """Interest claimed, in paise."""
  interestDemanded: Money!

  """Money received, in paise."""
  receipts: Money!

  """Money written off, in paise."""
  waivers: Money!

  """
  What is still owed, in paise: demanded less receipts less waivers. **This is
  the figure to show as outstanding.** Zero means the case can be closed.
  """
  outstanding: Money!
}

"""One recovery case with its entries and balance."""
type AdminRecoveryWorkspace {
  """The case itself."""
  recoveryCase: AdminRecoveryCase!

  """Every entry, oldest first."""
  entries: [AdminRecoveryEntry!]!

  """The running balance, folded from those entries."""
  balance: AdminRecoveryBalance!
}

