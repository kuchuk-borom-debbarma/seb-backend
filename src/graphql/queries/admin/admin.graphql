extend type Query {
  """
  Everything the programme office reads.

  **Use case:** the office screens under `/admin`. Requires a staff role;
  every field is refused to an applicant. A reviewer may read all of this and
  change none of it.
  """
  admin: AdminQuery!
}

"""The four things the office works on, in the order a file passes through."""
type AdminQuery {
  """Programme cycles: the rules each round of funding applies."""
  programmeCycle: AdminProgrammeCycleQuery!

  """Applications arriving, and the case file of each."""
  intake: AdminIntakeQuery!

  """Aggregate reporting over the intake casework."""
  analytics: AdminAnalyticsQuery!

  """The landing page's announcement banner, as its authors see it."""
  announcement: AdminAnnouncementQuery!
}

"""Reading the announcement banner with its drafts and its ordering guard."""
type AdminAnnouncementQuery {
  """
  Every card, drafts and expired ones included, with the version the reorder
  must quote.

  **Use case:** `/admin/announcements` — the whole screen renders from this
  one read, so it can never show a list and a version from two moments.

  **Refuses:** a caller without the authority to manage the banner.
  """
  board: AdminAnnouncementBoardResult!
}

"""The board, or the reason it could not be read."""
type AdminAnnouncementBoardResult implements BaseResponse {
  """Whether the board was read."""
  success: Boolean!

  """
  What to show when `success` is false — an authority refusal, a stale
  `expectedBoardVersion` on a reorder, or a reorder list the board outgrew.
  """
  message: String

  """The board. Null whenever `success` is false."""
  response: AdminAnnouncementBoard
}

"""The whole banner as the office sees it."""
type AdminAnnouncementBoard {
  """
  Send back as `expectedBoardVersion` when reordering. Creating or removing a
  card moves it too, so a reorder built from an outdated list is refused
  rather than renumbering the wrong set.
  """
  boardVersion: Int!

  """Every card that has not been removed, in display order."""
  announcements: [AdminAnnouncement!]!
}

"""One card, or the reason the operation on it was refused."""
type AdminAnnouncementResult implements BaseResponse {
  """Whether the operation succeeded."""
  success: Boolean!

  """
  What to show when `success` is false — a field over its cap, a link of the
  wrong shape, or a stale `expectedVersion` when somebody else acted first.
  """
  message: String

  """The card as it now stands. Null whenever `success` is false."""
  response: AdminAnnouncement
}

"""One card, with the lifecycle the public read hides."""
type AdminAnnouncement {
  """Stable identifier, named by every edit."""
  id: ID!

  """The short category chip on the card. **Example:** `"Notice"`."""
  tag: String!

  """The optional free-text label beside the tag. Null when left off."""
  dateLabel: String

  """The card's headline, and the text of its link when it has one."""
  title: String!

  """One or two sentences under the headline."""
  body: String!

  """Which of the fixed pictograms the card carries."""
  icon: AnnouncementIcon!

  """Where the card leads. Null for a card that is only a statement."""
  link: AnnouncementLink

  """
  When the card stops showing to the public. Null means it stays until
  withdrawn. A past value is legal — the card simply is not shown.
  """
  endsAt: DateTime

  """
  Whether the public may see it. A hidden card is a draft the office can
  finish and flip live later.
  """
  published: Boolean!

  """Where the card sits in the display order. Rewritten by every reorder."""
  sortOrder: Int!

  """
  Optimistic-concurrency token for this card. Read it with the card, send it
  back in `expectedVersion`; a concurrent edit refuses instead of silently
  overwriting.
  """
  currentVersion: Int!

  """When the card was first authored."""
  createdAt: DateTime!

  """When the card last changed, edits and reorders alike."""
  updatedAt: DateTime!
}

"""Reading the intake casework as aggregates rather than rows."""
type AdminAnalyticsQuery {
  """
  One filtered set of applications, counted along every reporting dimension.

  **Use case:** the analytics panel on `/admin`. Takes the queue's own filter
  shape minus paging, and describes exactly the set `intake.queue` would list
  under the same filters — the counts and the rows can never disagree.
  """
  summary(
    """Filters, all optional, combined with AND. Omit for the whole intake."""
    input: AdminIntakeAnalyticsInput
  ): AdminAnalyticsSummaryResult!
}

"""Reading the programme cycles and their rules."""
type AdminProgrammeCycleQuery {
  """
  Every cycle, newest first.

  **Use case:** `/admin/cycles`. Filters combine with AND.
  """
  list(
    """How many to return, 1–100. Defaults to 20."""
    first: Int

    """The previous page's `endCursor`. Opaque; omit for the first page."""
    after: String

    """Include removed draft cycles. Defaults to false."""
    includeDeleted: Boolean

    """Only cycles in this lifecycle state."""
    status: ProgrammeCycleStatus

    """Only cycles for this policy year."""
    cycleYear: Int

    """
    Matches the **start** of the cycle code, case-insensitively. A prefix
    match rather than a search.
    """
    search: String
  ): AdminCycleConnectionResult!

  """
  One cycle with its complete rule set.

  **Use case:** `/admin/cycles/$id`, and the editor that seeds a new cycle
  from an existing one.
  """
  byId(
    """Which cycle."""
    id: ID!
  ): AdminCycleResult!

  """
  A short-lived download URL for one version of a cycle's policy PDF.

  **Use case:** the download links on the policy document card. Fetched on
  click — the URL expires in minutes, so it must never sit in a cached query.

  **Refuses:** a missing document, and any version whose latest scan verdict
  is not ACCEPTED.
  """
  policyDocumentDownloadUrl(
    """The cycle whose policy PDF to download."""
    cycleId: ID!

    """Which retained version. Omit for the current one."""
    version: Int
  ): DocumentDownloadResult!

  """
  How many applications sit in each status for one cycle.

  **Use case:** the summary on a cycle's page, and deciding whether a cycle
  can safely be closed.
  """
  counts(
    """Which cycle."""
    id: ID!
  ): AdminCycleCountsResult!

  """
  What has happened to one cycle: opened, edited, closed, archived.

  **Use case:** the history on `/admin/cycles/$id`. Newest first, and capped
  rather than paged — it is a short tail, not a list to walk.
  """
  events(
    """Which cycle."""
    id: ID!

    """How many of the most recent to return, 1–100. Defaults to 20."""
    first: Int
  ): AdminCycleEventsResult!
}

"""Reading applications as they arrive and are reviewed."""
type AdminIntakeQuery {
  """
  The work queue, filtered and ordered as the office needs it.

  **Use case:** `/admin/queue`. Filters combine with AND. `application:read`
  lists every submitted file; `stage:read` lists the files at stages the
  caller's roles own and the files the caller has acted on, and the count
  counts only those.
  """
  queue(
    """Filters, ordering and paging. Every field is optional."""
    input: AdminIntakeQueueInput
  ): AdminApplicationConnectionResult!

  """
  Finds one application by its exact reference number.

  **Use case:** the lookup box, for somebody holding a reference from a letter
  or a phone call. Exact match — use `queue(search:)` for a prefix.
  """
  byReference(
    """The programme's reference, exactly as issued."""
    referenceNumber: String!
  ): AdminApplicationResult!

  """
  One application's whole case file, in a single request.

  **Use case:** `/admin/applications/$id`. Everything the office has on the
  application comes back together so the screen cannot show two moments at
  once, which a dozen separate queries would.
  """
  workspace(
    """The application whose case file to load. Any status but `DRAFT`."""
    applicationId: ID!
  ): AdminWorkspaceResult!

  """
  A short-lived link to one document attached to a submission.

  **Use case:** the download on the workspace. Allowed on any file the caller
  may read — office-wide, or at a stage they work, or one they acted on.

  **Refuses:** a file whose latest malware scan is not accepted, and a draft
  application, which is refused identically to one that does not exist.
  """
  documentDownloadUrl(
    """Which application the document belongs to."""
    applicationId: ID!

    """
    Which pinned document. This is the submission's copy, not the applicant's
    document id — a submission freezes the exact version it carried.
    """
    submissionDocumentId: ID!
  ): DocumentDownloadResult!
}

"""
How the queue is filtered, ordered and paged.

Every field is optional and they combine with AND.
"""
input AdminIntakeQueueInput {
  """How many to return, 1–100. Defaults to 20."""
  first: Int

  """
  The previous page's `endCursor`. Opaque, and it remembers which ordering it
  came from — reusing a cursor under a different `order` is refused rather
  than silently seeking against the wrong column.
  """
  after: String

  """Only applications in this programme cycle."""
  cycleId: ID

  """
  Only applications in this status. Mutually exclusive with `queue`.
  """
  status: ApplicationStatus

  """Only applications at this phase: 1 for a first application."""
  phaseNumber: Int

  """Only applications of this kind, one the cycle declares, such as `INITIAL`."""
  applicationKind: String

  """Only the application with this exact reference."""
  referenceNumber: String

  """Only applications from enterprises in this sector."""
  sector: BusinessSector

  """Only applications in this funding band."""
  category: ApplicationCategory

  """Only applications submitted at or after this instant."""
  submittedFrom: DateTime

  """Only applications submitted at or before this instant."""
  submittedTo: DateTime

  """
  Which column to order by. Defaults to oldest waiting — the order the office
  works in. A cursor belongs to whichever ordering produced it.
  """
  order: AdminIntakeOrder

  """
  Matches the **start** of a reference number or an enterprise name,
  case-insensitively. A prefix match rather than a search: a word from the
  middle of a name finds nothing, and the interface says so.
  """
  search: String

  """
  Only applications in any of these funding bands. When given and non-empty
  this **supersedes** `category`; an empty list means no category filter.
  """
  categories: [ApplicationCategory!]

  """
  Only applications from enterprises in any of these sectors. When given and
  non-empty this **supersedes** `sector`; an empty list means no sector filter.
  """
  sectors: [BusinessSector!]

  """
  Only applications from enterprises operating in any of these districts,
  read live from the enterprise profile. An empty list filters nothing.
  """
  districts: [TripuraDistrict!]

  """
  Only applications in any of these statuses. When given and non-empty this
  **supersedes** `status`, and it is refused alongside `queue` for the same
  reason `status` is. An empty list means no status filter.
  """
  statuses: [ApplicationStatus!]

  """
  Only applications in any of these programme cycles. When given and non-empty
  this **supersedes** `cycleId`; an empty list means no cycle filter.
  """
  cycleIds: [ID!]

  """
  Only applications from enterprises constituted under any of these
  instruments, read live from the enterprise profile. An empty list filters
  nothing.
  """
  registrationTypes: [RegistrationType!]

  """
  Only applications asking for at least this many paise, **inclusive**. An
  application whose requested amount is unanswered or unreadable never
  matches an amount bound.
  """
  requestedMinPaise: Money

  """Only applications asking for at most this many paise, **inclusive**."""
  requestedMaxPaise: Money

  """
  Only applications asking for a loan of at least this many paise,
  **inclusive**. An application that asked for no loan never matches.
  """
  loanRequestedMinPaise: Money

  """Only applications asking for a loan of at most this many paise, **inclusive**."""
  loanRequestedMaxPaise: Money

  """Only applications worked in this pipeline."""
  pipelineId: ID

  """
  Only applications at any of these stages of `pipelineId`, which must be
  given with them. An empty list filters nothing.
  """
  stageKeys: [String!]

  """Only applications holding **every** one of these status flags. At most 8."""
  flags: [String!]
}

"""
The district a Tripura enterprise operates in.

The same closed eight-value set the enterprise profile stores — prose
spellings of one place would silently split a district's count in two.
"""
enum TripuraDistrict {
  """Dhalai district."""
  DHALAI

  """Gomati district."""
  GOMATI

  """Khowai district."""
  KHOWAI

  """North Tripura district."""
  NORTH_TRIPURA

  """Sepahijala district."""
  SEPAHIJALA

  """South Tripura district."""
  SOUTH_TRIPURA

  """Unakoti district."""
  UNAKOTI

  """West Tripura district."""
  WEST_TRIPURA
}

"""
How the analytics summary is filtered: the queue's filters, minus paging.

Every field is optional and they combine with AND, exactly as they do on
`AdminIntakeQueueInput` — the summary describes the set the queue would list.
"""
input AdminIntakeAnalyticsInput {
  """Only applications in this programme cycle."""
  cycleId: ID

  """
  Only applications in any of these cycles. Supersedes `cycleId` when given
  and non-empty; an empty list filters nothing.
  """
  cycleIds: [ID!]

  """Only applications in this status. Mutually exclusive with `queue`."""
  status: ApplicationStatus

  """
  Only applications in any of these statuses. Supersedes `status` when given
  and non-empty, and is refused alongside `queue` just as `status` is.
  """
  statuses: [ApplicationStatus!]

  """Only applications at this phase: 1 for a first application."""
  phaseNumber: Int

  """Only applications of this kind, one the cycle declares, such as `INITIAL`."""
  applicationKind: String

  """Only the application with this exact reference."""
  referenceNumber: String

  """
  Matches the **start** of a reference number or an enterprise name,
  case-insensitively — the same prefix rule the queue applies.
  """
  search: String

  """Only applications from enterprises in this sector."""
  sector: BusinessSector

  """
  Only applications from enterprises in any of these sectors. Supersedes
  `sector` when given and non-empty; an empty list filters nothing.
  """
  sectors: [BusinessSector!]

  """Only applications in this funding band."""
  category: ApplicationCategory

  """
  Only applications in any of these funding bands. Supersedes `category`
  when given and non-empty; an empty list filters nothing.
  """
  categories: [ApplicationCategory!]

  """
  Only applications from enterprises operating in any of these districts,
  read live from the enterprise profile. An empty list filters nothing.
  """
  districts: [TripuraDistrict!]

  """
  Only applications from enterprises constituted under any of these
  instruments. An empty list filters nothing.
  """
  registrationTypes: [RegistrationType!]

  """Only applications submitted at or after this instant."""
  submittedFrom: DateTime

  """Only applications submitted at or before this instant."""
  submittedTo: DateTime

  """
  Only applications asking for at least this many paise, **inclusive**. An
  unanswered or unreadable requested amount never matches an amount bound.
  """
  requestedMinPaise: Money

  """Only applications asking for at most this many paise, **inclusive**."""
  requestedMaxPaise: Money
}

"""Which column the queue is ordered by."""
enum AdminIntakeOrder {
  """Longest-waiting first, by submission time. The order work is done in."""
  OLDEST_WAITING

  """Most recently submitted first."""
  NEWEST_SUBMISSION

  """Most recently touched first, whoever touched it."""
  LAST_ACTIVITY
}

"""
Whether the programme has settled its maximum award.

Unresolved is an honest state rather than a missing value: TTAADC has not yet
stated one authoritative ceiling, and pretending otherwise would put a number
into sanction decisions that nobody approved.
"""
enum FundingCeilingState {
  """No ceiling has been settled. Amounts are not checked against one."""
  UNRESOLVED

  """A ceiling is settled, and `fundingCeilingAmountPaise` carries it."""
  RESOLVED
}

"""What a funding ceiling is measured across."""
enum FundingCeilingScope {
  """Each application separately."""
  APPLICATION

  """Each phase separately."""
  PHASE

  """Everything one enterprise ever receives."""
  ENTERPRISE

  """Everything in one funding chain, across every phase."""
  FUNDING_CASE
}

"""Whose rules a cycle applies."""
enum ProgrammeJurisdiction {
  """The state of Tripura."""
  TRIPURA

  """The Tripura Tribal Areas Autonomous District Council."""
  TTAADC
}

"""A reusable structure a cycle defines, as the editor reads it back."""
type FormGroupDefinition {
  """How the structure is addressed."""
  definitionKey: String!

  """What the structure is called where the editor lists it."""
  label: String!

  """The questions each entry asks, in order."""
  members: [FormGroupDefinitionMember!]!
}

"""One member of a reusable structure, as authored."""
type FormGroupDefinitionMember {
  """How the member is addressed inside its structure."""
  memberKey: String!

  """What kind of answer it takes."""
  fieldType: FormFieldType!

  """The role it plays, where it plays one."""
  role: String

  """The words the applicant reads."""
  label: String!

  """A sentence of guidance under the control."""
  helpText: String

  """Whether an answer is needed in every entry."""
  requirement: FormFieldRequirement!

  """Fewest characters."""
  minLength: Int

  """Most characters."""
  maxLength: Int

  """The format rule, where one is set."""
  pattern: String

  """What to say when the format rule does not match."""
  patternMessage: String

  """Smallest permitted number."""
  minValue: Money

  """Largest permitted number."""
  maxValue: Money

  """Earliest permitted day."""
  minDate: Date

  """Latest permitted day."""
  maxDate: Date

  """`"NOT_FUTURE"` or `"NOT_PAST"`, or null."""
  relativeDateBound: String

  """Ghost text inside the empty control."""
  placeholder: String

  """An inline hint under the control."""
  note: String

  """How to colour the note."""
  tone: String

  """How wide to draw the control."""
  widthHint: String

  """Decoration before the value."""
  prefixText: String

  """Decoration after the value."""
  suffixText: String

  """The HTML `autocomplete` token."""
  autocompleteHint: String

  """Whether to show characters-remaining."""
  showCharCount: Boolean!

  """How many rows a `LONG_TEXT` control opens with."""
  textareaRows: Int

  """Which control draws a choice."""
  choiceStyle: String

  """The choices offered, in order."""
  options: [FormGroupDefinitionMemberOption!]!
}

"""One choice a structure's member offers, as authored."""
type FormGroupDefinitionMemberOption {
  """What is stored when the choice is taken."""
  optionValue: String!

  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card."""
  optionDescription: String

  """A kebab-case icon token for the card rendering."""
  iconName: String
}

"""One programme cycle, as the office sees it."""
type AdminProgrammeCycle {
  """Stable identifier."""
  id: ID!

  """Short code used in correspondence."""
  cycleCode: String!

  """The cycle's name, as shown to applicants."""
  displayName: String!

  """The policy year this cycle belongs to."""
  cycleYear: Int!

  """Guidance written for applicants."""
  applicantGuidance: String

  """
  The cycle's lifecycle state, which is not the same as whether its window is
  open. The window is `opensAt`/`closesAt`.
  """
  status: ProgrammeCycleStatus!

  """When the application window opens. Null while unscheduled."""
  opensAt: DateTime

  """When the window closes. Null while unscheduled."""
  closesAt: DateTime

  """
  Send back as `expectedVersion` when editing. Every rule change makes a new
  version, and applications keep the version they were submitted against.
  """
  currentVersion: Int!

  """When the cycle was created."""
  createdAt: DateTime!

  """When it last changed."""
  updatedAt: DateTime!

  """When a draft cycle was removed, or null while it is listed."""
  deletedAt: DateTime
}

"""
The eligibility and funding rules of one cycle version.

Every value is nullable because every one is genuinely optional: a cycle that
sets no minimum age has none, and that is a decision rather than a gap. The
editor shows them back as they are, so an unconfigured cycle is visible.
"""
type AdminCyclePolicy {
  """Youngest applicant the cycle accepts, in years."""
  minimumApplicantAge: Int

  """Oldest applicant the cycle accepts, in years."""
  maximumApplicantAge: Int

  """
  How many months of trading separates the two funding bands. At or below this
  is `CATEGORY_A`; above it is `CATEGORY_B`.
  """
  categoryAMaximumMonths: Int

  """Whether the applicant must confirm majority ownership."""
  majorityOwnershipRequired: Boolean

  """Whose rules this cycle applies."""
  jurisdiction: ProgrammeJurisdiction

  """
  Whether a maximum award has been settled. `UNRESOLVED` is honest rather than
  missing: no amount is checked against a ceiling nobody has approved.
  """
  fundingCeilingState: FundingCeilingState!

  """The ceiling, in paise. Present only where the state is `RESOLVED`."""
  fundingCeilingAmountPaise: Money

  """What the ceiling is measured across. Present only where `RESOLVED`."""
  fundingCeilingScope: FundingCeilingScope

  """
  The pipeline this cycle's applications are worked in. Its published version
  is pinned when the cycle opens.
  """
  pipelineId: ID!

  """The pinned pipeline version. Null while the cycle is a draft."""
  pipelineVersion: Int
}

"""
Where a stored file stands with the malware scanner. Everything fails closed:
only ACCEPTED may be downloaded or published.
"""
enum AdminDocumentScanStatus {
  """Queued or in progress. Not yet downloadable."""
  PENDING

  """Scanned clean. Downloadable."""
  ACCEPTED

  """The scanner refused it. Upload a clean copy."""
  REJECTED

  """The scanner could not conclude. It will be retried; not downloadable."""
  ERROR
}

"""One retained version of a cycle's policy PDF."""
type AdminCyclePolicyDocumentVersion {
  """1 for the first upload, counting up with each replacement."""
  version: Int!

  """`UPLOAD` for the first version, `REPLACE` for every later one."""
  operation: String!

  """The file's own name, as it uploads and downloads."""
  originalFilename: String!

  """The exact stored size in bytes."""
  sizeBytes: Int!

  """When this version was recorded."""
  uploadedAt: DateTime!

  """This version's scan verdict. Only ACCEPTED may be downloaded."""
  scanStatus: AdminDocumentScanStatus!
}

"""A cycle's policy PDF: the current file and its whole retained history."""
type AdminCyclePolicyDocument {
  """Stable identifier."""
  id: ID!

  """The version currently published. Send back when replacing."""
  currentVersion: Int!

  """The current file's own name."""
  originalFilename: String!

  """The current file's size in bytes."""
  sizeBytes: Int!

  """When the current version was recorded."""
  uploadedAt: DateTime!

  """The current version's scan verdict."""
  scanStatus: AdminDocumentScanStatus!

  """Every retained version, newest first."""
  versions: [AdminCyclePolicyDocumentVersion!]!
}

"""A rule about several answers at once, as a cycle declares it."""
type AdminFormRule {
  """How the rule is addressed. Unique within the form."""
  ruleKey: String!

  """The catalogue's rule type."""
  ruleType: FormRuleType!

  """The form stage its message is shown on."""
  stageKey: String!

  """What the applicant is told when it does not hold."""
  message: String!

  """The fixed limit, for the rule types that take one."""
  limitValue: Money

  """The questions it reads, in order."""
  operands: [AdminFormRuleOperand!]!
}

"""One question a form rule reads."""
type AdminFormRuleOperand {
  """The question's key."""
  fieldKey: String!

  """The question's type."""
  fieldType: FormFieldType!
}

"""A kind of application a cycle accepts, and who may start one."""
type AdminApplicationKind {
  """How the kind is addressed, such as `EXPANSION`."""
  kindKey: String!

  """What the applicant is offered it as."""
  label: String!

  """A sentence more, shown under the label."""
  description: String

  """Every rule an enterprise must meet to start one."""
  rules: [AdminApplicationKindRule!]!
}

"""One eligibility rule of an application kind."""
type AdminApplicationKindRule {
  """The catalogue's rule type."""
  ruleType: EligibilityRuleType!

  """The rule's parameters as a JSON object, keyed as the catalogue declares them."""
  paramsJson: String!
}

"""
One cycle with the complete rule set of its current version.

**Use case:** the cycle editor, which shows every rule back so an unconfigured
cycle is visible rather than assumed.
"""
type AdminCycleAggregate {
  """The cycle itself."""
  head: AdminProgrammeCycle!

  """
  The policy PDF this cycle implements — the order or circular — with its
  whole retained history. Null until one is uploaded; the cycle cannot open
  without one whose scan verdict is ACCEPTED.
  """
  policyDocument: AdminCyclePolicyDocument

  """
  The rules of this cycle's current version — the eligibility bounds, the
  funding ceiling and whose rules apply.

  **These could be written and not read**, which is the state this replaced.
  `ProgrammeCyclePolicyInput` carries all of them and nothing returned any of
  them, so a cycle editor had nothing to populate its fields from and had to
  resend its own defaults on every save — which is how a settled age limit or a
  funding ceiling gets reset without anybody choosing to.
  """
  policy: AdminCyclePolicy!

  """
  The questions this cycle asks, as its current version holds them.

  Null only where the cycle's rows have been edited by hand. This is what the
  cycle editor reads: an administrator cannot change a form they cannot see,
  and until this existed the only way to look at one was to start an
  application against the cycle.
  """
  formTemplate: FormTemplate

  """
  The reusable structures this cycle defines, for the editor. Empty when it
  defines none. The expanded questions they produce appear in `formTemplate`
  like any others; these are the editable definitions behind them.
  """
  groupDefinitions: [FormGroupDefinition!]!

  """
  Rules about several answers at once — "a grant, a loan, or both" — as the
  cycle editor authors them. Ordered by key.
  """
  formRules: [AdminFormRule!]!

  """The kinds of application this cycle accepts, in the order they are offered."""
  applicationKinds: [AdminApplicationKind!]!
}

"""One page of programme cycles."""
type AdminCycleConnection {
  """This page, newest first."""
  nodes: [AdminProgrammeCycle!]!

  """Where this page sits in the whole list."""
  pageInfo: PageInfo!
}

"""How many applications sit in one status."""
type AdminCycleCount {
  """The status counted."""
  status: ApplicationStatus!

  """How many are in it."""
  count: Int!
}

"""A cycle's applications, counted by status."""
type AdminCycleCounts {
  """One entry per status that has applications in it."""
  counts: [AdminCycleCount!]!
}

"""One thing that happened to a programme cycle."""
type AdminCycleEvent {
  """Stable identifier."""
  id: ID!

  """What happened, as a stable code safe to branch on."""
  eventType: String!

  """What to show, including the reason the officer gave."""
  message: String!

  """When it happened."""
  createdAt: DateTime!
}

"""A cycle's recent history."""
type AdminCycleEventList {
  """The events, newest first."""
  events: [AdminCycleEvent!]!
}

"""
One application as a row in the work queue.

Carries the enterprise and cycle names alongside the ids so a queue of twenty
needs no second query per row.
"""
type AdminApplicationQueueItem {
  """Stable identifier."""
  id: ID!

  """The programme's reference. Null while never submitted."""
  referenceNumber: String

  """Which enterprise is applying."""
  enterpriseId: ID!

  """The enterprise's name, so the row needs no second query."""
  enterpriseName: String!

  """Who submitted it."""
  applicantUserId: ID!

  """The cycle this was applied into, whose frozen rules judge it."""
  programmeCycleId: ID!

  """The cycle's short code."""
  cycleCode: String!

  """The enterprise's sector."""
  sector: BusinessSector

  """The funding band this application is for."""
  category: ApplicationCategory

  """1 plus the enterprise's applications of the kinds its cycle declares before this one."""
  phaseNumber: Int!

  """Which of its cycle's kinds this application is, such as `INITIAL`."""
  applicationKind: String!

  """Whether it has been submitted into its pipeline."""
  status: ApplicationStatus!

  """Send back as `expectedStatusVersion` when acting."""
  statusVersion: Int!

  """The stage holding it now. Null once an action has ended its journey."""
  currentStageKey: String

  """When it entered that stage."""
  stageEnteredAt: DateTime

  """The pipeline's status flags it holds now, in the order they were added."""
  statusFlags: [String!]!

  """
  The stage's name in the version the file is worked in. Null once its journey
  has ended, or when that version can no longer be read.
  """
  stageName: String

  """
  The flags it holds, with their office labels from the version it is worked
  in. A flag the version no longer declares reads as its key.
  """
  flags: [AdminStageFlagRef!]!

  """The grant asked for, from the submitted form. Null when the form did not ask."""
  requestedGrantPaise: Money

  """The bank loan asked for, from the submitted form. Null when the form did not ask."""
  requestedLoanPaise: Money

  """When it was first sent in."""
  firstSubmittedAt: DateTime

  """Which submission this row is about, counting from 1."""
  submissionNumber: Int!

  """When that submission arrived."""
  submittedAt: DateTime!

  """When the status last changed."""
  statusChangedAt: DateTime!

  """When anything about it last changed."""
  updatedAt: DateTime!
}

"""One application's workflow position, as the office acts on it."""
type AdminApplicationState {
  """Stable identifier."""
  id: ID!

  """The programme's reference. Null while never submitted."""
  referenceNumber: String

  """Whether it has been submitted into its pipeline."""
  status: ApplicationStatus!

  """Send back as `expectedStatusVersion` when acting."""
  statusVersion: Int!

  """Which of its cycle's kinds this application is."""
  applicationKind: String!

  """The pipeline it is worked in, pinned from its cycle when it started."""
  pipelineId: ID!

  """The pinned pipeline version."""
  pipelineVersion: Int!

  """The stage holding it now. Null once an action has ended its journey."""
  currentStageKey: String

  """When it entered that stage."""
  stageEnteredAt: DateTime

  """The stages it came through, oldest first: what "send back" returns along."""
  stageTrail: [String!]!

  """The pipeline's status flags it holds now."""
  statusFlags: [String!]!

  """
  Who submitted it.

  Exposed so the office screen can tell a member of staff that the file in
  front of them is their own. Acting on it is permitted; doing so without
  saying so is not, and the form cannot ask for the disclosure without this.
  """
  applicantUserId: ID!

  """When anything about it last changed."""
  updatedAt: DateTime!
}

"""
A member of staff, resolved rather than left as an id nobody can read.

Every row on a page is looked up together, so a queue of twenty costs one
query rather than twenty.
"""
type StaffMember {
  """Stable identifier."""
  id: ID!

  """Their sign-in address, which is how the office refers to each other."""
  email: String!

  """
  The roles held **now**, which is what decides what they can do — not the
  roles they held when they acted.
  """
  roles: [String!]!
}

"""One page of the work queue."""
type AdminApplicationConnection {
  """This page, in the requested order."""
  nodes: [AdminApplicationQueueItem!]!

  """Where this page sits in the whole queue."""
  pageInfo: PageInfo!
}

"""How many of the filtered applications sit in one workflow status."""
type AdminAnalyticsStatusCount {
  """The workflow status counted."""
  status: ApplicationStatus!

  """How many of the filtered applications are in it."""
  count: Int!
}

"""How many of the filtered applications fall in one funding band."""
type AdminAnalyticsCategoryCount {
  """
  The funding band counted. Null groups the applications submitted under a
  cycle that set no operating-months threshold, which have no band.
  """
  category: ApplicationCategory

  """How many of the filtered applications are in it."""
  count: Int!
}

"""How many of the filtered applications come from one sector."""
type AdminAnalyticsSectorCount {
  """
  The sector counted, read live from each enterprise profile. Null groups
  the enterprises whose profile predates the sector question.
  """
  sector: BusinessSector

  """How many of the filtered applications are in it."""
  count: Int!
}

"""How many of the filtered applications come from one district."""
type AdminAnalyticsDistrictCount {
  """
  The district counted, read live from each enterprise profile. Null groups
  the enterprises whose profile predates the district question.
  """
  district: TripuraDistrict

  """How many of the filtered applications are in it."""
  count: Int!
}

"""How many of the filtered applications belong to one programme cycle."""
type AdminAnalyticsCycleCount {
  """Which cycle these were applied into."""
  cycleId: ID!

  """The cycle's short code, so a chart needs no second query."""
  cycleCode: String!

  """How many of the filtered applications belong to it."""
  count: Int!
}

"""How many of the filtered applications arrived in one calendar month."""
type AdminAnalyticsMonthCount {
  """The calendar month, in UTC, as `YYYY-MM`."""
  month: String!

  """How many of the filtered applications were last submitted in it."""
  count: Int!
}

"""
What the filtered applications asked for, in aggregate.

Read from the same role-bound answer the queue's amount filter reads, with the
same guard: an application whose requested amount is unanswered or unreadable
contributes to none of these figures rather than failing the summary.
"""
type AdminAnalyticsRequested {
  """How many of the filtered applications carry a readable requested amount."""
  count: Int!

  """Everything asked for, summed, in paise. Null when nothing is readable."""
  totalPaise: Money

  """
  The mean ask, in paise, rounded to the nearest paisa. Null when nothing is
  readable.
  """
  averagePaise: Money
}

"""
One filtered set of applications, counted along every reporting dimension.

Each dimension groups the same set independently, biggest bucket first, and
only buckets that hold something appear — except `monthly`, which reads
chronologically. The counts across any one dimension always sum to the same
total the queue would report for these filters.
"""
type AdminAnalyticsSummary {
  """The set by workflow status, biggest bucket first."""
  statuses: [AdminAnalyticsStatusCount!]!

  """The set by funding band, biggest bucket first."""
  categories: [AdminAnalyticsCategoryCount!]!

  """The set by enterprise sector, biggest bucket first."""
  sectors: [AdminAnalyticsSectorCount!]!

  """The set by enterprise district, biggest bucket first."""
  districts: [AdminAnalyticsDistrictCount!]!

  """The set by programme cycle, biggest bucket first."""
  cycles: [AdminAnalyticsCycleCount!]!

  """What the set asked for, in aggregate."""
  requested: AdminAnalyticsRequested!

  """The set by the month its newest submission arrived, oldest month first."""
  monthly: [AdminAnalyticsMonthCount!]!
}

"""
One stop on an enterprise’s journey through the programme: an application,
placed by its phase and the cycle that hosted it.
"""
type AdminCaseHistoryEntry {
  """Which application."""
  id: ID!

  """Its reference, or null while it was never submitted."""
  referenceNumber: String

  """Which of its cycle's kinds it was."""
  applicationKind: String!

  """Which funding phase of this enterprise it pursued."""
  phaseNumber: Int!

  """Whether it was submitted."""
  status: ApplicationStatus!

  """The status flags it holds now — how its journey went, or is going."""
  statusFlags: [String!]!

  """The cycle that hosted the attempt."""
  cycleCode: String!

  """When the attempt began."""
  createdAt: DateTime!
}

"""
One application's whole case file.

Returned in a single request so the screen cannot show two moments at once.
Internal notes are here because this is the staff namespace; nothing in it is
reachable by an applicant.
"""
type AdminWorkspace {
  """The application's workflow position. Null if it could not be read."""
  application: AdminApplicationState

  """The enterprise's name."""
  enterpriseName: String

  """The cycle's short code."""
  cycleCode: String

  """The cycle's name."""
  cycleDisplayName: String

  """
  The enterprise’s whole journey with the programme, oldest attempt first —
  every application of this funding case, this one included. A reviewer reads
  where this attempt sits: a first try, a retry after a rejection, or a later
  phase after funding.
  """
  caseHistory: [AdminCaseHistoryEntry!]!

  """Every formal submission, oldest first."""
  submissions: [AdminSubmission!]!

  """The exact form as each submission froze it."""
  snapshots: [ApplicationSnapshot!]!

  """The exact document versions each submission carried."""
  documents: [AdminSubmittedDocument!]!

  """What changed between consecutive submissions."""
  submissionChanges: [AdminSubmissionChange!]!

  """
  The form this application was filled against.

  Null only where the cycle's rows have been edited by hand. Every stage and
  field named on this screen comes from here, so a reviewer choosing which
  stages to reopen is choosing from this application's own — and the API
  refuses any other.
  """
  formTemplate: FormTemplate

  """Every correction request, including resolved and cancelled ones."""
  revisions: [AdminRevision!]!

  """Staff-only notes. Never shown to an applicant."""
  notes: [AdminInternalNote!]!
}

"""One formal submission of an application."""
type AdminSubmission {
  """Stable identifier."""
  id: ID!

  """Which submission this is, counting from 1."""
  submissionNumber: Int!

  """Which form version it froze."""
  applicationVersion: Int!

  """When it arrived."""
  submittedAt: DateTime!
}

"""
One document exactly as a submission froze it.

Replacing a file afterwards makes a new version and cannot change what was
reviewed here.
"""
type AdminSubmittedDocument {
  """Stable identifier for this pinned copy."""
  id: ID!

  """Which submission pinned it."""
  submissionId: ID!

  """The applicant's document slot it came from."""
  documentId: ID!

  """Which `FILE` question of the form it answers."""
  fieldKey: String!

  """The exact version pinned."""
  documentVersion: Int!

  """The file's name as the applicant uploaded it."""
  originalFilename: String!

  """The file's media type."""
  contentType: String!

  """The file's size in bytes."""
  sizeBytes: Int!
}

"""What changed between two consecutive submissions."""
type AdminSubmissionChange {
  """The earlier submission."""
  fromSubmissionNumber: Int!

  """The later submission."""
  toSubmissionNumber: Int!

  """
  The stages that differ. The same comparison the applicant is shown, so the
  two can never disagree about what changed.
  """
  stageKeys: [String!]!
}

"""One correction the office asked the applicant for."""
type AdminRevision {
  """Stable identifier."""
  id: ID!

  """Which stage of the form, from `FormStage.key`."""
  stageKey: String!

  """What was asked for. Shown to the applicant."""
  note: String!

  """When it was asked."""
  requestedAt: DateTime!

  """When the applicant resubmitted addressing it."""
  resolvedAt: DateTime

  """When the office withdrew it. A request made in error is cancelled."""
  cancelledAt: DateTime
}

"""
One staff-only note.

Append-only: a correction is a new note pointing at the one it replaces, so
nothing written about an application can quietly disappear.
"""
type AdminInternalNote {
  """Stable identifier."""
  id: ID!

  """The note this one corrects. Null for an original note."""
  correctionOfNoteId: ID

  """What was written."""
  note: String!

  """Who wrote it."""
  authoredByUserId: ID!

  """When."""
  createdAt: DateTime!
}

"""One cycle with its rules, or the reason the operation was refused."""
type AdminCycleResult implements BaseResponse {
  """Whether the operation succeeded."""
  success: Boolean!

  """
  What to show when `success` is false — a stale `expectedVersion`, an invalid
  policy, or a transition the cycle's state does not allow.
  """
  message: String

  """The cycle and its rules. Null whenever `success` is false."""
  response: AdminCycleAggregate
}

"""One page of cycles, or the reason there is none."""
type AdminCycleConnectionResult implements BaseResponse {
  """Whether the page was returned."""
  success: Boolean!

  """What to show when `success` is false."""
  message: String

  """The page. Null whenever `success` is false."""
  response: AdminCycleConnection
}

"""A cycle's applications counted by status, or the reason there is none."""
type AdminCycleCountsResult implements BaseResponse {
  """Whether the counts were returned."""
  success: Boolean!

  """What to show when `success` is false."""
  message: String

  """The counts. Null whenever `success` is false."""
  response: AdminCycleCounts
}

"""A cycle's history, or the reason there is none."""
type AdminCycleEventsResult implements BaseResponse {
  """Whether the history was returned."""
  success: Boolean!

  """What to show when `success` is false."""
  message: String

  """The events. Null whenever `success` is false."""
  response: AdminCycleEventList
}

"""One application's workflow position, or the reason it was refused."""
type AdminApplicationResult implements BaseResponse {
  """Whether the operation succeeded."""
  success: Boolean!

  """
  What to show when `success` is false — chiefly a stale
  `expectedStatusVersion`, meaning somebody else acted first.
  """
  message: String

  """The application. Null whenever `success` is false."""
  response: AdminApplicationState
}

"""One page of the queue, or the reason there is none."""
type AdminApplicationConnectionResult implements BaseResponse {
  """Whether the page was returned."""
  success: Boolean!

  """
  What to show when `success` is false — an invalid page size, a cursor from a
  different ordering, or `queue` and `status` supplied together.
  """
  message: String

  """The page. Null whenever `success` is false."""
  response: AdminApplicationConnection
}

"""The analytics summary, or the reason there is none."""
type AdminAnalyticsSummaryResult implements BaseResponse {
  """Whether the summary was returned."""
  success: Boolean!

  """
  What to show when `success` is false — an inverted date or amount range, or
  `queue` combined with a status filter.
  """
  message: String

  """The summary. Null whenever `success` is false."""
  response: AdminAnalyticsSummary
}

"""One case file, or the reason the operation was refused."""
type AdminWorkspaceResult implements BaseResponse {
  """Whether the operation succeeded."""
  success: Boolean!

  """
  What to show when `success` is false: a missing staff role, a draft
  application, or a stale `expectedStatusVersion`.
  """
  message: String

  """The case file as it now stands. Null whenever `success` is false."""
  response: AdminWorkspace
}
