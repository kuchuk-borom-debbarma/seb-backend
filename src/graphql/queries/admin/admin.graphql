  """Stable identifier."""
  id: ID!

  """The note this one corrects. Null for an original note."""
  correctionOfNoteId: ID

  """What was written."""
  note: String!

  """Who wrote it."""
  authoredByUserId: ID!

  """When."""
  createdAt: DateTime!
}

"""One completed desk review."""
