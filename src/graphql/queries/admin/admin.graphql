  currentVersion: Int!
}

"""One application on a committee agenda."""
type AdminAgendaItem {
  """Stable identifier."""
  id: ID!

  """The application this item puts before the committee."""
  applicationId: ID!

  """Which submission is before the committee."""
  submissionId: ID!

  """Which bank outcome accompanies it."""
  bankOutcomeId: ID!

  """Where it sits on the agenda, counting from 1."""
  position: Int!

  """Whether the item is still active, as a stable code."""
  status: String!

  """Send back as `expectedVersion` when acting."""
  currentVersion: Int!
}

