"""
type AdminBankOutcomeRecord {
  """Stable identifier."""
  id: ID!

  """What the bank concluded."""
  outcome: BankOutcome!

  """The bank's own reference."""
  decisionReference: String!

  """The date the bank decided."""
  decisionDate: Date!

  """The wording shown to the applicant."""
  applicantSummary: String!

  """When the office recorded it."""
