  """
  Whether the officer said they were the applicant on this file.

  True marks a decision, or a correction of one, taken by the person it
  concerns — allowed once declared. A correction carries its own answer, so a
  superseding record may differ from the one it replaces.
  """
  conflictAcknowledged: Boolean!
}

