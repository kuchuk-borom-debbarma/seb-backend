scalar DateTime

# Every operation-specific result implements the same safe client envelope.
interface BaseResponse {
  success: Boolean!
  message: String
}

enum UserRole {
  APPLICANT
  ADMIN
  SUPER_ADMIN
}

type StartApplicantSignupResponse {
  challengeToken: String!
  expiresAt: DateTime!
}

# Roles are the caller's live grants. A person may hold more than one, and an
# administrator may hold none of APPLICANT.
type User {
  id: ID!
  email: String!
  emailVerified: Boolean!
  roles: [UserRole!]!
  createdAt: DateTime!
}

# Public browser-safe session data. Raw tokens and token digests are absent.
type Session {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  expiresAt: DateTime!
  ipAddress: String
  userAgent: String
  current: Boolean!
}

type AuthResponse {
  user: User!
  session: Session!
}

type SessionsResponse {
  sessions: [Session!]!
}

type BooleanResponse {
  value: Boolean!
}

type StartApplicantSignupResult implements BaseResponse {
  success: Boolean!
  message: String
  response: StartApplicantSignupResponse
}

type UserResult implements BaseResponse {
  success: Boolean!
  message: String
  response: User
}

type AuthResult implements BaseResponse {
  success: Boolean!
  message: String
  response: AuthResponse
}

type SessionsResult implements BaseResponse {
  success: Boolean!
  message: String
  response: SessionsResponse
}

type BooleanResult implements BaseResponse {
  success: Boolean!
  message: String
  response: BooleanResponse
}

# Shared vocabulary used by both the administrative and applicant surfaces.
# Declared here so neither namespace's SDL depends on the other being loaded.
enum ProgrammeCycleStatus { DRAFT OPEN CLOSED ARCHIVED }
enum AwardStatus { ACTIVE SUSPENDED CANCELLED CLOSED }
enum AwardClosureDisposition { RELEASES_COMPLETE REMAINDER_NOT_RELEASED }
enum AssessmentType { UTILIZATION PERFORMANCE FINANCIAL_AUDIT }
enum AssessmentOutcome { PASSED FAILED }

type Health {
  name: String!
  status: String!
  bindings: [String!]!
}

type Query {
  health: Health!
}

type Mutation {
  _empty: Boolean
}
