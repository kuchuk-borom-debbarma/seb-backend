extend type Mutation {
  """
  Changing what an account may do.

  **Use case:** `/admin/access` and `/admin/invite`. Granting and revoking
  directly requires super-administrator authority; inviting requires less.
  """
  access: AccessMutation!
}

"""Grants a role directly, with a step-up confirmation."""
input GrantRoleInput {
  """Which account."""
  userId: ID!

  """
  Which authority to grant, by key: `SUPER_ADMIN`, or the key of a composed
  role.

  `APPLICANT` is refused. It is created only by verified signup and nothing can
  grant it back, so allowing it here would let one later revocation strip
  somebody permanently with no recovery path.
  """
  roleKey: String!

  """Why, kept in the account's retained history."""
  reason: String!

  """
  The **caller's own** password, re-entered.

  A step-up confirmation required before any change to another person's
  authority: it is verified against the caller's account, not the subject's.
  """
  currentPassword: String!
}

"""Closes one role grant."""
input RevokeRoleInput {
  """
  Which grant to close.

  Names the exact grant rather than the role, so acting on a row that has
  already changed fails loudly instead of quietly resolving to a different
  one.
  """
  grantId: ID!

  """Why, kept with the closed grant."""
  reason: String!

  """The caller's own password, re-entered as a step-up confirmation."""
  currentPassword: String!
}

"""
Invites somebody to take a role themselves.

No password confirmation: inviting grants nothing on its own. The role lands
only when the invited person accepts, which is a second act by a second party —
so this is not the step-up moment a direct grant is.
"""
input InviteRoleInput {
  """
  Which account to invite. They must already have signed up — an invitation
  changes what an existing account may do rather than creating one.
  """
  userId: ID!

  """
  Which composed role to offer, by key.

  An invitation may not exceed the issuer's own authority: you may offer only a
  role whose permissions you already hold yourself. Read `invitableRoles` for
  the list rather than filtering one here. Nobody is ever invited to
  `SUPER_ADMIN`.
  """
  roleKey: String!

  """Why, kept in the account's retained history."""
  reason: String!
}

"""
What was sent, and to whom.

Deliberately carries **no link**. An issuer able to read it could forward it,
and the invitee's own mailbox is what makes possession of the link mean
anything.
"""
type RoleInvitation {
  """The address it went to."""
  email: String!

  """The key of the role offered."""
  role: String!

  """When the invitation stops working. Forty-eight hours after issue."""
  expiresAt: DateTime!
}

"""The sent invitation, or the reason it was not sent."""
type RoleInvitationResult implements BaseResponse {
  """Whether the invitation was sent."""
  success: Boolean!

  """
  What to show when `success` is false — an account that does not exist, or a
  role beyond what the caller may offer.
  """
  message: String

  """What was sent. Null whenever `success` is false."""
  response: RoleInvitation
}

"""The role the invited person now holds."""
type AcceptedRoleInvitation {
  """
  The role now held. Their applicant access was exchanged for it, not added
  to — so anything cached about who they are is wrong rather than stale.
  """
  role: String!
}

"""The accepted role, or the reason the invitation was not usable."""
type AcceptedRoleInvitationResult implements BaseResponse {
  """Whether the invitation was accepted."""
  success: Boolean!

  """
  What to show when `success` is false.

  Every way an invitation can fail — wrong key, altered bytes, expired,
  already accepted, address since changed — returns the **same** message, so
  the failure reveals nothing about which one it was.
  """
  message: String

  """The role now held. Null whenever `success` is false."""
  response: AcceptedRoleInvitation
}

"""Names a new role. It starts able to do nothing."""
input CreateRoleInput {
  """
  The stable machine name, such as `DESK_REVIEWER`. Two to sixty-three
  characters of A–Z, 0–9 and underscore, starting with a letter. Never reused
  once retired, and the six names the server decides for itself are refused.
  """
  key: String!

  """What the office will call it on screen."""
  name: String!

  """Why it exists, for whoever later decides whether to hand it out."""
  description: String!
}

"""Rewrites a role's name, purpose and everything it may do."""
input UpdateRoleInput {
  """Identifies the role being rewritten."""
  roleId: ID!

  """
  The `version` read with the role. An edit against a stale number refuses
  rather than overwriting whatever landed in between.
  """
  expectedVersion: Int!

  """What the office calls it on screen."""
  name: String!

  """Why it exists."""
  description: String!

  """
  The complete set it should hold from now on, not the ones being added.

  Sent whole because a role is live while it is edited: a sequence of smaller
  changes would authorize its holders against each half-finished state in turn.
  Anything absent is taken off.
  """
  permissions: [PermissionInput!]!

  """
  The **caller's own** password, re-entered.

  Required here and not on creation, because this moves what every holder may
  do the instant it lands.
  """
  currentPassword: String!
}

"""One resource and act, as sent when composing a role."""
input PermissionInput {
  """Which kind of record, as `permissionCatalogue` names it."""
  resource: String!

  """Which act on it, as `permissionCatalogue` names it."""
  action: String!
}

"""Takes a role out of use, closing every grant of it."""
input DeleteRoleInput {
  """Identifies the role being retired."""
  roleId: ID!

  """The `version` read with the role."""
  expectedVersion: Int!

  """Why it is being retired, kept with the retired role."""
  reason: String!

  """The caller's own password, re-entered as a step-up confirmation."""
  currentPassword: String!
}

"""What retiring a role did."""
type RetiredRole {
  """The key of the role that was retired."""
  key: String!

  """
  How many live grants were closed with it.

  Everybody counted here loses that authority on their very next request, which
  is why the count is shown before the control as well as after.
  """
  grantsClosed: Int!
}

"""The retired role, or the reason it could not be retired."""
type RetiredRoleResult implements BaseResponse {
  """Whether the role was retired."""
  success: Boolean!

  """What to show when `success` is false — a stale version, or a wrong password."""
  message: String

  """What was retired. Null whenever `success` is false."""
  response: RetiredRole
}

"""Changing what an account may do."""
type AccessMutation {
  """
  Names a new role, holding nothing yet.

  **Use case:** `/admin/roles`. Naming a role and deciding what it may do are
  two acts, so a half-configured role is never live.

  **Refuses:** a key another role already uses, a key the server reserves for
  itself, and any caller who is not a super administrator.
  """
  createRole(
    """What to call it and why it exists."""
    input: CreateRoleInput!
  ): RoleResult!

  """
  Rewrites a role's name, purpose and permissions.

  **Use case:** the editor on `/admin/roles`. Every holder's authority moves the
  moment this lands, which is why it takes a re-entered password and a version.

  **Refuses:** a stale `expectedVersion`, a pair this server cannot enforce, a
  wrong password, and any caller who is not a super administrator.
  """
  updateRole(
    """Which role, what it becomes, the version, and the caller's password."""
    input: UpdateRoleInput!
  ): RoleResult!

  """
  Takes a role out of use and closes every grant of it.

  **Use case:** `/admin/roles`, for a set the office no longer needs. Permitted
  whatever holds it — the holder count is shown beside the control so the cost
  is known first.

  **Refuses:** a stale `expectedVersion`, a wrong password, and any caller who
  is not a super administrator.
  """
  deleteRole(
    """Which role, the version, why, and the caller's password."""
    input: DeleteRoleInput!
  ): RetiredRoleResult!

  """
  Grants a role directly.

  **Use case:** `/admin/access`. Requires super-administrator authority and a
  re-entered password.

  **Refuses:** removing the last super administrator, and a wrong password.
  """
  grantRole(
    """Which account, which role, why, and the caller's password."""
    input: GrantRoleInput!
  ): ManagedUserResult!

  """
  Closes a role grant.

  **Refuses:** the grant that would leave the portal with no super
  administrator — checked inside the write itself, so two operators cannot
  each remove one at the same moment.
  """
  revokeRole(
    """Which grant, why, and the caller's password."""
    input: RevokeRoleInput!
  ): ManagedUserResult!

  """
  Sends an invitation the person accepts themselves.

  **Use case:** `/admin/invite`. The link is emailed and never returned here.

  **Refuses:** a role beyond what the caller may offer.
  """
  inviteRole(
    """Which account, which role, and why."""
    input: InviteRoleInput!
  ): RoleInvitationResult!

  """
  Accepts an emailed invitation, exchanging applicant access for a staff role.

  **Takes no session by design:** possession of the sealed token is the
  credential. It is authenticated so it cannot be edited, expires in
  forty-eight hours, is void if the account's address changed since it was
  sent, and works exactly once.

  **Use case:** `/invite`, where the token arrives in the URL fragment so it
  never reaches a server log.
  """
  acceptRoleInvite(
    """The sealed token from the emailed link."""
    token: String!
  ): AcceptedRoleInvitationResult!
}
