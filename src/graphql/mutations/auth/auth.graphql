extend type Mutation {
  auth: AuthMutation!
}

# Starting signup sends an OTP but returns a separate high-entropy challenge.
input StartApplicantSignupInput {
  email: String!
}

input VerifyApplicantSignupInput {
  challengeToken: String!
  otp: String!
  password: String!
}

input SignInInput {
  email: String!
  password: String!
}

type AuthMutation {
  # Creates an independent ten-minute challenge without revealing account existence.
  startApplicantSignup(input: StartApplicantSignupInput!): StartApplicantSignupResult!
  # Creates a verified applicant only; the caller signs in separately for a session.
  # Registration can never grant an administrative role.
  verifyApplicantSignup(input: VerifyApplicantSignupInput!): UserResult!
  # Accepts any person holding at least one active role, applicant or administrator.
  signIn(input: SignInInput!): AuthResult!
  signOut: BooleanResult!
  revokeSession(sessionId: ID!): BooleanResult!
  revokeOtherSessions: BooleanResult!
  revokeAllSessions: BooleanResult!
}
