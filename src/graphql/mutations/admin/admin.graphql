}

"""What `issuePolicyDocumentUpload` needs to authorize one policy PDF."""
input IssuePolicyDocumentUploadInput {
  """Which cycle the document belongs to."""
  cycleId: ID!

  """
  The policy document version this upload expects to replace: 0 for the first
  upload, otherwise the current version. A mismatch refuses.
  """
  expectedDocumentVersion: Int!

  """The file's own name, ending in `.pdf`. Stored and served back."""
  originalFilename: String!

  """The file's MIME type. Only `application/pdf` is accepted."""
  contentType: String!

  """The exact size in bytes. The stored object must match."""
  sizeBytes: Int!

  """The base64-encoded SHA-256 of the bytes. The stored object must match."""
  checksumSha256: String!
}

"""Which authorized upload `finalizePolicyDocumentUpload` settles."""
input FinalizePolicyDocumentUploadInput {
  """The `uploadId` that `issuePolicyDocumentUpload` returned."""
  uploadId: ID!
}

"""
Creating and operating programme cycles.

**Use case:** the screens under `/admin/cycles`. Requires the authority to
administer the programme — a reviewer or approver reaches none of this.
"""
type AdminProgrammeCycleMutation {
  """
  Creates a cycle as a draft.

  **Use case:** `/admin/cycles/new`. Nothing can be applied to until `open`.

  **Refuses:** a duplicate cycle code, a closing time at or before the
  opening, a policy whose rules repeat a document type, and
  a reason code that is not well formed.
  """
  create(
    """The whole cycle: identity, window and rules."""
    input: ProgrammeCycleInput!
  ): AdminCycleResult!

  """
  Replaces a draft cycle's rules.

  **Use case:** `/admin/cycles/$id` while the cycle is still a draft. This is
  the **only** way to change a cycle's rules — once open, only the guidance
  and the closing time may move, so that applications cannot be judged by
  rules that changed under them.

  **Refuses:** a cycle that is not a draft, and a stale `expectedVersion`.
  """
  updateDraft(
    """Which cycle, at which version, and the whole replacement."""
    input: UpdateProgrammeCycleInput!
  ): AdminCycleResult!

  """
  Opens a cycle for applications.

  **Use case:** the button on `/admin/cycles/$id`. Irreversible: an opened
  cycle can be closed but never returned to draft, and never deleted.

  **Refuses:** a cycle whose rules are incomplete, and a stale
  `expectedVersion`.
  """
  open(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Authorizes uploading the cycle's policy PDF — the order or circular the
  cycle implements.

  **Use case:** the policy document card on `/admin/cycles/$id`. The browser
  PUTs the file to the returned URL, then calls `finalizePolicyDocumentUpload`.
  Allowed while the cycle is a draft or open; a replacement becomes a new
  retained version.

  **Refuses:** anything but a PDF, a file over the document size limit, a bad
  checksum, a closed or archived cycle, and a stale `expectedDocumentVersion`.
  """
  issuePolicyDocumentUpload(
    """The cycle, the expected version, and the file's vital statistics."""
    input: IssuePolicyDocumentUploadInput!
  ): UploadAuthorizationResult!

  """
  Records an uploaded policy PDF as the cycle's current policy document.

  **Use case:** immediately after the PUT that `issuePolicyDocumentUpload`
  authorized. Verifies the stored bytes match the authorization, then queues
  the malware scan; the file stays undownloadable, and the cycle unopenable,
  until the scan is ACCEPTED.

  **Refuses:** an expired, finalized, or unknown authorization, and bytes
  that do not match what was authorized.
  """
  finalizePolicyDocumentUpload(
    """Which authorization to settle."""
    input: FinalizePolicyDocumentUploadInput!
  ): AdminCycleResult!

  """
  Rewrites the guidance on an open cycle.

  **Use case:** correcting or clarifying instructions mid-cycle. Guidance is
  not a rule, so this is allowed while a cycle is open.
  """
  updateOpenGuidance(
    """Which cycle, at which version, and the replacement wording."""
    input: CycleGuidanceInput!
  ): AdminCycleResult!

  """
  Moves or removes an open cycle's closing time.

  **Use case:** extending a deadline, or lifting it entirely. Closing stops new drafts; it strands
  neither existing submissions nor official correction requests.
  """
  changeClosingTime(
    """Which cycle, at which version, and the new closing time."""
    input: CycleClosingInput!
  ): AdminCycleResult!

  """
  Closes a cycle to new applications.

  Work already in the cycle continues; only starting a new application stops.

  **Refuses:** a stale `expectedVersion`.
  """
  close(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Archives a closed cycle, so it renders as read-only history.

  **Refuses:** a cycle that is not closed, and a stale `expectedVersion`.
  """
  archive(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Removes a draft cycle, reversibly.

  **Refuses:** a cycle that has ever been opened — it is part of the
  programme's record — and a stale `expectedVersion`.
  """
  softDeleteDraft(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Puts a removed draft cycle back.

  **Refuses:** a stale `expectedVersion`.
  """
  restoreDraft(
    """Which cycle."""
    id: ID!

    """The cycle's `currentVersion`; a mismatch refuses."""
    expectedVersion: Int!
  ): AdminCycleResult!
}

"""One staff-only note about an application."""
input InternalNoteInput {
  """The application to annotate. Refused for a `DRAFT`, which the office cannot see."""
  applicationId: ID!

  """
  What to record. Never shown to the applicant, and never deleted — a mistake
  is corrected with a new note rather than erased.
  """
  note: String!

  """
  The note this one corrects. Sending it links the two so the record shows
  what was believed and when. Null for an original note.
  """
  correctionOfNoteId: ID
}

"""
Working applications as they arrive, and reviewing them.

**Use case:** `/admin/applications/$id`. Nothing is reserved beforehand:
holding the right role is what permits an action, and two officers acting at
once are settled by `expectedStatusVersion`.
"""
type AdminIntakeMutation {
  """
  Adds a staff-only note to an application.

  **Use case:** the notes panel on the workspace. Append-only, and never
  requires having worked the file.

  **Refuses:** a draft application, which the office cannot see at all.
  """
  addInternalNote(
    """Which application, and what to record."""
    input: InternalNoteInput!
  ): AdminWorkspaceResult!
}

"""
Which stage of the form, and what it is called.

A stage is a step an applicant works through, so its title is the heading they
read — reworded here rather than in a deploy.
"""
input FormStageEditInput {
  """Stable identifier, in the form key format. Never shown to an applicant."""
  stageKey: String!

  """The heading on the applicant's screen."""
  title: String!

  """A sentence under the heading, where the step needs explaining."""
  description: String

  """Where this step sits in the order. Absent keeps its current place."""
  sortOrder: Int
}

"""
Which cycle's questions are being changed, at which version, and why.

The reason is kept with the version it produced. A cycle's questions decide what
every application against it is asked, so a change to them is a change to the
programme and the record says who made it and what for.
"""
input FormTemplateScopeInput {
  """The cycle whose questions are being changed. Must still be a draft."""
  programmeCycleId: ID!

  """The cycle version the caller was looking at."""
  expectedVersion: Int!

  """Why the questions are changing. Kept on the version this creates."""
  reason: String!
}

"""The whole form at once."""
input ReplaceFormTemplateInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """Every stage, question, choice and rule the cycle will ask from now on."""
  template: FormTemplateInput!
}

"""One stage of the form."""
input FormStageMutationInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """
  The stage to add, or the stage as it should now read.

  On an update every value replaces what is stored, so a field left out is a
  field cleared rather than one left alone.
  """
  stage: FormStageEditInput!
}

"""Which stage to stop asking."""
input RemoveFormStageInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """
  The stage to remove. Its questions go with it — a question naming a stage the
  cycle no longer has is one the form cannot place.
  """
  stageKey: String!
}

"""
One choice, for a question named by the mutation carrying it.

Deliberately narrower than `FormFieldOptionInput`: the owning question and its
type are already given by `field`, so restating them here would be two chances
to disagree with it — and the disagreement would be silently resolved in favour
of `field`.
"""
input FormQuestionOptionInput {
  """What is stored when the choice is taken."""
  optionValue: String!

  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card. At most 200 characters."""
  optionDescription: String

  """A kebab-case icon token for the card rendering. A name, never markup."""
  iconName: String

  """Where it sits in the list. Defaults to the order given."""
  sortOrder: Int
}

"""
One rule on the question named by the mutation carrying it.

Narrower than `FormFieldConditionInput` for the reason `FormQuestionOptionInput`
is: the question this governs is `field`, and saying so twice only allows the
two to differ.
"""
input FormQuestionConditionInput {
  """Whether it shows the question or makes it compulsory."""
  effect: FieldConditionEffect!

  """Which set this belongs to. Members of a set are ANDed. Defaults to 1."""
  groupNumber: Int

  """Where it sits within its set. Defaults to the order given."""
  sequenceNumber: Int

  """The question whose answer is compared. Must be one this cycle declares."""
  sourceFieldKey: String!

  """
  That question's type, repeated, for the same reason an option carries one:
  it lets a single-row `CHECK` refuse an ordering comparison against a type
  that has no order.
  """
  sourceFieldType: FormFieldType!

  """How the comparison is made."""
  operator: FieldConditionOperator!

  """What to compare against. Omit for `IS_PRESENT` and `IS_ABSENT`."""
  comparisonValue: String
}

"""One question, with the choices it offers and the rules that reveal it."""
input FormQuestionMutationInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """The question itself."""
  field: FormFieldInput!

  """
  The choices it offers, for a question that offers any. Replaces the
  question's current choices outright; absent means it offers none.
  """
  options: [FormQuestionOptionInput!]

  """
  When this question is shown, or when it becomes required. Replaces the rules
  **on this question** outright. Rules elsewhere that read it are untouched —
  they belong to those questions, not this one.
  """
  conditions: [FormQuestionConditionInput!]
}

"""Which question to stop asking."""
input RemoveFormQuestionInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """
  The question to remove. If it is a repeated group, its members go with it.

  **Refused if another question's rule reads it**, naming that question: a rule
  whose source is gone is one nothing can ever satisfy, and dropping the rule
  quietly would make somebody else's question unconditional without being
  asked.
  """
  fieldKey: String!
}

"""
Authoring the questions a cycle asks.

**Drafts only.** A cycle's questions are frozen into its version when it opens,
and every submitted application is judged against the version it was filled
under — so changing an open cycle's form would change what applications already
in flight are being asked. Reword guidance on an open cycle with
`programmeCycle.updateOpenGuidance`; to ask something different, open a new
cycle.

Every mutation here validates the **whole** resulting form, not the part that
changed, and refuses with a sentence naming the question at fault.
"""
type AdminFormTemplateMutation {
  """
  Defines a reusable structure, or replaces the one under the same key.

  **Refuses:** everything `replace` does, plus the structure grammar — more
  than 16 structures, more than 24 members, a member that is a group, a
  document or a statement, and an expansion that collides with a question.
  """
  putGroupDefinition(
    """The cycle, and the structure."""
    input: PutGroupDefinitionInput!
  ): AdminCycleResult!

  """
  Removes a reusable structure.

  **Refuses:** a structure still used by a repeated group — the refusal names
  every group using it — and everything `replace` does.
  """
  removeGroupDefinition(
    """The cycle, and which structure."""
    input: RemoveGroupDefinitionInput!
  ): AdminCycleResult!

  """
  Replaces the whole form.

  **Use case:** the cycle editor's save, and importing a form from a previous
  cycle.

  **Refuses:** a cycle that is not a draft; a stale `expectedVersion`; and any
  form the engine could not resolve — a question in no stage, a conditional
  question with no rule saying when, a rule reading a question the cycle does
  not ask, or questions that depend on each other in a circle.
  """
  replace(
    """The cycle, and the form it will ask."""
    input: ReplaceFormTemplateInput!
  ): AdminCycleResult!

  """
  Adds a stage.

  **Refuses:** a stage key the cycle already has, and everything `replace` does.
  """
  addStage(
    """The cycle, and the stage."""
    input: FormStageMutationInput!
  ): AdminCycleResult!

  """
  Retitles or moves a stage.

  **Refuses:** a stage key the cycle does not have, and everything `replace`
  does.
  """
  updateStage(
    """The cycle, and the stage as it should now read."""
    input: FormStageMutationInput!
  ): AdminCycleResult!

  """
  Stops asking a stage, and every question in it.

  **Refuses:** a stage key the cycle does not have, and everything `replace`
  does — including a rule elsewhere that read one of the removed questions.
  """
  removeStage(
    """The cycle, and which stage."""
    input: RemoveFormStageInput!
  ): AdminCycleResult!

  """
  Adds a question.

  **Use case:** a cycle that needs to ask something the last one did not.

  **Refuses:** a question key the cycle already asks, and everything `replace`
  does.
  """
  addQuestion(
    """The cycle, and the question."""
    input: FormQuestionMutationInput!
  ): AdminCycleResult!

  """
  Rewords a question, changes its type, its rules, or the choices it offers.

  **Refuses:** a question key the cycle does not ask, and everything `replace`
  does.
  """
  updateQuestion(
    """The cycle, and the question as it should now read."""
    input: FormQuestionMutationInput!
  ): AdminCycleResult!

  """
  Stops asking a question.

  **Refuses:** a question key the cycle does not ask, and everything `replace`
  does — notably a rule on another question that reads this one.
  """
  removeQuestion(
    """The cycle, and which question."""
    input: RemoveFormQuestionInput!
  ): AdminCycleResult!
}
