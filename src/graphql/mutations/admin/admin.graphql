  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card. At most 200 characters."""
  optionDescription: String

  """A kebab-case icon token for the card rendering. A name, never markup."""
  iconName: String

  """Where it sits in the list. Defaults to the order given."""
  sortOrder: Int
}

"""
One rule on the question named by the mutation carrying it.

Narrower than `FormFieldConditionInput` for the reason `FormQuestionOptionInput`
is: the question this governs is `field`, and saying so twice only allows the
two to differ.
"""
input FormQuestionConditionInput {
  """Whether it shows the question or makes it compulsory."""
  effect: FieldConditionEffect!

  """Which set this belongs to. Members of a set are ANDed. Defaults to 1."""
  groupNumber: Int

  """Where it sits within its set. Defaults to the order given."""
  sequenceNumber: Int

  """The question whose answer is compared. Must be one this cycle declares."""
  sourceFieldKey: String!

  """
  That question's type, repeated, for the same reason an option carries one:
  it lets a single-row `CHECK` refuse an ordering comparison against a type
  that has no order.
  """
  sourceFieldType: FormFieldType!

  """How the comparison is made."""
  operator: FieldConditionOperator!

  """What to compare against. Omit for `IS_PRESENT` and `IS_ABSENT`."""
  comparisonValue: String
}

"""One question, with the choices it offers and the rules that reveal it."""
input FormQuestionMutationInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """The question itself."""
  field: FormFieldInput!

  """
  The choices it offers, for a question that offers any. Replaces the
  question's current choices outright; absent means it offers none.
  """
  options: [FormQuestionOptionInput!]

  """
  When this question is shown, or when it becomes required. Replaces the rules
  **on this question** outright. Rules elsewhere that read it are untouched —
  they belong to those questions, not this one.
  """
  conditions: [FormQuestionConditionInput!]
}

"""Which question to stop asking."""
input RemoveFormQuestionInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """
  The question to remove. If it is a repeated group, its members go with it.

  **Refused if another question's rule reads it**, naming that question: a rule
  whose source is gone is one nothing can ever satisfy, and dropping the rule
  quietly would make somebody else's question unconditional without being
  asked.
  """
  fieldKey: String!
}

"""
Authoring the questions a cycle asks.

**Drafts only.** A cycle's questions are frozen into its version when it opens,
and every submitted application is judged against the version it was filled
under — so changing an open cycle's form would change what applications already
in flight are being asked. Reword guidance on an open cycle with
`programmeCycle.updateOpenGuidance`; to ask something different, open a new
cycle.

Every mutation here validates the **whole** resulting form, not the part that
changed, and refuses with a sentence naming the question at fault.
"""
type AdminFormTemplateMutation {
  """
  Defines a reusable structure, or replaces the one under the same key.

  **Refuses:** everything `replace` does, plus the structure grammar — more
  than 16 structures, more than 24 members, a member that is a group, a
  document or a statement, and an expansion that collides with a question.
  """
  putGroupDefinition(
    """The cycle, and the structure."""
    input: PutGroupDefinitionInput!
  ): AdminCycleResult!

  """
  Removes a reusable structure.

  **Refuses:** a structure still used by a repeated group — the refusal names
  every group using it — and everything `replace` does.
  """
  removeGroupDefinition(
    """The cycle, and which structure."""
    input: RemoveGroupDefinitionInput!
  ): AdminCycleResult!

  """
  Replaces the whole form.

  **Use case:** the cycle editor's save, and importing a form from a previous
  cycle.

  **Refuses:** a cycle that is not a draft; a stale `expectedVersion`; and any
  form the engine could not resolve — a question in no stage, a conditional
  question with no rule saying when, a rule reading a question the cycle does
  not ask, or questions that depend on each other in a circle.
  """
  replace(
    """The cycle, and the form it will ask."""
    input: ReplaceFormTemplateInput!
  ): AdminCycleResult!

  """
  Adds a stage.

  **Refuses:** a stage key the cycle already has, and everything `replace` does.
  """
  addStage(
    """The cycle, and the stage."""
    input: FormStageMutationInput!
  ): AdminCycleResult!

  """
  Retitles or moves a stage.

  **Refuses:** a stage key the cycle does not have, and everything `replace`
  does.
  """
  updateStage(
    """The cycle, and the stage as it should now read."""
    input: FormStageMutationInput!
  ): AdminCycleResult!

  """
  Stops asking a stage, and every question in it.

  **Refuses:** a stage key the cycle does not have, and everything `replace`
  does — including a rule elsewhere that read one of the removed questions.
  """
  removeStage(
    """The cycle, and which stage."""
    input: RemoveFormStageInput!
  ): AdminCycleResult!

  """
  Adds a question.

  **Use case:** a cycle that needs to ask something the last one did not.

  **Refuses:** a question key the cycle already asks, and everything `replace`
  does.
  """
  addQuestion(
    """The cycle, and the question."""
    input: FormQuestionMutationInput!
  ): AdminCycleResult!

  """
  Rewords a question, changes its type, its rules, or the choices it offers.

  **Refuses:** a question key the cycle does not ask, and everything `replace`
  does.
  """
  updateQuestion(
    """The cycle, and the question as it should now read."""
    input: FormQuestionMutationInput!
  ): AdminCycleResult!

  """
  Stops asking a question.

  **Refuses:** a question key the cycle does not ask, and everything `replace`
  does — notably a rule on another question that reads this one.
  """
  removeQuestion(
    """The cycle, and which question."""
    input: RemoveFormQuestionInput!
  ): AdminCycleResult!
}
