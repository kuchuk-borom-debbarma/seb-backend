extend type Mutation {
  """
  Everything the programme office does.

  **Use case:** the office screens under `/admin`. Requires a staff role, and
  most of it requires more than the ability to read — a reviewer reaches none
  of these.
  """
  admin: AdminMutation!
}

"""What the office acts on, in the order a file passes through."""
type AdminMutation {
  """Creating and operating the programme cycles."""
  programmeCycle: AdminProgrammeCycleMutation!

  """Authoring the questions a cycle asks."""
  formTemplate: AdminFormTemplateMutation!

  """Working applications as they arrive, and reviewing them."""
  intake: AdminIntakeMutation!

  """Writing the landing page's announcement banner."""
  announcement: AdminAnnouncementMutation!
}

"""
Authoring the public announcement banner.

**Use case:** `/admin/announcements`. Requires the authority to announce —
held by announcers and super administrators, and deliberately by nobody who
merely works casework.
"""
type AdminAnnouncementMutation {
  """
  Authors a new card, placed at the end of the display order.

  **Use case:** the "New announcement" form. A card may be created hidden and
  flipped live later.

  **Refuses:** a blank or over-cap field, and a link whose target does not fit
  its kind — an outside address must be http or https, a site path must start
  with a single "/", an anchor with "#".
  """
  create(
    """Everything the card says."""
    input: AnnouncementInput!
  ): AdminAnnouncementResult!

  """
  Replaces everything one card says.

  **Use case:** the card editor. The whole card travels, so a stale screen
  cannot silently keep a field the office meant to change.

  **Refuses:** the same field and link shapes as `create`, and a stale
  `expectedVersion` when somebody else edited or removed the card first.
  """
  update(
    """Which card, at which version."""
    id: ID!

    """The card's `currentVersion` as read; a mismatch refuses."""
    expectedVersion: Int!

    """The card's full replacement content."""
    input: AnnouncementInput!
  ): AdminAnnouncementResult!

  """
  Shows or hides one card without touching its content.

  **Use case:** the Live/Hidden toggle on the board's rows.

  **Refuses:** a stale `expectedVersion`, and a reason over 1,000 characters.
  """
  setPublished(
    """Which card, at which version."""
    id: ID!

    """The card's `currentVersion` as read; a mismatch refuses."""
    expectedVersion: Int!

    """True to show the card to the public, false to hide it."""
    published: Boolean!

    """Why, kept in the audit history. Optional."""
    reason: String
  ): AdminAnnouncementResult!

  """
  Withdraws a card from the board, retaining it and why.

  **Use case:** the Remove confirmation on the board. The fresh board comes
  back, because removal also moves the reorder guard.

  **Refuses:** a missing reason, and a stale `expectedVersion`.
  """
  remove(
    """Which card, at which version."""
    id: ID!

    """The card's `currentVersion` as read; a mismatch refuses."""
    expectedVersion: Int!

    """Why the card is withdrawn. Required, kept with the card."""
    reason: String!
  ): AdminAnnouncementBoardResult!

  """
  Rewrites the display order to exactly the list given.

  **Use case:** the ↑/↓ controls on the board. The list must name every
  current card exactly once.

  **Refuses:** a list that misses, repeats or invents a card, and a stale
  `expectedBoardVersion` — creating or removing a card moves it too, so an
  order built from an outdated board is refused rather than applied.
  """
  reorder(
    """Every live card's id, in the wanted order."""
    ids: [ID!]!

    """The board's version as read; a mismatch refuses."""
    expectedBoardVersion: Int!
  ): AdminAnnouncementBoardResult!
}

"""Everything one card says. The whole card travels on every save."""
input AnnouncementInput {
  """The short category chip. At most 40 characters."""
  tag: String!

  """
  The optional free-text label beside the tag — a month, "Official". At most
  40 characters; blank stores nothing.
  """
  dateLabel: String

  """The card's headline. At most 160 characters."""
  title: String!

  """The sentence or two under the headline. At most 1,000 characters."""
  body: String!

  """Which of the fixed pictograms the card carries."""
  icon: AnnouncementIcon!

  """Where the card leads. Omit for a card that is only a statement."""
  link: AnnouncementLinkInput

  """
  When the card stops showing. Omit to keep it up until withdrawn. A past
  value is accepted — an expired card is a legal draft.
  """
  endsAt: DateTime

  """Whether the public sees it now, or it waits as a hidden draft."""
  published: Boolean!
}

"""Where a card leads. The target must fit the kind, and is validated."""
input AnnouncementLinkInput {
  """What the target is; decides both validation and rendering."""
  kind: AnnouncementLinkKind!

  """
  The destination. **Example:** `"https://ttaadc.gov.in/order.pdf"` for
  EXTERNAL, `"/faq"` for ROUTE, `"#eligibility"` for ANCHOR.
  """
  target: String!
}

"""
One step of the form a cycle asks.

Stages are ordered as given, so moving a question between them is an edit to
this list rather than a number to maintain.
"""
input FormStageInput {
  """How the stage is addressed. `SCREAMING_SNAKE_CASE`, unique per cycle."""
  stageKey: String!

  """The heading an applicant reads."""
  title: String!

  """A paragraph introducing the stage. Omit where the title says enough."""
  description: String

  """A kebab-case token into the client's icon registry, for the stage rail."""
  iconName: String

  """Roughly how long the stage takes to fill, in minutes: 1 to 120."""
  estimatedMinutes: Int
}

"""
One question the cycle asks.

Ordered as given within its stage. A question the applicant never sees is still
declared here — visibility is a condition, not an omission.
"""
input FormFieldInput {
  """Which stage it appears in. Must be one of `stages`."""
  stageKey: String!

  """
  How the question is addressed everywhere: in answers, in the DOM `id`, and in
  a validation issue. `SCREAMING_SNAKE_CASE`, unique per cycle, and **fixed for
  a role-bound question where the role pins one** — the requested amount keeps
  its canonical key; the date of birth may use any key.
  """
  fieldKey: String!

  """What kind of answer it takes."""
  fieldType: FormFieldType!

  """
  The fixed role this question plays, where it plays one.

  A stable code — `"SEED_FUND_REQUESTED_PAISE"` or `"APPLICANT_DATE_OF_BIRTH"`.
  A cycle cannot open until both are bound, because the decision's bound and
  the age rule reach their input through them.
  """
  role: String

  """The words the applicant reads. The cycle's, not the software's."""
  label: String!

  """A sentence of guidance under the control."""
  helpText: String

  """Whether an answer is needed."""
  requirement: FormFieldRequirement!

  """
  `"SERVER_DERIVED"` for a value the programme office fills in, `"APPLICANT"`
  otherwise. Defaults to `APPLICANT`. A server-derived question is never
  accepted from an applicant, and may not sit inside a repeated group.
  """
  source: String

  """Where it sits within its stage. Defaults to the order given."""
  sortOrder: Int

  """
  The repeated group this question belongs to. Null when it stands alone.

  Groups do not nest, so a member may not itself be a group.
  """
  parentFieldKey: String

  """
  The reusable structure this group expands from. `REPEAT_GROUP` only. The
  members come from the definition — a use may not declare its own.
  """
  groupDefinitionKey: String

  """Fewest entries a repeated group may hold."""
  repeatMin: Int

  """Most entries a repeated group may hold."""
  repeatMax: Int

  """Fewest characters."""
  minLength: Int

  """Most characters. **Required alongside `pattern`**, so a hostile answer is bounded before the expression runs."""
  maxLength: Int

  """
  A regular expression the answer must match.

  Anchored at both ends when it is compiled, so it cannot half-match. At most
  200 characters, and screened for nested quantifiers — the expression runs on a
  Worker's CPU budget.
  """
  pattern: String

  """What to say when `pattern` does not match. The cycle's own words."""
  patternMessage: String

  """Smallest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  minValue: Money

  """Largest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  maxValue: Money

  """Earliest permitted day, for `DATE`."""
  minDate: Date

  """Latest permitted day, for `DATE`."""
  maxDate: Date

  """
  A bound resolved against the write's own instant rather than a fixed day.

  `"NOT_FUTURE"` or `"NOT_PAST"`. A stable code.
  """
  relativeDateBound: String

  """Largest permitted upload in bytes, for a `FILE`."""
  maxFileBytes: Int

  """Ghost text inside the empty control. Only on a typed answer; at most 200 characters."""
  placeholder: String

  """An inline hint under the control, in the cycle's words. At most 500 characters."""
  note: String

  """How to colour the note: `INFO`, `WARNING`, `SUCCESS` or `DANGER`. Omit for neutral."""
  tone: String

  """
  How wide to draw the control: `FULL`, `TWO_THIRDS`, `ONE_HALF`, `ONE_THIRD`,
  or a character width `CHAR_2`, `CHAR_4`, `CHAR_10`, `CHAR_20`. Omit for FULL.
  """
  widthHint: String

  """Decoration before the value — `₹` on an amount. 1 to 8 characters."""
  prefixText: String

  """Decoration after the value — `yrs` on a count. 1 to 8 characters."""
  suffixText: String

  """The HTML `autocomplete` token the control should carry, from the recognised set."""
  autocompleteHint: String

  """Whether to show characters-remaining. Needs `maxLength`; text answers only."""
  showCharCount: Boolean

  """How many rows a `LONG_TEXT` control opens with: 2 to 20."""
  textareaRows: Int

  """
  Which control draws a choice: `RADIO`, `DROPDOWN`, `SEGMENTED` or `CARD` for
  a single choice; `CHECKBOX_LIST` or `MULTISELECT` for a multiple one.
  """
  choiceStyle: String
}

"""One choice offered for a `SINGLE_CHOICE` or `MULTI_CHOICE` question."""
input FormFieldOptionInput {
  """Which question offers it."""
  fieldKey: String!

  """
  That question's type, repeated.

  Carried so a single-row `CHECK` can refuse an option on a question that offers
  none, and verified by a composite foreign key so it cannot drift.
  """
  fieldType: FormFieldType!

  """What is stored when the choice is taken."""
  optionValue: String!

  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card. At most 200 characters."""
  optionDescription: String

  """A kebab-case icon token for the card rendering. A name, never markup."""
  iconName: String

  """Where it sits in the list. Defaults to the order given."""
  sortOrder: Int
}

"""
One comparison against an answer already given.

Conditions sharing a `groupNumber` must **all** hold; separate groups are
alternatives. The graph must be acyclic — a cyclic template renders nothing and
cannot be repaired from the applicant's side, so it is refused here.
"""
input FormFieldConditionInput {
  """The question this condition governs."""
  fieldKey: String!

  """Whether it shows the question or makes it compulsory."""
  effect: FieldConditionEffect!

  """Which set this belongs to. Members of a set are ANDed. Defaults to 1."""
  groupNumber: Int

  """Where it sits within its set. Defaults to the order given."""
  sequenceNumber: Int

  """The question whose answer is compared. Must be one this cycle declares."""
  sourceFieldKey: String!

  """
  That question's type, repeated, for the same reason an option carries one:
  it lets a single-row `CHECK` refuse an ordering comparison against a type
  that has no order.
  """
  sourceFieldType: FormFieldType!

  """How the comparison is made."""
  operator: FieldConditionOperator!

  """What to compare against. Omit for `IS_PRESENT` and `IS_ABSENT`."""
  comparisonValue: String
}

"""
The whole form this cycle asks.

Frozen with the cycle version, so an application filled last year still reads
against the questions it was actually asked. Editing it is a cycle revision
carrying a required reason, and is refused on an open cycle.
"""
input FormTemplateInput {
  """The steps, in the order they are filled. At least one."""
  stages: [FormStageInput!]!

  """Every question, including the members of a repeated group."""
  fields: [FormFieldInput!]!

  """The choices, for the questions that offer any."""
  options: [FormFieldOptionInput!]!

  """When each question is shown, and when it becomes compulsory."""
  conditions: [FormFieldConditionInput!]!

  """
  Reusable structures — defined once, used by any repeated group that names
  one. At most 16 per cycle.
  """
  groupDefinitions: [FormGroupDefinitionInput!]

  """
  Rules about several answers at once, such as "a grant, a loan, or both".
  Each rule type is declared in the workflow catalogue. Omit for none.
  """
  rules: [FormRuleInput!]
}

"""
A reusable structure: a set of questions defined once and used as a repeated
group. "An Owner is a name, a date of birth, a share." Members take their
use's stage on expansion and carry no rules between them in this version.
"""
input FormGroupDefinitionInput {
  """How the structure is addressed. `SCREAMING_SNAKE_CASE`, unique per cycle."""
  definitionKey: String!

  """What the structure is called where the editor lists it."""
  label: String!

  """The questions each entry asks. At least 1, at most 24."""
  members: [FormGroupDefinitionMemberInput!]!
}

"""
One member of a reusable structure: a question shape without a stage. It
becomes an ordinary question under `USE__MEMBER` on expansion, so it carries
everything a question does except a stage, a parent, and conditions.
"""
input FormGroupDefinitionMemberInput {
  """How the member is addressed inside its structure. `SCREAMING_SNAKE_CASE`."""
  memberKey: String!

  """What kind of answer it takes. Not a group, a document, or a statement."""
  fieldType: FormFieldType!

  """`APPLICANT_DATE_OF_BIRTH` on a DATE member, or omitted. The one role a group may hold."""
  role: String

  """The words the applicant reads."""
  label: String!

  """A sentence of guidance under the control."""
  helpText: String

  """Whether an answer is needed in every entry."""
  requirement: FormFieldRequirement!

  """Fewest characters."""
  minLength: Int

  """Most characters. Required alongside `pattern`."""
  maxLength: Int

  """A regular expression the answer must match. Same limits as a question's."""
  pattern: String

  """What to say when `pattern` does not match."""
  patternMessage: String

  """Smallest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  minValue: Money

  """Largest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  maxValue: Money

  """Earliest permitted day, for `DATE`."""
  minDate: Date

  """Latest permitted day, for `DATE`."""
  maxDate: Date

  """`"NOT_FUTURE"` or `"NOT_PAST"`, resolved at the write."""
  relativeDateBound: String

  """Ghost text inside the empty control. Typed answers only; at most 200 characters."""
  placeholder: String

  """An inline hint under the control. At most 500 characters."""
  note: String

  """How to colour the note: `INFO`, `WARNING`, `SUCCESS` or `DANGER`."""
  tone: String

  """How wide to draw the control; same closed set as a question's."""
  widthHint: String

  """Decoration before the value. 1 to 8 characters."""
  prefixText: String

  """Decoration after the value. 1 to 8 characters."""
  suffixText: String

  """The HTML `autocomplete` token, from the recognised set."""
  autocompleteHint: String

  """Whether to show characters-remaining. Needs `maxLength`; text answers only."""
  showCharCount: Boolean

  """How many rows a `LONG_TEXT` control opens with: 2 to 20."""
  textareaRows: Int

  """Which control draws a choice; same closed set as a question's."""
  choiceStyle: String

  """The choices offered, for a choice member."""
  options: [FormGroupDefinitionMemberOptionInput!]
}

"""One choice a structure's member offers."""
input FormGroupDefinitionMemberOptionInput {
  """What is stored when the choice is taken."""
  optionValue: String!

  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card."""
  optionDescription: String

  """A kebab-case icon token for the card rendering."""
  iconName: String
}

"""The cycle scope and one structure, for `putGroupDefinition`."""
input PutGroupDefinitionInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """The structure, complete. Replaces any structure under the same key."""
  definition: FormGroupDefinitionInput!
}

"""The cycle scope and one structure key, for `removeGroupDefinition`."""
input RemoveGroupDefinitionInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """Which structure to remove."""
  definitionKey: String!
}

"""
A rule about several answers at once.

Operands name questions of this form; which types a rule accepts, and how many,
is declared by its type in the workflow catalogue.
"""
input FormRuleInput {
  """How the rule is addressed. Unique within the form."""
  ruleKey: String!

  """The catalogue's rule type, such as `AT_LEAST_ONE_TRUE`."""
  ruleType: FormRuleType!

  """The form stage the rule's message is shown on."""
  stageKey: String!

  """What the applicant is told when the rule does not hold."""
  message: String!

  """The fixed limit, in the operands' unit. Required by `SUM_AT_MOST` only."""
  limitValue: Money

  """The questions the rule reads, in order."""
  operands: [FormRuleOperandInput!]!
}

"""One question a form rule reads."""
input FormRuleOperandInput {
  """The question's key."""
  fieldKey: String!

  """The question's type, repeated so the rule cannot drift from it."""
  fieldType: FormFieldType!
}

"""
A kind of application a cycle accepts, and who may start one.

The code knows no kind by name: `INITIAL` and `EXPANSION` are whatever the
cycle's rules make them.
"""
input ApplicationKindInput {
  """How the kind is addressed, such as `EXPANSION`."""
  kindKey: String!

  """What the applicant is offered it as."""
  label: String!

  """A sentence more, shown under the label."""
  description: String

  """Every rule an enterprise must meet to start one. All must hold."""
  rules: [ApplicationKindRuleInput!]!
}

"""One eligibility rule of an application kind."""
input ApplicationKindRuleInput {
  """The catalogue's rule type, such as `PRIOR_APPLICATION_HAS_FLAG`."""
  ruleType: EligibilityRuleType!

  """
  The rule's parameters as a JSON object, keyed as the catalogue declares them
  for its type — for example `{"flag":"GRANT_SANCTIONED","minMonthsSinceFlag":12}`.
  Checked against that declaration when the cycle is saved; at most 4 KB.
  """
  paramsJson: String!
}

"""
Everything one cycle decides, sent complete on every write.

A replacement rather than a patch. Each write makes a new cycle version, and
applications keep the version they were submitted against — so editing a cycle
never changes what an application already sent is judged by.
"""
input ProgrammeCyclePolicyInput {
  """Youngest applicant the cycle accepts, in years."""
  minimumApplicantAge: Int

  """Oldest applicant the cycle accepts, in years."""
  maximumApplicantAge: Int

  """
  How many months of trading separates the two funding bands. At or below
  this is `CATEGORY_A`; above it is `CATEGORY_B`.
  """
  categoryAMaximumMonths: Int

  """Whether the applicant must confirm majority ownership."""
  majorityOwnershipRequired: Boolean

  """Whose rules this cycle applies."""
  jurisdiction: ProgrammeJurisdiction

  """
  Whether a maximum award has been settled. `UNRESOLVED` is honest rather than
  missing: no amount is checked against a ceiling nobody has approved.
  """
  fundingCeilingState: FundingCeilingState

  """The ceiling, in paise. Required when the state is `RESOLVED`."""
  fundingCeilingAmountPaise: Money

  """What the ceiling is measured across. Required when `RESOLVED`."""
  fundingCeilingScope: FundingCeilingScope

  """
  The questions this cycle asks, and when each is shown.

  Required: a cycle with no form has nothing for an applicant to fill in, and
  the questions the programme itself reads — the requested amount, the category,
  the date of birth — reach their input through a role bound here.
  """
  formTemplate: FormTemplateInput!

  """
  The pipeline this cycle's applications are worked in, by id. Its current
  published version is pinned when the cycle opens; opening is refused while
  it has none.
  """
  pipelineId: ID!

  """
  The kinds of application this cycle accepts, in the order they are offered.
  Opening is refused without at least one.
  """
  applicationKinds: [ApplicationKindInput!]!
}

"""A whole programme cycle: its identity, its window, and its rules."""
input ProgrammeCycleInput {
  """
  Short code used in correspondence. 3–32 uppercase letters, digits or
  hyphens, and unique across cycles.

  **Example:** `"SEP-2026"`
  """
  cycleCode: String!

  """The cycle's name, as shown to applicants. At most 120 characters."""
  displayName: String!

  """The policy year, between 2000 and 9999."""
  cycleYear: Int!

  """Guidance written for applicants, shown on the application screens."""
  applicantGuidance: String

  """
  When the application window opens. Null leaves it unscheduled, which is a
  cycle that cannot yet be applied to.
  """
  opensAt: DateTime

  """When the window closes. Must be later than `opensAt`."""
  closesAt: DateTime

  """Everything this cycle decides."""
  policy: ProgrammeCyclePolicyInput!
}

"""Replaces a draft cycle's identity, window and rules."""
input UpdateProgrammeCycleInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """Why it is being changed, kept in the cycle's history."""
