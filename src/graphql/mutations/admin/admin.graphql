extend type Mutation {
  """
  Everything the programme office does.

  **Use case:** the office screens under `/admin`. Requires a staff role, and
  most of it requires more than the ability to read — a reviewer reaches none
  of these.
  """
  admin: AdminMutation!
}

"""What the office acts on, in the order a file passes through."""
type AdminMutation {
  """Creating and operating the programme cycles."""
  programmeCycle: AdminProgrammeCycleMutation!

  """Authoring the questions a cycle asks."""
  formTemplate: AdminFormTemplateMutation!

  """Working applications as they arrive, and reviewing them."""
  intake: AdminIntakeMutation!

  """Partner-bank referral, and deciding the application."""
  decision: AdminDecisionMutation!

  """Awards, payments, assessments and recovery."""
  funding: AdminFundingMutation!
}

"""
One step of the form a cycle asks.

Stages are ordered as given, so moving a question between them is an edit to
this list rather than a number to maintain.
"""
input FormStageInput {
  """How the stage is addressed. `SCREAMING_SNAKE_CASE`, unique per cycle."""
  stageKey: String!

  """The heading an applicant reads."""
  title: String!

  """A paragraph introducing the stage. Omit where the title says enough."""
  description: String

  """A kebab-case token into the client's icon registry, for the stage rail."""
  iconName: String

  """Roughly how long the stage takes to fill, in minutes: 1 to 120."""
  estimatedMinutes: Int
}

"""
One question the cycle asks.

Ordered as given within its stage. A question the applicant never sees is still
declared here — visibility is a condition, not an omission.
"""
input FormFieldInput {
  """Which stage it appears in. Must be one of `stages`."""
  stageKey: String!

  """
  How the question is addressed everywhere: in answers, in the DOM `id`, and in
  a validation issue. `SCREAMING_SNAKE_CASE`, unique per cycle, and **fixed for
  a role-bound question where the role pins one** — the requested amount keeps
  its canonical key; the date of birth may use any key.
  """
  fieldKey: String!

  """What kind of answer it takes."""
  fieldType: FormFieldType!

  """
  The fixed role this question plays, where it plays one.

  A stable code — `"SEED_FUND_REQUESTED_PAISE"` or `"APPLICANT_DATE_OF_BIRTH"`.
  A cycle cannot open until both are bound, because the decision's bound and
  the age rule reach their input through them.
  """
  role: String

  """The words the applicant reads. The cycle's, not the software's."""
  label: String!

  """A sentence of guidance under the control."""
  helpText: String

  """Whether an answer is needed."""
  requirement: FormFieldRequirement!

  """
  `"SERVER_DERIVED"` for a value the programme office fills in, `"APPLICANT"`
  otherwise. Defaults to `APPLICANT`. A server-derived question is never
  accepted from an applicant, and may not sit inside a repeated group.
  """
  source: String

  """Where it sits within its stage. Defaults to the order given."""
  sortOrder: Int

  """
  The repeated group this question belongs to. Null when it stands alone.

  Groups do not nest, so a member may not itself be a group.
  """
  parentFieldKey: String

  """
  The reusable structure this group expands from. `REPEAT_GROUP` only. The
  members come from the definition — a use may not declare its own.
  """
  groupDefinitionKey: String

  """Fewest entries a repeated group may hold."""
  repeatMin: Int

  """Most entries a repeated group may hold."""
  repeatMax: Int

  """Fewest characters."""
  minLength: Int

  """Most characters. **Required alongside `pattern`**, so a hostile answer is bounded before the expression runs."""
  maxLength: Int

  """
  A regular expression the answer must match.

  Anchored at both ends when it is compiled, so it cannot half-match. At most
  200 characters, and screened for nested quantifiers — the expression runs on a
  Worker's CPU budget.
  """
  pattern: String

  """What to say when `pattern` does not match. The cycle's own words."""
  patternMessage: String

  """Smallest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  minValue: Money

  """Largest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  maxValue: Money

  """Earliest permitted day, for `DATE`."""
  minDate: Date

  """Latest permitted day, for `DATE`."""
  maxDate: Date

  """
  A bound resolved against the write's own instant rather than a fixed day.

  `"NOT_FUTURE"` or `"NOT_PAST"`. A stable code.
  """
  relativeDateBound: String

  """Largest permitted upload in bytes, for a `FILE`."""
  maxFileBytes: Int

  """Ghost text inside the empty control. Only on a typed answer; at most 200 characters."""
  placeholder: String

  """An inline hint under the control, in the cycle's words. At most 500 characters."""
  note: String

  """How to colour the note: `INFO`, `WARNING`, `SUCCESS` or `DANGER`. Omit for neutral."""
  tone: String

  """
  How wide to draw the control: `FULL`, `TWO_THIRDS`, `ONE_HALF`, `ONE_THIRD`,
  or a character width `CHAR_2`, `CHAR_4`, `CHAR_10`, `CHAR_20`. Omit for FULL.
  """
  widthHint: String

  """Decoration before the value — `₹` on an amount. 1 to 8 characters."""
  prefixText: String

  """Decoration after the value — `yrs` on a count. 1 to 8 characters."""
  suffixText: String

  """The HTML `autocomplete` token the control should carry, from the recognised set."""
  autocompleteHint: String

  """Whether to show characters-remaining. Needs `maxLength`; text answers only."""
  showCharCount: Boolean

  """How many rows a `LONG_TEXT` control opens with: 2 to 20."""
  textareaRows: Int

  """
  Which control draws a choice: `RADIO`, `DROPDOWN`, `SEGMENTED` or `CARD` for
  a single choice; `CHECKBOX_LIST` or `MULTISELECT` for a multiple one.
  """
  choiceStyle: String
}

"""One choice offered for a `SINGLE_CHOICE` or `MULTI_CHOICE` question."""
input FormFieldOptionInput {
  """Which question offers it."""
  fieldKey: String!

  """
  That question's type, repeated.

  Carried so a single-row `CHECK` can refuse an option on a question that offers
  none, and verified by a composite foreign key so it cannot drift.
  """
  fieldType: FormFieldType!

  """What is stored when the choice is taken."""
  optionValue: String!

  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card. At most 200 characters."""
  optionDescription: String

  """A kebab-case icon token for the card rendering. A name, never markup."""
  iconName: String

  """Where it sits in the list. Defaults to the order given."""
  sortOrder: Int
}

"""
One comparison against an answer already given.

Conditions sharing a `groupNumber` must **all** hold; separate groups are
alternatives. The graph must be acyclic — a cyclic template renders nothing and
cannot be repaired from the applicant's side, so it is refused here.
"""
input FormFieldConditionInput {
  """The question this condition governs."""
  fieldKey: String!

  """Whether it shows the question or makes it compulsory."""
  effect: FieldConditionEffect!

  """Which set this belongs to. Members of a set are ANDed. Defaults to 1."""
  groupNumber: Int

  """Where it sits within its set. Defaults to the order given."""
  sequenceNumber: Int

  """The question whose answer is compared. Must be one this cycle declares."""
  sourceFieldKey: String!

  """
  That question's type, repeated, for the same reason an option carries one:
  it lets a single-row `CHECK` refuse an ordering comparison against a type
  that has no order.
  """
  sourceFieldType: FormFieldType!

  """How the comparison is made."""
  operator: FieldConditionOperator!

  """What to compare against. Omit for `IS_PRESENT` and `IS_ABSENT`."""
  comparisonValue: String
}

"""
The whole form this cycle asks.

Frozen with the cycle version, so an application filled last year still reads
against the questions it was actually asked. Editing it is a cycle revision
carrying a required reason, and is refused on an open cycle.
"""
input FormTemplateInput {
  """The steps, in the order they are filled. At least one."""
  stages: [FormStageInput!]!

  """Every question, including the members of a repeated group."""
  fields: [FormFieldInput!]!

  """The choices, for the questions that offer any."""
  options: [FormFieldOptionInput!]!

  """When each question is shown, and when it becomes compulsory."""
  conditions: [FormFieldConditionInput!]!

  """
  Reusable structures — defined once, used by any repeated group that names
  one. At most 16 per cycle.
  """
  groupDefinitions: [FormGroupDefinitionInput!]
}

"""
A reusable structure: a set of questions defined once and used as a repeated
group. "An Owner is a name, a date of birth, a share." Members take their
use's stage on expansion and carry no rules between them in this version.
"""
input FormGroupDefinitionInput {
  """How the structure is addressed. `SCREAMING_SNAKE_CASE`, unique per cycle."""
  definitionKey: String!

  """What the structure is called where the editor lists it."""
  label: String!

  """The questions each entry asks. At least 1, at most 24."""
  members: [FormGroupDefinitionMemberInput!]!
}

"""
One member of a reusable structure: a question shape without a stage. It
becomes an ordinary question under `USE__MEMBER` on expansion, so it carries
everything a question does except a stage, a parent, and conditions.
"""
input FormGroupDefinitionMemberInput {
  """How the member is addressed inside its structure. `SCREAMING_SNAKE_CASE`."""
  memberKey: String!

  """What kind of answer it takes. Not a group, a document, or a statement."""
  fieldType: FormFieldType!

  """`APPLICANT_DATE_OF_BIRTH` on a DATE member, or omitted. The one role a group may hold."""
  role: String

  """The words the applicant reads."""
  label: String!

  """A sentence of guidance under the control."""
  helpText: String

  """Whether an answer is needed in every entry."""
  requirement: FormFieldRequirement!

  """Fewest characters."""
  minLength: Int

  """Most characters. Required alongside `pattern`."""
  maxLength: Int

  """A regular expression the answer must match. Same limits as a question's."""
  pattern: String

  """What to say when `pattern` does not match."""
  patternMessage: String

  """Smallest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  minValue: Money

  """Largest permitted number, for `INTEGER` and `MONEY_PAISE`."""
  maxValue: Money

  """Earliest permitted day, for `DATE`."""
  minDate: Date

  """Latest permitted day, for `DATE`."""
  maxDate: Date

  """`"NOT_FUTURE"` or `"NOT_PAST"`, resolved at the write."""
  relativeDateBound: String

  """Ghost text inside the empty control. Typed answers only; at most 200 characters."""
  placeholder: String

  """An inline hint under the control. At most 500 characters."""
  note: String

  """How to colour the note: `INFO`, `WARNING`, `SUCCESS` or `DANGER`."""
  tone: String

  """How wide to draw the control; same closed set as a question's."""
  widthHint: String

  """Decoration before the value. 1 to 8 characters."""
  prefixText: String

  """Decoration after the value. 1 to 8 characters."""
  suffixText: String

  """The HTML `autocomplete` token, from the recognised set."""
  autocompleteHint: String

  """Whether to show characters-remaining. Needs `maxLength`; text answers only."""
  showCharCount: Boolean

  """How many rows a `LONG_TEXT` control opens with: 2 to 20."""
  textareaRows: Int

  """Which control draws a choice; same closed set as a question's."""
  choiceStyle: String

  """The choices offered, for a choice member."""
  options: [FormGroupDefinitionMemberOptionInput!]
}

"""One choice a structure's member offers."""
input FormGroupDefinitionMemberOptionInput {
  """What is stored when the choice is taken."""
  optionValue: String!

  """What the applicant reads."""
  optionLabel: String!

  """A sentence under the label when the choice is drawn as a card."""
  optionDescription: String

  """A kebab-case icon token for the card rendering."""
  iconName: String
}

"""The cycle scope and one structure, for `putGroupDefinition`."""
input PutGroupDefinitionInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """The structure, complete. Replaces any structure under the same key."""
  definition: FormGroupDefinitionInput!
}

"""The cycle scope and one structure key, for `removeGroupDefinition`."""
input RemoveGroupDefinitionInput {
  """Which cycle, at which version, and why."""
  scope: FormTemplateScopeInput!

  """Which structure to remove."""
  definitionKey: String!
}

"""One approved reason for one administrative action."""
input ProgrammeReasonInput {
  """Which action this reason may be used for."""
  context: ProgrammeReasonContext!

  """
  Stable code for reporting. Uppercase letters, digits and underscores, 2–64
  characters.

  **Example:** `"INCOMPLETE_EVIDENCE"`
  """
  code: String!

  """What staff see in the reason picker. At most 120 characters."""
  label: String!

  """
  Suggested wording for the applicant, which the officer may edit before
  sending. At most 500 characters. Null where the action carries no message.
  """
  applicantMessageTemplate: String
}

"""
Whether the desk review demands an identity number, and when.

`REQUIRED_ON_PASS` rather than `REQUIRED`: an identifier is the evidence behind
a check, and a check that was failed or marked not applicable is attesting to
nothing, so there is nothing to have read.
"""
enum IdentifierRequirement {
  """
  Demanded whenever the check it stands behind is passed. Requires
  `checkType`.
  """
  REQUIRED_ON_PASS

  """Collected if the reviewer has it. Never blocks a review."""
  OPTIONAL

  """
  Not collected at all. No field appears, and sending a value for it is
  refused rather than silently dropped.
  """
  OFF
}

"""Whether an identity number is compared against other applications."""
enum IdentifierDuplicatePolicy {
  """
  Compared. A match on another funding case is raised as a question the
  reviewer must answer.
  """
  CHECKED

  """
  Recorded but never compared. For numbers legitimately shared — a family
  bank account is a real thing, and refusing on it would be wrong.
  """
  NOT_CHECKED
}

"""
One identity number a cycle collects, and what it does with it.

The two settings are **independent**: a value can be worth recording without
being worth refusing on, and worth comparing without being demanded.
"""
input ProgrammeIdentifierRuleInput {
  """Which number. Each kind may appear at most once per cycle."""
  kind: DeskReviewIdentifierKind!

  """Whether the reviewer must transcribe it, and when."""
  requirement: IdentifierRequirement!

  """Whether it is compared against other applications."""
  duplicatePolicy: IdentifierDuplicatePolicy!

  """
  The desk-review check this number is evidence for.

  Required exactly when `requirement` is `REQUIRED_ON_PASS`, and refused
  otherwise — only a requirement conditional on a check has a moment at which
  it applies.
  """
  checkType: DeskReviewCheckType
}

"""
Everything one cycle decides, sent complete on every write.

A replacement rather than a patch. Each write makes a new cycle version, and
applications keep the version they were submitted against — so editing a cycle
never changes what an application already sent is judged by.
"""
input ProgrammeCyclePolicyInput {
  """Youngest applicant the cycle accepts, in years."""
  minimumApplicantAge: Int

  """Oldest applicant the cycle accepts, in years."""
  maximumApplicantAge: Int

  """
  How many months of trading separates the two funding bands. At or below
  this is `CATEGORY_A`; above it is `CATEGORY_B`.
  """
  categoryAMaximumMonths: Int

  """How long after an award before a later phase may be applied for."""
  expansionWaitMonths: Int

  """Whether the applicant must confirm majority ownership."""
  majorityOwnershipRequired: Boolean

  """Whose rules this cycle applies."""
  jurisdiction: ProgrammeJurisdiction

  """
  Whether a maximum award has been settled. `UNRESOLVED` is honest rather than
  missing: no amount is checked against a ceiling nobody has approved.
  """
  fundingCeilingState: FundingCeilingState

  """The ceiling, in paise. Required when the state is `RESOLVED`."""
  fundingCeilingAmountPaise: Money

  """What the ceiling is measured across. Required when `RESOLVED`."""
  fundingCeilingScope: FundingCeilingScope

  """
  Which assessments must pass before a later phase may start. Each type at
  most once.
  """
  requiredAssessmentTypes: [AssessmentType!]!

  """
  The questions this cycle asks, and when each is shown.

  Required: a cycle with no form has nothing for an applicant to fill in, and
  the questions the programme itself reads — the requested amount, the category,
  the date of birth — reach their input through a role bound here.
  """
  formTemplate: FormTemplateInput!

  """
  Which identity numbers the desk review collects and compares.

  Absent or empty means the cycle collects nothing and compares nothing.
  Each kind at most once.
  """
  identifierRules: [ProgrammeIdentifierRuleInput!]

  """
  The reasons this cycle offers for each administrative action. At most 50.

  A cycle with none cannot be operated, because every later action must name
  one — so this is filled in for a new cycle rather than left empty.
  """
  reasons: [ProgrammeReasonInput!]!
}

"""A whole programme cycle: its identity, its window, and its rules."""
input ProgrammeCycleInput {
  """
  Short code used in correspondence. 3–32 uppercase letters, digits or
  hyphens, and unique across cycles.

  **Example:** `"SEP-2026"`
  """
  cycleCode: String!

  """The cycle's name, as shown to applicants. At most 120 characters."""
  displayName: String!

  """The policy year, between 2000 and 9999."""
  cycleYear: Int!

  """Guidance written for applicants, shown on the application screens."""
  applicantGuidance: String

  """Guidance written for partner banks. Never shown to applicants."""
  partnerBankGuidance: String

  """
  When the application window opens. Null leaves it unscheduled, which is a
  cycle that cannot yet be applied to.
  """
  opensAt: DateTime

  """When the window closes. Must be later than `opensAt`."""
  closesAt: DateTime

  """Everything this cycle decides."""
  policy: ProgrammeCyclePolicyInput!
}

"""Replaces a draft cycle's identity, window and rules."""
input UpdateProgrammeCycleInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """Why it is being changed, kept in the cycle's history."""
  reason: String!

  """The complete replacement. Omitted fields are cleared."""
  cycle: ProgrammeCycleInput!
}

"""Moves a cycle from one lifecycle state to the next."""
input CycleTransitionInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """Why, kept in the cycle's history."""
  reason: String!
}

"""Rewrites the guidance on a cycle that is already open."""
input CycleGuidanceInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """The replacement guidance for applicants."""
  applicantGuidance: String!

  """The replacement guidance for partner banks."""
  partnerBankGuidance: String!

  """Why, kept in the cycle's history."""
  reason: String!
}

"""Moves the closing time of a cycle that is already open."""
input CycleClosingInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """
  The new closing time — or null to remove it, leaving the cycle open until
  the office closes it.
  """
  closesAt: DateTime

  """Why, kept in the cycle's history."""
  reason: String!
}

"""What `issuePolicyDocumentUpload` needs to authorize one policy PDF."""
input IssuePolicyDocumentUploadInput {
  """Which cycle the document belongs to."""
  cycleId: ID!

  """
  The policy document version this upload expects to replace: 0 for the first
  upload, otherwise the current version. A mismatch refuses.
  """
  expectedDocumentVersion: Int!

  """The file's own name, ending in `.pdf`. Stored and served back."""
  originalFilename: String!

  """The file's MIME type. Only `application/pdf` is accepted."""
  contentType: String!

  """The exact size in bytes. The stored object must match."""
  sizeBytes: Int!

  """The base64-encoded SHA-256 of the bytes. The stored object must match."""
  checksumSha256: String!
}

"""Which authorized upload `finalizePolicyDocumentUpload` settles."""
input FinalizePolicyDocumentUploadInput {
  """The `uploadId` that `issuePolicyDocumentUpload` returned."""
  uploadId: ID!
}

"""
Creating and operating programme cycles.

**Use case:** the screens under `/admin/cycles`. Requires the authority to
administer the programme — a reviewer or approver reaches none of this.
"""
type AdminProgrammeCycleMutation {
  """
  Creates a cycle as a draft.

  **Use case:** `/admin/cycles/new`. Nothing can be applied to until `open`.

  **Refuses:** a duplicate cycle code, a closing time at or before the
  opening, a policy whose rules repeat a document type or identifier kind, and
  a reason code that is not well formed.
  """
  create(
    """The whole cycle: identity, window and rules."""
    input: ProgrammeCycleInput!
  ): AdminCycleResult!

  """
  Replaces a draft cycle's rules.

  **Use case:** `/admin/cycles/$id` while the cycle is still a draft. This is
  the **only** way to change a cycle's rules — once open, only the guidance
  and the closing time may move, so that applications cannot be judged by
  rules that changed under them.

  **Refuses:** a cycle that is not a draft, and a stale `expectedVersion`.
  """
  updateDraft(
    """Which cycle, at which version, and the whole replacement."""
    input: UpdateProgrammeCycleInput!
  ): AdminCycleResult!

  """
  Opens a cycle for applications.

  **Use case:** the button on `/admin/cycles/$id`. Irreversible: an opened
  cycle can be closed but never returned to draft, and never deleted.

  **Refuses:** a cycle whose rules are incomplete, and a stale
  `expectedVersion`.
  """
  open(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Authorizes uploading the cycle's policy PDF — the order or circular the
  cycle implements.

  **Use case:** the policy document card on `/admin/cycles/$id`. The browser
  PUTs the file to the returned URL, then calls `finalizePolicyDocumentUpload`.
  Allowed while the cycle is a draft or open; a replacement becomes a new
  retained version.

  **Refuses:** anything but a PDF, a file over the document size limit, a bad
  checksum, a closed or archived cycle, and a stale `expectedDocumentVersion`.
  """
  issuePolicyDocumentUpload(
    """The cycle, the expected version, and the file's vital statistics."""
    input: IssuePolicyDocumentUploadInput!
  ): UploadAuthorizationResult!

  """
  Records an uploaded policy PDF as the cycle's current policy document.

  **Use case:** immediately after the PUT that `issuePolicyDocumentUpload`
  authorized. Verifies the stored bytes match the authorization, then queues
  the malware scan; the file stays undownloadable, and the cycle unopenable,
  until the scan is ACCEPTED.

  **Refuses:** an expired, finalized, or unknown authorization, and bytes
  that do not match what was authorized.
  """
  finalizePolicyDocumentUpload(
    """Which authorization to settle."""
    input: FinalizePolicyDocumentUploadInput!
  ): AdminCycleResult!

  """
  Rewrites the guidance on an open cycle.

  **Use case:** correcting or clarifying instructions mid-cycle. Guidance is
  not a rule, so this is allowed while a cycle is open.
  """
  updateOpenGuidance(
    """Which cycle, at which version, and the replacement wording."""
    input: CycleGuidanceInput!
  ): AdminCycleResult!

  """
  Moves or removes an open cycle's closing time.

  **Use case:** extending a deadline, or lifting it entirely. Closing stops new drafts; it strands
  neither existing submissions nor official correction requests.
  """
  changeClosingTime(
    """Which cycle, at which version, and the new closing time."""
    input: CycleClosingInput!
  ): AdminCycleResult!

  """
  Closes a cycle to new applications.

  Work already in the cycle continues; only starting a new application stops.

  **Refuses:** a stale `expectedVersion`.
  """
  close(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Archives a closed cycle, so it renders as read-only history.

  **Refuses:** a cycle that is not closed, and a stale `expectedVersion`.
  """
  archive(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Removes a draft cycle, reversibly.

  **Refuses:** a cycle that has ever been opened — it is part of the
  programme's record — and a stale `expectedVersion`.
  """
  softDeleteDraft(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Puts a removed draft cycle back.

  **Refuses:** a stale `expectedVersion`.
  """
  restoreDraft(
    """Which cycle."""
    id: ID!

    """The cycle's `currentVersion`; a mismatch refuses."""
    expectedVersion: Int!
  ): AdminCycleResult!
}

"""One staff-only note about an application."""
input InternalNoteInput {
  """The application to annotate. Refused for a `DRAFT`, which the office cannot see."""
  applicationId: ID!

  """
  What to record. Never shown to the applicant, and never deleted — a mistake
  is corrected with a new note rather than erased.
  """
  note: String!

  """
  The note this one corrects. Sending it links the two so the record shows
  what was believed and when. Null for an original note.
  """
  correctionOfNoteId: ID
}

"""One of the nine checks that make up a desk review."""
enum DeskReviewCheckType {
  """The identity and age documents match the person named."""
  IDENTITY_KYC

  """The Scheduled Tribe certificate is valid and belongs to the applicant."""
  ST_ELIGIBILITY

  """The qualifying group holds majority ownership."""
  MAJORITY_OWNERSHIP

  """The business operates inside the cycle's jurisdiction."""
  JURISDICTION

  """The form is complete and internally consistent."""
  FORM_COMPLETENESS

  """Every required document is attached and legible."""
  DOCUMENT_COMPLETENESS

  """The answers and the documents agree with each other."""
  ANSWER_DOCUMENT_CONSISTENCY

  """The project report is plausible."""
  DPR_FEASIBILITY

  """
  For a later phase, the earlier award was used as required. Not applicable
  to a first application.
  """
  EXPANSION_EVIDENCE
}

"""What a reviewer concluded about one check."""
enum DeskReviewCheckResult {
  """Satisfied. Where the cycle demands a number behind it, it is required."""
  PASS

  """Not satisfied."""
  FAIL

  """
  Does not apply to this application. Attesting to nothing, so no identifier
  is demanded.
  """
  NOT_APPLICABLE
}

"""What happens to the application when the review is recorded."""
enum DeskReviewOutcome {
  """On to a partner bank."""
  ADVANCE_TO_BANK

  """Back to the applicant, naming the stages to correct."""
  REQUEST_REVISION

  """Closed. Requires a reason from the cycle's catalogue."""
  REJECT
}

"""One check and what the reviewer concluded about it."""
input DeskReviewCheckInput {
  """Which check. All nine must be present exactly once."""
  checkType: DeskReviewCheckType!

  """What was concluded."""
  result: DeskReviewCheckResult!

  """The reviewer's note. Never shown to the applicant."""
  internalNote: String
}

"""One stage of the form the applicant is being asked to correct."""
