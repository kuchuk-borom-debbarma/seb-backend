"""Records what the committee decided about one application."""
input TtmDecisionInput {
  """The application being decided. Must be in `TTM_REVIEW`."""
  applicationId: ID!

  """Which agenda item this decides."""
  agendaItemId: ID!

  """The application's `statusVersion`; a mismatch refuses."""
  expectedStatusVersion: Int!

  """What the committee decided."""
  outcome: TtmDecisionOutcome!

  """The committee's reference for the decision."""
  decisionReference: String!

  """When the committee met. May precede today, and is recorded as given."""
  decisionDate: Date!

  """
  How much is approved, in paise. Required for `APPROVED`, must be greater
  than zero, and never more than was requested.
  """
  approvedAmountPaise: Money

  """Conditions the applicant must meet. For `APPROVED`."""
  applicantConditions: String

  """
  A reason approved by this cycle. Required for `DEFERRED` and `REJECTED`.
  """
  reasonCategoryId: ID

  """What the applicant is told."""
  applicantMessage: String!

  """What happens next, where there is something to say."""
  nextAction: String

  """
  Sections to correct, for `REVISION_REQUIRED`. Empty otherwise.
  """
  revisions: [AdminRevisionInput!]!

  """
  Required only of somebody deciding their own application. Permitted with
  disclosure; the disclosure is what is kept.
  """
  conflictAcknowledged: Boolean
}

"""
Supersedes a committee decision already recorded.

A correction is a new decision rather than an edit.
"""
input CorrectTtmDecisionInput {
  """The application whose recorded decision was wrong."""
  applicationId: ID!

  """The agenda item the superseded decision was taken on."""
  agendaItemId: ID!

  """Which decision this replaces."""
  supersedesDecisionId: ID!

  """The application's `statusVersion`; a mismatch refuses."""
  expectedStatusVersion: Int!

  """What the committee actually decided."""
  outcome: TtmDecisionOutcome!

  """The committee's reference."""
  decisionReference: String!

  """When the committee met. May precede today, and is recorded as given."""
  decisionDate: Date!

  """How much is approved, in paise. Required for `APPROVED`."""
  approvedAmountPaise: Money

  """Conditions the applicant must meet."""
  applicantConditions: String

  """A reason approved by this cycle, where the outcome needs one."""
  reasonCategoryId: ID

  """A reason approved by this cycle for `TTM_DECISION_CORRECTION`."""
  correctionReasonCategoryId: ID!

  """Why the earlier record was wrong, kept with both."""
  correctionReason: String!

  """What the applicant is told."""
  applicantMessage: String!

  """What happens next."""
  nextAction: String

  """Sections to correct, where the corrected outcome asks for them."""
  revisions: [AdminRevisionInput!]!
}

"""
Partner-bank referral, and the committee that decides.

**Use case:** the bank and committee panels on the workspace, and the screens
under `/admin/meetings`.
"""
type AdminDecisionMutation {
  """
  Refers a reviewed application to a partner bank.

  **Refuses:** an application not advanced by a desk review, and a stale
  `expectedStatusVersion`.
  """
  referToBank(
    """Which application, which bank, and what the applicant is told."""
    input: BankReferralInput!
  ): AdminWorkspaceResult!

  """
  Cancels a referral before the bank has answered.

  **Refuses:** a referral already answered, and a stale
  `expectedReferralVersion`.
  """
  cancelBankReferral(
    """Which referral, and why."""
    input: CancelBankReferralInput!
  ): AdminWorkspaceResult!

  """
  Records what the bank wrote back.

  The office records what the bank said; it does not decide. A
  `NOT_RECOMMENDED` outcome still goes to the committee, because bank feedback
  is advisory evidence rather than a veto.

  **Refuses:** a referral already answered, and stale versions.
  """
  recordBankOutcome(
    """Which referral, what the bank said, and what the applicant is told."""
    input: BankOutcomeInput!
  ): AdminWorkspaceResult!

  """
  Supersedes a bank outcome already recorded.

  Never an edit: the earlier record is kept, so the file shows what was
  believed and when.
  """
  correctBankOutcome(
    """Which outcome to replace, what it should say, and why."""
    input: CorrectBankOutcomeInput!
  ): AdminWorkspaceResult!

  """
  Schedules a committee meeting.

  **Use case:** `/admin/meetings`. Created as a draft, so its agenda can be
  built before it starts.
  """
  createMeeting(
    """When, where, and what it is for."""
    input: CreateTtmMeetingInput!
  ): AdminMeetingWorkspaceResult!

  """
  Changes a meeting that has not started.

  **Refuses:** a meeting under way or finalized, and a stale
  `expectedVersion`.
  """
  updateMeeting(
    """Which meeting, at which version, and the replacement details."""
    input: UpdateTtmMeetingInput!
  ): AdminMeetingWorkspaceResult!

  """
  Calls off a meeting. Its agenda items return to the queue.

  **Refuses:** a finalized meeting, and a stale `expectedVersion`.
  """
  cancelMeeting(
    """Which meeting, at which version, and why."""
    input: CancelTtmMeetingInput!
  ): AdminMeetingWorkspaceResult!

  """
  Puts an application on a draft meeting's agenda.

  **Refuses:** a meeting that is not a draft, an application not waiting for
  the committee, and a twenty-first active item.
  """
  addAgendaItem(
    """Which meeting, which application, and where on the agenda."""
    input: AddAgendaItemInput!
  ): AdminMeetingWorkspaceResult!

  """
  Moves an agenda item.

  **Refuses:** a meeting that is not a draft, and a stale `expectedVersion`.
  """
  reorderAgendaItem(
    """Which item, where to, and why."""
    input: ReorderAgendaItemInput!
  ): AdminMeetingWorkspaceResult!

  """
  Takes an application off the agenda, returning it to the queue.

  **Refuses:** a meeting that is not a draft, and a stale `expectedVersion`.
  """
  removeAgendaItem(
    """Which item, and why."""
    input: RemoveAgendaItemInput!
  ): AdminMeetingWorkspaceResult!

  """
  Opens the meeting. The agenda is fixed from this point.

  **Refuses:** a meeting that is not a draft, and a stale `expectedVersion`.
  """
  startMeeting(
    """Which meeting, at which version."""
    input: TtmMeetingTransitionInput!
  ): AdminMeetingWorkspaceResult!

  """
  Closes the meeting. The record becomes read-only.

  **Refuses:** a meeting with an agenda item still undecided, and a stale
  `expectedVersion`.
  """
  finalizeMeeting(
    """Which meeting, at which version."""
    input: TtmMeetingTransitionInput!
  ): AdminMeetingWorkspaceResult!

  """
  Records what the committee decided about one application.

  **Use case:** the committee panel on the workspace. Available to an approver
  as well as an administrator — deciding an application and administering the
  programme are separate authorities.

  **Refuses:** an approved amount of zero or more than was requested; a
  missing reason where the outcome needs one; deciding your own application
  without `conflictAcknowledged`; and a stale `expectedStatusVersion`.
  """
  recordDecision(
    """Which agenda item, what was decided, and what the applicant is told."""
    input: TtmDecisionInput!
  ): AdminWorkspaceResult!

  """
  Supersedes a committee decision already recorded.

  Never an edit: the earlier decision is kept.
  """
  correctDecision(
    """Which decision to replace, what it should say, and why."""
    input: CorrectTtmDecisionInput!
  ): AdminWorkspaceResult!
}

"""Creates the award that follows an approval."""
input CreateAwardInput {
  """The application being awarded. Must be `APPROVED`."""
  applicationId: ID!

  """Which committee decision approved it."""
  decisionId: ID!

  """The application's `statusVersion`; a mismatch refuses."""
  expectedStatusVersion: Int!

  """The programme's sanction order number."""
  sanctionOrderNumber: String!

  """The date of the sanction order."""
  sanctionDate: Date!

  """Conditions the applicant must meet."""
  applicantConditions: String
}

"""Amends, suspends, cancels or closes an award."""
input ChangeAwardInput {
  """The award to change. From `AdminAward.id` on the funding workspace."""
  awardId: ID!

  """Which application it belongs to."""
  applicationId: ID!

  """The award's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """The application's `statusVersion`; a mismatch refuses."""
  expectedStatusVersion: Int!

  """The state the award moves to."""
  status: AwardStatus!

  """How a closed award ended. Required when closing."""
  closureDisposition: AwardClosureDisposition

  """
  The sanctioned amount, in paise. Never below what has already been paid out
  net of reversals — an award cannot be amended to less than it has given.
  """
  sanctionedAmountPaise: Money!

  """Conditions the applicant must meet."""
  applicantConditions: String

  """A reason approved by this cycle for the matching award context."""
  reasonCategoryId: ID!

  """Why, in the officer's words, kept with the record."""
  reason: String!
}

"""
Records one payment against an award.

The banking prerequisites are recorded with the payment rather than checked
elsewhere, so the file shows what was verified before money moved.
"""
input RecordReleaseInput {
  """The award to pay against. Must be `ACTIVE`."""
  awardId: ID!

  """Which application it belongs to."""
  applicationId: ID!

  """
  The award's `ledgerVersion`. Separate from `currentVersion` so that
  recording a payment does not invalidate an in-flight amendment.
  """
  expectedLedgerVersion: Int!

  """
  How much was paid, in paise. Never more than remains unreleased.
  """
  amountPaise: Money!

  """When the money moved."""
  occurredAt: DateTime!

  """The bank's reference, for reconciliation. Unique per award."""
  externalReference: String!

  """The committee approval this payment rests on."""
  ttmApprovalReference: String!

  """When the committee approved. May precede today, and is recorded as given."""
  ttmApprovalDate: Date!

  """When the applicant's bank account was verified."""
  bankAccountVerifiedAt: DateTime!

  """The performance agreement the applicant signed."""
  performanceAgreementReference: String!

  """When that agreement was executed."""
  performanceAgreementExecutedAt: DateTime!

  """Whether a physical verification was required for this instalment."""
  physicalVerificationRequired: Boolean!

  """Its reference. Required when one was required."""
  physicalVerificationReference: String

  """When it was completed. Required when one was required."""
  physicalVerificationCompletedAt: DateTime

  """What the applicant is told about this payment."""
  applicantMessage: String!
}

"""
Reverses a payment already made.

Posted as its own ledger entry rather than editing what is there, so the ledger
always reconciles.
"""
input ReverseReleaseInput {
  """The award the payment was made against."""
  awardId: ID!

  """Which application it belongs to."""
  applicationId: ID!

  """Which payment is being reversed."""
  releaseId: ID!

  """The award's `ledgerVersion`; a mismatch refuses."""
  expectedLedgerVersion: Int!

  """
  How much to reverse, in paise. Never more than that payment, counting
  anything already reversed from it.
  """
  amountPaise: Money!

  """When the reversal happened."""
  occurredAt: DateTime!

  """The bank's reference, for reconciliation."""
  externalReference: String!

  """A reason approved by this cycle for `RELEASE_REVERSAL`."""
  reasonCategoryId: ID!

  """What the applicant is told."""
  applicantMessage: String!
}

"""Records an assessment of how an award is being used."""
input RecordAssessmentInput {
  """The award being assessed. From the funding workspace."""
  awardId: ID!

  """Which application it belongs to."""
  applicationId: ID!

  """What is being assessed."""
  assessmentType: AssessmentType!

  """
  Which payment this assesses, for utilization. Null for assessments about the
  award as a whole.
  """
  utilizationObligationId: ID

  """What was concluded."""
  outcome: AssessmentOutcome!

  """The office's reference for the evidence. Never shown to the applicant."""
  evidenceReference: String!

  """What the applicant is told."""
  applicantSummary: String!

  """A staff-only note."""
  internalNote: String

  """When it was concluded."""
  assessedAt: DateTime!
}

"""Opens a recovery case against an award."""
input OpenRecoveryInput {
  """Which award is being recovered against."""
  awardId: ID!

  """The official decision authorising recovery."""
  officialDecisionReference: String!

  """When recovery was authorised. May precede today, and is recorded as given."""
  officialDecisionDate: Date!

  """A reason approved by this cycle for `RECOVERY`."""
  reasonCategoryId: ID!

  """What the applicant is told."""
  applicantMessage: String!
}

"""
Posts one entry to a recovery ledger.

Append-only: a mistake is corrected by posting a reversal, never by editing
what is there.
"""
input RecoveryEntryInput {
  """From `AdminRecoveryCase.id`. Must still be open."""
  recoveryCaseId: ID!

  """The case's `ledgerVersion`; a mismatch refuses."""
  expectedLedgerVersion: Int!

  """What this entry does to the balance."""
  entryType: RecoveryEntryType!

  """Which part of the recovery it applies to."""
  component: RecoveryComponent!

  """The entry this reverses. Required for `REVERSAL`, null otherwise."""
  relatedEntryId: ID

  """
  The amount, in paise. Always positive — `entryType` says the direction.
  A receipt or waiver may never take the balance below zero.
  """
  amountPaise: Money!

  """The external reference, for reconciliation."""
  externalReference: String!

  """When it happened."""
  occurredAt: DateTime!

  """
  A reason approved by this cycle. Required for `WAIVER`, which is public
  money being written off.
  """
  reasonCategoryId: ID

  """What the applicant is told."""
  applicantMessage: String!
}

"""Closes or cancels a recovery case."""
input CloseRecoveryInput {
  """From `AdminRecoveryCase.id`."""
  recoveryCaseId: ID!

  """The case's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """Why, kept with the record."""
  reason: String!
}

"""
Awards, payments, assessments and recovery.

**Use case:** `/admin/applications/$id/funding` and the recovery screens.
Every ledger here is append-only, so a correction is always a new entry.
"""
type AdminFundingMutation {
  """
  Creates the award that follows a committee approval.

  **Refuses:** an application without an approving decision, a duplicate
  sanction order number, and a stale `expectedStatusVersion`.
  """
  createAward(
    """Which application, which decision, and the sanction order."""
    input: CreateAwardInput!
  ): AdminFundingWorkspaceResult!

  """
  Amends, suspends, cancels or closes an award.

  **Refuses:** an amendment below what has already been paid net of
  reversals, a closure with no disposition, and stale versions.
  """
  changeAward(
    """Which award, the state it moves to, and why."""
    input: ChangeAwardInput!
  ): AdminFundingWorkspaceResult!

  """
  Records one payment against an award.

  **Refuses:** more than remains unreleased, a duplicate external reference,
  a missing banking prerequisite, and a stale `expectedLedgerVersion`.
  """
  recordRelease(
    """Which award, how much, and what was verified beforehand."""
    input: RecordReleaseInput!
  ): AdminFundingWorkspaceResult!

  """
  Reverses a payment already made.

  **Refuses:** more than that payment net of earlier reversals, and a stale
  `expectedLedgerVersion`.
  """
  reverseRelease(
    """Which payment, how much, and why."""
    input: ReverseReleaseInput!
  ): AdminFundingWorkspaceResult!

  """
  Records an assessment of how an award is being used.

  Supersedes rather than replaces: an earlier assessment of the same thing is
  kept, and utilization is assessed per payment, so several can be current at
  once.
  """
  recordAssessment(
    """Which award, what was assessed, and what was concluded."""
    input: RecordAssessmentInput!
  ): AdminFundingWorkspaceResult!

  """
  Opens a recovery case against an award.

  **Refuses:** an award with an open recovery case already.
  """
  openRecovery(
    """Which award, and the decision authorising recovery."""
    input: OpenRecoveryInput!
  ): AdminRecoveryWorkspaceResult!

  """
  Posts one entry to a recovery ledger.

  **Refuses:** a receipt or waiver that would take the balance below zero, a
  reversal larger than the entry it reverses, a waiver with no reason, and a
  stale `expectedLedgerVersion`.
  """
  recordRecoveryEntry(
    """Which case, what the entry does, and how much."""
    input: RecoveryEntryInput!
  ): AdminRecoveryWorkspaceResult!

  """
  Cancels a recovery case opened in error.

  **Refuses:** a case with any entry already posted — once money has been
  demanded or received, the case is closed with compensating entries rather
  than cancelled.
  """
  cancelRecovery(
    """Which case, and why."""
    input: CloseRecoveryInput!
  ): AdminRecoveryWorkspaceResult!

  """
  Closes a recovery case that is fully settled.

  **Refuses:** a case with anything still outstanding.
  """
  closeRecovery(
    """Which case, and why."""
    input: CloseRecoveryInput!
  ): AdminRecoveryWorkspaceResult!
}
