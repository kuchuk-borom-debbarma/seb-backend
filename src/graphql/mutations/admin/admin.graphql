extend type Mutation {
  """
  Everything the programme office does.

  **Use case:** the office screens under `/admin`. Requires a staff role, and
  most of it requires more than the ability to read — a reviewer reaches none
  of these.
  """
  admin: AdminMutation!
}

"""The four things the office acts on, in the order a file passes through."""
type AdminMutation {
  """Creating and operating the programme cycles."""
  programmeCycle: AdminProgrammeCycleMutation!

  """Working applications as they arrive, and reviewing them."""
  intake: AdminIntakeMutation!

  """Partner-bank referral and the committee that decides."""
  decision: AdminDecisionMutation!

  """Awards, payments, assessments and recovery."""
  funding: AdminFundingMutation!
}

"""One document a cycle requires, and the condition it is required under."""
input ProgrammeDocumentRuleInput {
  """Which evidence slot."""
  documentType: DocumentType!

  """When it becomes required. `OPTIONAL` means it is never demanded."""
  condition: ProgrammeDocumentCondition!
}

"""One approved reason for one administrative action."""
input ProgrammeReasonInput {
  """Which action this reason may be used for."""
  context: ProgrammeReasonContext!

  """
  Stable code for reporting. Uppercase letters, digits and underscores, 2–64
  characters.

  **Example:** `"INCOMPLETE_EVIDENCE"`
  """
  code: String!

  """What staff see in the reason picker. At most 120 characters."""
  label: String!

  """
  Suggested wording for the applicant, which the officer may edit before
  sending. At most 500 characters. Null where the action carries no message.
  """
  applicantMessageTemplate: String
}

"""
Whether the desk review demands an identity number, and when.

`REQUIRED_ON_PASS` rather than `REQUIRED`: an identifier is the evidence behind
a check, and a check that was failed or marked not applicable is attesting to
nothing, so there is nothing to have read.
"""
enum IdentifierRequirement {
  """
  Demanded whenever the check it stands behind is passed. Requires
  `checkType`.
  """
  REQUIRED_ON_PASS

  """Collected if the reviewer has it. Never blocks a review."""
  OPTIONAL

  """
  Not collected at all. No field appears, and sending a value for it is
  refused rather than silently dropped.
  """
  OFF
}

"""Whether an identity number is compared against other applications."""
enum IdentifierDuplicatePolicy {
  """
  Compared. A match on another funding case is raised as a question the
  reviewer must answer.
  """
  CHECKED

  """
  Recorded but never compared. For numbers legitimately shared — a family
  bank account is a real thing, and refusing on it would be wrong.
  """
  NOT_CHECKED
}

"""
One identity number a cycle collects, and what it does with it.

The two settings are **independent**: a value can be worth recording without
being worth refusing on, and worth comparing without being demanded.
"""
input ProgrammeIdentifierRuleInput {
  """Which number. Each kind may appear at most once per cycle."""
  kind: DeskReviewIdentifierKind!

  """Whether the reviewer must transcribe it, and when."""
  requirement: IdentifierRequirement!

  """Whether it is compared against other applications."""
  duplicatePolicy: IdentifierDuplicatePolicy!

  """
  The desk-review check this number is evidence for.

  Required exactly when `requirement` is `REQUIRED_ON_PASS`, and refused
  otherwise — only a requirement conditional on a check has a moment at which
  it applies.
  """
  checkType: DeskReviewCheckType
}

"""
Everything one cycle decides, sent complete on every write.

A replacement rather than a patch. Each write makes a new cycle version, and
applications keep the version they were submitted against — so editing a cycle
never changes what an application already sent is judged by.
"""
input ProgrammeCyclePolicyInput {
  """Youngest applicant the cycle accepts, in years."""
  minimumApplicantAge: Int

  """Oldest applicant the cycle accepts, in years."""
  maximumApplicantAge: Int

  """
  How many months of trading separates the two funding bands. At or below
  this is `CATEGORY_A`; above it is `CATEGORY_B`.
  """
  categoryAMaximumMonths: Int

  """How long after an award before a later phase may be applied for."""
  expansionWaitMonths: Int

  """Whether the applicant must confirm majority ownership."""
  majorityOwnershipRequired: Boolean

  """Whose rules this cycle applies."""
  jurisdiction: ProgrammeJurisdiction

  """
  Whether a maximum award has been settled. `UNRESOLVED` is honest rather than
  missing: no amount is checked against a ceiling nobody has approved.
  """
  fundingCeilingState: FundingCeilingState

  """The ceiling, in paise. Required when the state is `RESOLVED`."""
  fundingCeilingAmountPaise: Money

  """What the ceiling is measured across. Required when `RESOLVED`."""
  fundingCeilingScope: FundingCeilingScope

  """
  Which assessments must pass before a later phase may start. Each type at
  most once.
  """
  requiredAssessmentTypes: [AssessmentType!]!

  """
  One rule per supported document type — the full set, not a subset. A
  document that is not wanted is included with condition `OPTIONAL`.
  """
  documentRules: [ProgrammeDocumentRuleInput!]!

  """
  Which identity numbers the desk review collects and compares.

  Absent or empty means the cycle collects nothing and compares nothing.
  Each kind at most once.
  """
  identifierRules: [ProgrammeIdentifierRuleInput!]

  """
  The reasons this cycle offers for each administrative action. At most 50.

  A cycle with none cannot be operated, because every later action must name
  one — so this is filled in for a new cycle rather than left empty.
  """
  reasons: [ProgrammeReasonInput!]!
}

"""A whole programme cycle: its identity, its window, and its rules."""
input ProgrammeCycleInput {
  """
  Short code used in correspondence. 3–32 uppercase letters, digits or
  hyphens, and unique across cycles.

  **Example:** `"SEP-2026"`
  """
  cycleCode: String!

  """The cycle's name, as shown to applicants. At most 120 characters."""
  displayName: String!

  """The policy year, between 2000 and 9999."""
  cycleYear: Int!

  """The policy document this cycle implements."""
  policyReference: String

  """Guidance written for applicants, shown on the application screens."""
  applicantGuidance: String

  """Guidance written for partner banks. Never shown to applicants."""
  partnerBankGuidance: String

  """
  When the application window opens. Null leaves it unscheduled, which is a
  cycle that cannot yet be applied to.
  """
  opensAt: DateTime

  """When the window closes. Must be later than `opensAt`."""
  closesAt: DateTime

  """Everything this cycle decides."""
  policy: ProgrammeCyclePolicyInput!
}

"""Replaces a draft cycle's identity, window and rules."""
input UpdateProgrammeCycleInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """Why it is being changed, kept in the cycle's history."""
  reason: String!

  """The complete replacement. Omitted fields are cleared."""
  cycle: ProgrammeCycleInput!
}

"""Moves a cycle from one lifecycle state to the next."""
input CycleTransitionInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """Why, kept in the cycle's history."""
  reason: String!
}

"""Rewrites the guidance on a cycle that is already open."""
input CycleGuidanceInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """The replacement guidance for applicants."""
  applicantGuidance: String!

  """The replacement guidance for partner banks."""
  partnerBankGuidance: String!

  """Why, kept in the cycle's history."""
  reason: String!
}

"""Moves the closing time of a cycle that is already open."""
input CycleClosingInput {
  """Which cycle."""
  id: ID!

  """The cycle's `currentVersion`; a mismatch refuses."""
  expectedVersion: Int!

  """The new closing time."""
  closesAt: DateTime!

  """Why, kept in the cycle's history."""
  reason: String!
}

"""
Creating and operating programme cycles.

**Use case:** the screens under `/admin/cycles`. Requires the authority to
administer the programme — a reviewer or approver reaches none of this.
"""
type AdminProgrammeCycleMutation {
  """
  Creates a cycle as a draft.

  **Use case:** `/admin/cycles/new`. Nothing can be applied to until `open`.

  **Refuses:** a duplicate cycle code, a closing time at or before the
  opening, a policy whose rules repeat a document type or identifier kind, and
  a reason code that is not well formed.
  """
  create(
    """The whole cycle: identity, window and rules."""
    input: ProgrammeCycleInput!
  ): AdminCycleResult!

  """
  Replaces a draft cycle's rules.

  **Use case:** `/admin/cycles/$id` while the cycle is still a draft. This is
  the **only** way to change a cycle's rules — once open, only the guidance
  and the closing time may move, so that applications cannot be judged by
  rules that changed under them.

  **Refuses:** a cycle that is not a draft, and a stale `expectedVersion`.
  """
  updateDraft(
    """Which cycle, at which version, and the whole replacement."""
    input: UpdateProgrammeCycleInput!
  ): AdminCycleResult!

  """
  Opens a cycle for applications.

  **Use case:** the button on `/admin/cycles/$id`. Irreversible: an opened
  cycle can be closed but never returned to draft, and never deleted.

  **Refuses:** a cycle whose rules are incomplete, and a stale
  `expectedVersion`.
  """
  open(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Rewrites the guidance on an open cycle.

  **Use case:** correcting or clarifying instructions mid-cycle. Guidance is
  not a rule, so this is allowed while a cycle is open.
  """
  updateOpenGuidance(
    """Which cycle, at which version, and the replacement wording."""
    input: CycleGuidanceInput!
  ): AdminCycleResult!

  """
  Moves an open cycle's closing time.

  **Use case:** extending a deadline. Closing stops new drafts; it strands
  neither existing submissions nor official correction requests.
  """
  changeClosingTime(
    """Which cycle, at which version, and the new closing time."""
    input: CycleClosingInput!
  ): AdminCycleResult!

  """
  Closes a cycle to new applications.

  Work already in the cycle continues; only starting a new application stops.

  **Refuses:** a stale `expectedVersion`.
  """
  close(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Archives a closed cycle, so it renders as read-only history.

  **Refuses:** a cycle that is not closed, and a stale `expectedVersion`.
  """
  archive(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Removes a draft cycle, reversibly.

  **Refuses:** a cycle that has ever been opened — it is part of the
  programme's record — and a stale `expectedVersion`.
  """
  softDeleteDraft(
    """Which cycle, at which version, and why."""
    input: CycleTransitionInput!
  ): AdminCycleResult!

  """
  Puts a removed draft cycle back.

  **Refuses:** a stale `expectedVersion`.
  """
  restoreDraft(
    """Which cycle."""
    id: ID!

    """The cycle's `currentVersion`; a mismatch refuses."""
    expectedVersion: Int!
  ): AdminCycleResult!
}

"""One staff-only note about an application."""
input InternalNoteInput {
  """The application to annotate. Refused for a `DRAFT`, which the office cannot see."""
  applicationId: ID!

  """
  What to record. Never shown to the applicant, and never deleted — a mistake
  is corrected with a new note rather than erased.
  """
  note: String!

  """
  The note this one corrects. Sending it links the two so the record shows
  what was believed and when. Null for an original note.
  """
  correctionOfNoteId: ID
}

"""One of the nine checks that make up a desk review."""
enum DeskReviewCheckType {
  """The identity and age documents match the person named."""
  IDENTITY_KYC

  """The Scheduled Tribe certificate is valid and belongs to the applicant."""
  ST_ELIGIBILITY

  """The qualifying group holds majority ownership."""
  MAJORITY_OWNERSHIP

  """The business operates inside the cycle's jurisdiction."""
  JURISDICTION

  """The form is complete and internally consistent."""
  FORM_COMPLETENESS

  """Every required document is attached and legible."""
  DOCUMENT_COMPLETENESS

  """The answers and the documents agree with each other."""
  ANSWER_DOCUMENT_CONSISTENCY

  """The project report is plausible."""
  DPR_FEASIBILITY

  """
  For a later phase, the earlier award was used as required. Not applicable
  to a first application.
  """
  EXPANSION_EVIDENCE
}

"""What a reviewer concluded about one check."""
enum DeskReviewCheckResult {
  """Satisfied. Where the cycle demands a number behind it, it is required."""
  PASS

  """Not satisfied."""
  FAIL

  """
  Does not apply to this application. Attesting to nothing, so no identifier
  is demanded.
  """
  NOT_APPLICABLE
}

"""What happens to the application when the review is recorded."""
enum DeskReviewOutcome {
  """On to a partner bank."""
  ADVANCE_TO_BANK

  """Back to the applicant, naming the sections to correct."""
  REQUEST_REVISION

  """Closed. Requires a reason from the cycle's catalogue."""
  REJECT
}

"""One check and what the reviewer concluded about it."""
input DeskReviewCheckInput {
  """Which check. All nine must be present exactly once."""
  checkType: DeskReviewCheckType!

  """What was concluded."""
  result: DeskReviewCheckResult!

  """The reviewer's note. Never shown to the applicant."""
  internalNote: String
}

"""One section the applicant is being asked to correct."""
input AdminRevisionInput {
  """Which part of the form. Only this section becomes editable."""
  section: ApplicationSection!

  """A reason approved by this cycle for the `REVISION` context."""
  reasonCategoryId: ID!

  """What the applicant must change, in the officer's words."""
  note: String!
}

"""
An identity number a reviewer read off a document.

A passed check without its number is an attestation with nothing behind it, so
where the cycle demands one the API refuses without it.
"""
enum DeskReviewIdentifierKind {
  """The Scheduled Tribe certificate number. Stored as written."""
  ST_CERTIFICATE

  """
  The identity document number. Stored as a keyed digest and never in the
  clear; only the last four digits are ever shown back.
  """
  IDENTITY_DOCUMENT

  """
  The bank account number, with its branch code. Stored as a keyed digest.
  """
  BANK_ACCOUNT

  """The business registration number. Stored as written."""
  BUSINESS_REGISTRATION
}

"""One number transcribed off a document."""
input DeskReviewIdentifierInput {
  """Which number this is."""
  kind: DeskReviewIdentifierKind!

  """
  The number exactly as it appears on the document. Punctuation and case are
  ignored when comparing, so `ST/2026/00123` and `st-2026-00123` are one
  certificate.
  """
  value: String!

  """
  The branch code, for `BANK_ACCOUNT` only. An account number identifies a
  destination only together with the branch it is held at — the same digits at
  two banks are two accounts.

  **Example:** `"SBIN0007890"`
  """
  branchCode: String

  """
  Why this is not the same claim, sent on a **second** attempt after the API
  has said the value already exists on another funding case.

  A match is a question rather than a verdict — the same promoter legitimately
  returns for a later phase — so the answer is recorded beside the number that
  raised it.
  """
  matchedReason: String
}

"""
Records the desk review and moves the application on.

The nine checks, the transcribed numbers and the outcome are one write, so a
review can never be left half-recorded.
"""
input CompleteDeskReviewInput {
  """The application under review. Must be in `DESK_REVIEW`."""
  applicationId: ID!

  """
  The application's `statusVersion`. A mismatch means somebody else acted
  first, and refuses rather than overwriting their work.
  """
  expectedStatusVersion: Int!

  """What happens to the application."""
  outcome: DeskReviewOutcome!

  """All nine checks, each exactly once."""
  checks: [DeskReviewCheckInput!]!

  """
  A reason approved by this cycle for the `REJECTION` context. Required when
  the outcome is `REJECT`, and ignored otherwise.
  """
  reasonCategoryId: ID

  """
  What the applicant is told. Required for anything but `ADVANCE_TO_BANK`,
  where there is nothing yet to tell them.
  """
  applicantMessage: String

  """
  The sections to correct. Required and non-empty for `REQUEST_REVISION`, and
  empty otherwise.
  """
  revisions: [AdminRevisionInput!]!

  """
  The numbers read off the documents behind the checks just passed.

  What is demanded is the **cycle's** decision: a value for a kind the cycle
  switched off is refused rather than dropped, and a passed check whose kind
  the cycle demands is refused without one.
  """
  identifiers: [DeskReviewIdentifierInput!]!

  """
  Required only of somebody reviewing their own application.

  Acting on your own application is permitted **with disclosure**; this is the
  disclosure, and it is what lands in the audit trail. There is nothing to
  reserve before acting, so it belongs on the act that decides something.
  """
  conflictAcknowledged: Boolean
}

"""Begins the desk review of a submitted application."""
input StartDeskReviewInput {
  """The application to begin reviewing. Must be `SUBMITTED`."""
  applicationId: ID!

  """The application's `statusVersion`; a mismatch refuses."""
  expectedStatusVersion: Int!
}

"""Withdraws a correction request made in error."""
input CancelRevisionInput {
  """The application the correction request belongs to."""
  applicationId: ID!

  """Which correction request to withdraw."""
  revisionRequestId: ID!

  """The application's `statusVersion`; a mismatch refuses."""
  expectedStatusVersion: Int!

  """Why it is being withdrawn, kept with the record."""
  reason: String!
}

"""
Working applications as they arrive, and reviewing them.

**Use case:** `/admin/applications/$id`. Nothing is reserved beforehand:
holding the right role is what permits an action, and two officers acting at
once are settled by `expectedStatusVersion`.
"""
type AdminIntakeMutation {
  """
  Adds a staff-only note to an application.

  **Use case:** the notes panel on the workspace. Append-only, and never
  requires having worked the file.

  **Refuses:** a draft application, which the office cannot see at all.
  """
  addInternalNote(
    """Which application, and what to record."""
    input: InternalNoteInput!
  ): AdminWorkspaceResult!

  """
  Begins the desk review, moving the application out of the queue.

  **Use case:** the button on the workspace. Also records who is working the
  file, which is what the "who is on this" notice shows — advisory, and it
  locks nobody out.

  **Refuses:** an application that is not submitted, and a stale
  `expectedStatusVersion`.
  """
  startDeskReview(
    """Which application, at which status version."""
    input: StartDeskReviewInput!
  ): AdminApplicationResult!

  """
  Records the desk review and moves the application on.

  **Use case:** the reviewer's form on the workspace. One write, so a review
  cannot be half-recorded.

  **Refuses:** a missing or duplicated check; a passed check with no
  identifier where the cycle demands one; a value for an identifier the cycle
  does not collect; an identifier already recorded on another funding case
  with no explanation; reviewing your own application without
  `conflictAcknowledged`; and, for `ADVANCE_TO_BANK`, any submitted document
  whose latest malware scan is not accepted.
  """
  completeDeskReview(
    """The whole review: checks, identifiers, outcome."""
    input: CompleteDeskReviewInput!
  ): AdminWorkspaceResult!

  """
  Withdraws a correction request made in error.

  **Refuses:** a request already resolved or already withdrawn, and a stale
  `expectedStatusVersion`.
  """
  cancelRevision(
    """Which request to withdraw, and why."""
    input: CancelRevisionInput!
  ): AdminWorkspaceResult!
}

