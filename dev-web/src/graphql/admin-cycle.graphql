fragment AdminCycleHead on AdminProgrammeCycle {
  id
  cycleCode
  displayName
  cycleYear
  policyReference
  applicantGuidance
  partnerBankGuidance
  status
  opensAt
  closesAt
  currentVersion
  createdAt
  updatedAt
  deletedAt
}

query AdminCycles(
  $first: Int
  $after: String
  $includeDeleted: Boolean
  $status: ProgrammeCycleStatus
  $cycleYear: Int
  $search: String
) {
  admin {
    programmeCycle {
      list(
        first: $first
        after: $after
        includeDeleted: $includeDeleted
        status: $status
        cycleYear: $cycleYear
        search: $search
      ) {
        success
        message
        response {
          nodes { ...AdminCycleHead }
          pageInfo { endCursor hasNextPage totalCount }
        }
      }
    }
  }
}

query AdminCycleById($id: ID!) {
  admin {
    programmeCycle {
      byId(id: $id) {
        success
        message
        response {
          head { ...AdminCycleHead }
          # The rules as this cycle actually holds them, rather than the
          # defaults this client would otherwise resend on every save.
          policy {
            minimumApplicantAge
            maximumApplicantAge
            categoryAMaximumMonths
            expansionWaitMonths
            majorityOwnershipRequired
            jurisdiction
            fundingCeilingState
            fundingCeilingAmountPaise
            fundingCeilingScope
          }
          identifierRules { kind requirement duplicatePolicy checkType }
          # What this cycle actually asks. An administrator cannot change a form
          # they cannot see, and until this existed the only way to look at one
          # was to start an application against the cycle.
          formTemplate { ...FormTemplateFields }
          # The editable definitions behind the template's derived group
          # members — needed here so editing a draft can send the authoring
          # form back rather than its own expansion.
          groupDefinitions { ...GroupDefinitionFields }
          assessmentRules { id assessmentType requiredOutcome }
          reasons { id context code label applicantMessageTemplate }
        }
      }
      counts(id: $id) {
        success
        response { counts { status count } }
      }
      events(id: $id, first: 20) {
        success
        response { events { id eventType message createdAt } }
      }
    }
  }
}

mutation CreateCycle($input: ProgrammeCycleInput!) {
  admin {
    programmeCycle {
      create(input: $input) {
