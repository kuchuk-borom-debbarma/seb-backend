# Intake: the office-wide list of submitted applications, and one
# application's workspace. Which stage holds a file and what it may do next
# belongs to its pipeline, and is read from the stage operations
# (`admin-stage.graphql`).

query IntakeQueue($input: AdminIntakeQueueInput) {
  admin {
    intake {
      queue(input: $input) {
        success
        message
        response {
          nodes {
            id
            referenceNumber
            enterpriseName
            cycleCode
            sector
            category
            phaseNumber
            applicationKind
            status
            statusVersion
            currentStageKey
            stageName
            stageEnteredAt
            flags { key label }
            requestedGrantPaise
            requestedLoanPaise
            submissionNumber
            submittedAt
            statusChangedAt
            updatedAt
          }
          pageInfo { endCursor hasNextPage totalCount }
        }
      }
    }
  }
}

# Looking an application up by the reference number an applicant quotes on the
# phone. Exact match: there is no partial search, because a reference number is
# either the one being asked about or it is not.
query IntakeByReference($referenceNumber: String!) {
  admin {
    intake {
      byReference(referenceNumber: $referenceNumber) {
        success
        message
        response {
          id
          referenceNumber
          status
          statusVersion
          updatedAt
        }
      }
    }
  }
}

# One application, as the programme office sees it.
#
# The API returns the whole workspace in one call — submissions, snapshots,
# documents, revisions, notes and the case history —
# so a screen assembled from a dozen small queries would be slower and could
# show two moments at once. Fields not yet rendered are left out of the
# selection set rather than fetched and ignored.
query IntakeWorkspace($applicationId: ID!) {
  admin {
    intake {
      workspace(applicationId: $applicationId) {
        success
        message
        response {
          # Where the file stands in its pipeline is the stage view's to say
          # (`admin.stage.application`), with labels rather than keys.
          application {
            id
            referenceNumber
            status
            statusVersion
            applicationKind
            updatedAt
          }
          enterpriseName
          cycleCode
          cycleDisplayName
          submissions { id submissionNumber applicationVersion submittedAt }
          submissionChanges { fromSubmissionNumber toSubmissionNumber stageKeys }
          formTemplate { ...FormTemplateFields }
          snapshots { version answers }
          caseHistory {
            id
            referenceNumber
            applicationKind
            phaseNumber
            status
            statusFlags
            cycleCode
            createdAt
          }
          documents {
            id
            submissionId
            documentId
            fieldKey
            documentVersion
            originalFilename
            contentType
            sizeBytes
          }
          revisions { id stageKey note requestedAt resolvedAt cancelledAt }
          notes { id correctionOfNoteId note authoredByUserId createdAt }
        }
      }
    }
  }
}

query AdminDocumentDownloadUrl($applicationId: ID!, $submissionDocumentId: ID!) {
  admin {
    intake {
      documentDownloadUrl(
        applicationId: $applicationId
        submissionDocumentId: $submissionDocumentId
      ) {
        success
        message
        response { downloadUrl expiresAt }
      }
    }
  }
}

mutation AddInternalNote($input: InternalNoteInput!) {
  admin {
    intake {
      addInternalNote(input: $input) {
        success
        message
        response { notes { id correctionOfNoteId note authoredByUserId createdAt } }
      }
    }
  }
}

# The intake casework as aggregates: one filtered set counted along every
# reporting dimension. The API reuses the queue's own filter block, so these
# numbers always describe exactly the set the queue would list.
query IntakeAnalytics($input: AdminIntakeAnalyticsInput) {
  admin {
    analytics {
      summary(input: $input) {
        success
        message
        response {
          statuses { status count }
          categories { category count }
          sectors { sector count }
          districts { district count }
          cycles { cycleId cycleCode count }
          requested { count totalPaise averagePaise }
          monthly { month count }
        }
      }
    }
  }
}
