fragment MeetingWorkspaceRecord on AdminMeetingWorkspace {
  meeting {
    id
    meetingReference
    scheduledAt
    venue
    description
    status
    currentVersion
  }
  agenda { id applicationId submissionId bankOutcomeId position status currentVersion }
  decisions {
    id
    outcome
    decisionReference
    decisionDate
    approvedAmountPaise
    applicantMessage
    createdAt
  }
}

query TtmMeetings($first: Int, $after: String, $status: TtmMeetingStatus) {
  admin {
    decision {
      meetings(first: $first, after: $after, status: $status) {
        success
        message
        response {
          nodes {
            id
            meetingReference
            scheduledAt
            venue
            description
            status
            currentVersion
          }
          pageInfo { endCursor hasNextPage totalCount }
        }
      }
    }
  }
}

query TtmMeeting($meetingId: ID!) {
  admin {
    decision {
      meetingById(meetingId: $meetingId) {
        success
        message
        response { ...MeetingWorkspaceRecord }
      }
    }
  }
}

