# Decisions: the partner bank's evaluation and the programme's ruling.
#
# Both are recorded rather than made here — the bank writes to the programme
# office, and the decision is taken on the strength of what is on the file — so
# every operation names the external reference and date of the real document it
# is recording.

mutation ReferToBank($input: BankReferralInput!) {
  admin {
    decision {
      referToBank(input: $input) {
        success
        message
        response { application { id status statusVersion } }
      }
    }
  }
}

