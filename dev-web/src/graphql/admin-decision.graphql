# Decisions: the partner bank's evaluation and the committee's ruling.
#
# Both are recorded rather than made here — the bank writes to the programme
# office and the committee meets — so every operation names the external
# reference and date of the real document it is recording.

mutation ReferToBank($input: BankReferralInput!) {
  admin {
    decision {
      referToBank(input: $input) {
        success
        message
        response { application { id status statusVersion } }
      }
    }
  }
}

