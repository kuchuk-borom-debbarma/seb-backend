# Role management.
#
# Lookup is exact-match by design — there is no listing and no prefix search,
# so this namespace cannot be used to enumerate accounts. The interface offers
# exactly what the API does: you must already know the address or the id.

fragment ManagedUserRecord on ManagedUser {
  id
  email
  emailVerified
  deleted
  createdAt
  roles
  grants {
    id
    role
    grantReason
    grantedAt
    grantedByUserId
    revokedByUserId
    revokedAt
    revocationReason
  }
}

query ManagedUserByEmail($email: String!) {
  access {
    user: userByEmail(email: $email) {
      success
      message
      response { ...ManagedUserRecord }
    }
  }
}

# `access.userById` is deliberately not asked for here. The API offers lookup by
# id as well as by email, but every path that reaches a person in this client
# already has their address — the access screen is searched by it, and the audit
# history renders it beside each actor. A document nothing sends is a claim that
# a screen uses it.

mutation GrantRole($input: GrantRoleInput!) {
  access {
    grantRole(input: $input) {
      success
      message
      response { ...ManagedUserRecord }
    }
  }
}

mutation RevokeRole($input: RevokeRoleInput!) {
  access {
    revokeRole(input: $input) {
      success
      message
      response { ...ManagedUserRecord }
    }
  }
}
