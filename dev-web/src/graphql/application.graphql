fragment ApplicationSummaryFields on ApplicationSummary {
  id
  enterpriseId
  programmeCycleId
  applicationKind
  phaseNumber
  referenceNumber
  currentVersion
  status
  statusVersion
  firstSubmittedAt
  createdAt
  updatedAt
  deletedAt
  businessName
  cycleCode
  cycleYear
  # Where it is, as its applicant is told: null for a draft.
  journey { ...ApplicationJourneyFields }
  awaitingCorrection
}

# Where a submitted application is, in the words its pipeline gives the
# applicant: the stage's label, how the journey ended, and only the flags and
# recorded values marked applicant-visible.
fragment ApplicationJourneyFields on ApplicationJourney {
  stageLabel
  stageExplanation
  ended
  flags { key label explanation }
  recordedValues { key label type value }
}

fragment CycleFields on ProgrammeCycle {
  id
  cycleCode
  displayName
  cycleYear
  policyDocument { version originalFilename sizeBytes uploadedAt }
  applicantGuidance
  categoryAMaximumMonths
  status
  opensAt
  closesAt
}

query MyApplications(
  $first: Int
  $after: String
  $enterpriseId: ID
  $status: ApplicationStatus
  $programmeCycleId: ID
  $applicationKind: String
  $search: String
  $includeDeleted: Boolean
) {
  seb {
    application {
      mine(
        first: $first
        after: $after
        enterpriseId: $enterpriseId
        status: $status
        programmeCycleId: $programmeCycleId
        applicationKind: $applicationKind
        search: $search
        includeDeleted: $includeDeleted
      ) {
        success
        message
        response {
          nodes { ...ApplicationSummaryFields }
          pageInfo { endCursor hasNextPage totalCount }
        }
      }
    }
  }
}

query ProgrammeCycles {
  seb {
    application {
      availableProgrammeCycles {
        success
        message
        response { cycles { ...CycleFields } }
      }
      myProgrammeCycles {
        success
        message
        response { cycles { ...CycleFields } }
      }
    }
  }
}

query StatusGuide {
  seb {
    application {
      statusGuide {
        success
        message
        response {
          statuses { status label explanation nextActor nextAction }
        }
      }
    }
  }
}

# Every kind of application the cycle accepts, and whether this enterprise may
# start each — with every reason it may not.
query ApplicationKindEligibility($enterpriseId: ID!, $programmeCycleId: ID!) {
  seb {
    application {
      applicationKinds(
        enterpriseId: $enterpriseId
        programmeCycleId: $programmeCycleId
      ) {
        success
        message
        response {
          kinds { kindKey label description eligible reasons }
        }
      }
    }
  }
}

mutation StartApplication($enterpriseId: ID!, $programmeCycleId: ID!, $applicationKind: String!) {
  seb {
    application {
      start(
        input: {
          enterpriseId: $enterpriseId
          programmeCycleId: $programmeCycleId
          applicationKind: $applicationKind
        }
      ) {
        success
        message
        response { id }
      }
    }
  }
}

# Everything the application screens read, and what every write that changes
# the application answers with, so a mutation's response replaces the cached
# application whole instead of sending the screen back to the server for it.
fragment ApplicationFields on Application {
  id
  enterpriseId
  programmeCycleId
  applicationKind
  phaseNumber
  referenceNumber
  currentVersion
  status
  statusVersion
  firstSubmittedAt
  createdAt
  updatedAt
  deletedAt
  editableStageKeys
  journey { ...ApplicationJourneyFields }
  answers
  snapshot {
    version
    programmeCycleVersion
    declarationAcceptedAt
    applicationCategory
  }
  revisionRequests {
    id
    stageKey
    note
    requestedAt
    resolvedAt
    cancelledAt
  }
  documents {
    id
    fieldKey
    currentVersion
    originalFilename
    contentType
    sizeBytes
    createdAt
    deletedAt
  }
}

query ApplicationById($id: ID!) {
  seb {
    application {
      byId(id: $id) {
        success
        message
        response {
          ...ApplicationFields
        }
      }
    }
  }
}

fragment FormTemplateFields on FormTemplate {
  programmeCycleId
  programmeCycleVersion
  stages { key title description iconName estimatedMinutes position }
  rules { key type stageKey message limit operandKeys }
  grantCeilingPaise
  fields {
    key
    stageKey
    type
    role
    label
    helpText
    requirement
    source
    position
    repeatGroupKey
    groupDefinitionKey
    options { value label position description iconName }
    validation {
      minLength maxLength pattern patternMessage
      minValue maxValue minDate maxDate relativeDateBound
      minRepeat maxRepeat maxFileBytes
    }
    presentation {
      placeholder note tone widthHint prefixText suffixText
      autocompleteHint showCharCount textareaRows choiceStyle
    }
    conditions {
      effect groupNumber sequenceNumber sourceFieldKey operator comparisonValue
    }
  }
}

query ApplicationFormTemplate($applicationId: ID!) {
  seb {
    application {
      formTemplate(applicationId: $applicationId) {
        success
        message
        response { ...FormTemplateFields }
      }
    }
  }
}

query ApplicationTimeline($applicationId: ID!, $first: Int) {
  seb {
    application {
      timeline(applicationId: $applicationId, first: $first) {
        success
        message
        response {
          nodes { id eventType fromStatus toStatus stageKey message createdAt }
          pageInfo { endCursor hasNextPage totalCount }
        }
      }
    }
  }
}

# Removing a draft the applicant started and does not want, and putting it back.
#
# The same soft-delete-and-restore the applicant already has for an enterprise
# and for a document: nothing is destroyed, so a mistake costs nothing. Both
# quote the form version and the workflow version, because a draft can be
# edited and moved through the workflow independently.
mutation RemoveApplicationDraft($input: ApplicationDeletionInput!) {
  seb {
    application {
      softDeleteDraft(input: $input) {
        success
        message
        response { id currentVersion statusVersion deletedAt }
      }
    }
  }
}

mutation RestoreApplicationDraft($input: ApplicationVersionInput!) {
  seb {
    application {
      restoreDraft(input: $input) {
        success
        message
        response { id currentVersion statusVersion deletedAt }
      }
    }
  }
}

mutation SaveApplicationDraft($input: SaveApplicationDraftInput!) {
  seb {
    application {
      saveDraft(input: $input) {
        success
        message
        response { ...ApplicationFields }
      }
    }
  }
}

query ValidateApplication($applicationId: ID!) {
  seb {
    application {
      validate(applicationId: $applicationId) {
        success
        message
        response {
          valid
          issues { stageKey field code message }
        }
      }
    }
  }
}

query DraftChanges($applicationId: ID!) {
  seb {
    application {
      draftChanges(applicationId: $applicationId) {
        success
        message
        response { stageKeys comparedToSubmissionNumber }
      }
    }
  }
}

mutation SubmitApplication($input: ApplicationVersionInput!) {
  seb {
    application {
      submit(input: $input) {
        success
        message
        response { ...ApplicationFields }
      }
    }
  }
}

mutation ResubmitApplication($input: ApplicationVersionInput!) {
  seb {
    application {
      resubmit(input: $input) {
        success
        message
        response { ...ApplicationFields }
      }
    }
  }
}

# --- Evidence -------------------------------------------------------------
#
# Uploading is three steps and all three belong to the applicant's browser: the
# Worker authorizes a single object, the browser puts the bytes straight into
# the bucket, and the Worker then verifies what actually landed there before it
# records a document version. The bytes never pass through the Worker.

mutation IssueDocumentUpload($input: IssueDocumentUploadInput!) {
  seb {
    application {
      issueDocumentUpload(input: $input) {
        success
        message
        response {
          uploadId
          uploadUrl
          expiresAt
          requiredHeaders { name value }
        }
      }
    }
  }
}

mutation FinalizeDocumentUpload($uploadId: ID!) {
  seb {
    application {
      finalizeDocumentUpload(uploadId: $uploadId) {
        success
        message
        response { documentId version }
      }
    }
  }
}

mutation SoftDeleteDocument($input: ApplicationDocumentVersionInput!) {
  seb {
    application {
      softDeleteDocument(input: $input) { success message response { value } }
    }
  }
}

mutation RestoreDocument($input: ApplicationDocumentVersionInput!) {
  seb {
    application {
      restoreDocument(input: $input) { success message response { value } }
    }
  }
}

query DocumentDownloadUrl($documentId: ID!) {
  seb {
    application {
      documentDownloadUrl(documentId: $documentId) {
        success
        message
        response { downloadUrl expiresAt }
      }
    }
  }
}

query SubmittedCopy($applicationId: ID!) {
  seb {
    application {
      submittedCopy(applicationId: $applicationId) {
        success
        message
        response {
          url
        }
      }
    }
  }
}

# Fetched on click, never cached: the URL expires in minutes.
query CyclePolicyDocumentDownloadUrl($cycleId: ID!) {
  seb {
    application {
      cyclePolicyDocumentDownloadUrl(cycleId: $cycleId) {
        success
        message
        response { downloadUrl expiresAt }
      }
    }
  }
}
