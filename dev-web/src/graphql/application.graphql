# --- Funding --------------------------------------------------------------
#
# What the applicant is allowed to know about their own award. The server picks
# the fields: internal banking prerequisites, reviewer evidence and assessment
# notes are absent from this type by design, so the shape of the query is the
# whole of what can be shown.

query ApplicationFunding($applicationId: ID!) {
  seb {
    application {
      funding(applicationId: $applicationId) {
        success
        message
        response {
          award {
            sanctionOrderNumber
            sanctionDate
            sanctionedAmountPaise
            applicantConditions
            status
            closureDisposition
            grossReleasedPaise
            reversedPaise
            netReleasedPaise
            remainingPlannedPaise
          }
          releases {
            sequenceNumber
            occurredAt
            amountPaise
            paymentReference
            reversedAmountPaise
          }
          assessments {
            assessmentType
            assessmentNumber
            outcome
            assessedAt
            summary
            latest
          }
        }
      }
    }
  }
}

query SubmittedCopy($applicationId: ID!) {
  seb {
    application {
      submittedCopy(applicationId: $applicationId) {
        success
        message
        response {
          url
        }
      }
    }
  }
}

# Fetched on click, never cached: the URL expires in minutes.
query CyclePolicyDocumentDownloadUrl($cycleId: ID!) {
  seb {
    application {
      cyclePolicyDocumentDownloadUrl(cycleId: $cycleId) {
        success
        message
        response { downloadUrl expiresAt }
      }
    }
  }
}
