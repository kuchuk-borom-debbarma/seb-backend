query ApplicationById($id: ID!) {
  seb {
    application {
      byId(id: $id) {
        success
        message
        response {
          id
          enterpriseId
          programmeCycleId
          applicationType
          phaseNumber
          referenceNumber
          currentVersion
          status
          statusVersion
          firstSubmittedAt
          createdAt
          updatedAt
          deletedAt
          editableStageKeys
          answers
          snapshot {
            version
            programmeCycleVersion
            declarationAcceptedAt
            applicationCategory
            priorSanctionOrderNumber priorSanctionDate
            priorNetDisbursedAmountPaise continuousOperationMonths
          }
          revisionRequests {
            id
            stageKey
            note
            requestedAt
            resolvedAt
            cancelledAt
          }
          documents {
            id
            fieldKey
            currentVersion
            originalFilename
            contentType
            sizeBytes
            createdAt
            deletedAt
          }
        }
      }
    }
  }
}

fragment FormTemplateFields on FormTemplate {
  programmeCycleId
  programmeCycleVersion
  stages { key title description iconName estimatedMinutes position }
  fields {
    key
    stageKey
    type
    role
    label
    helpText
    requirement
    source
    position
    repeatGroupKey
    groupDefinitionKey
    options { value label position description iconName }
    validation {
      minLength maxLength pattern patternMessage
      minValue maxValue minDate maxDate relativeDateBound
      minRepeat maxRepeat maxFileBytes
    }
    presentation {
      placeholder note tone widthHint prefixText suffixText
      autocompleteHint showCharCount textareaRows choiceStyle
    }
    conditions {
      effect groupNumber sequenceNumber sourceFieldKey operator comparisonValue
    }
  }
}

query ApplicationFormTemplate($applicationId: ID!) {
  seb {
    application {
      formTemplate(applicationId: $applicationId) {
        success
        message
