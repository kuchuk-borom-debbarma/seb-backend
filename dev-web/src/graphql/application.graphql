fragment ApplicationSummaryFields on ApplicationSummary {
  id
  enterpriseId
  programmeCycleId
  applicationType
  phaseNumber
  referenceNumber
  currentVersion
  status
  statusVersion
  firstSubmittedAt
  createdAt
  updatedAt
  deletedAt
  businessName
  cycleCode
  cycleYear
}

fragment CycleFields on ProgrammeCycle {
  id
  cycleCode
  displayName
  cycleYear
  policyDocument { version originalFilename sizeBytes uploadedAt }
  applicantGuidance
  categoryAMaximumMonths
  status
  opensAt
  closesAt
}

query MyApplications(
  $first: Int
  $after: String
  $enterpriseId: ID
  $status: ApplicationStatus
  $programmeCycleId: ID
  $applicationType: ApplicationType
  $search: String
  $includeDeleted: Boolean
) {
  seb {
    application {
      mine(
        first: $first
        after: $after
        enterpriseId: $enterpriseId
        status: $status
        programmeCycleId: $programmeCycleId
        applicationType: $applicationType
        search: $search
        includeDeleted: $includeDeleted
      ) {
        success
        message
        response {
          nodes { ...ApplicationSummaryFields }
          pageInfo { endCursor hasNextPage totalCount }
        }
      }
    }
  }
}

query ProgrammeCycles {
  seb {
    application {
      availableProgrammeCycles {
        success
        message
        response { cycles { ...CycleFields } }
      }
      myProgrammeCycles {
        success
        message
        response { cycles { ...CycleFields } }
      }
    }
  }
}

query StatusGuide {
