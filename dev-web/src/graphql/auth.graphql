mutation SignIn($email: String!, $password: String!) {
  auth {
    signIn(input: { email: $email, password: $password }) {
      success
      message
      response {
        user { id email roles }
      }
    }
  }
}

mutation SignOut {
  auth {
    signOut { success message }
  }
}

mutation StartApplicantSignup($email: String!) {
  auth {
    startApplicantSignup(input: { email: $email }) {
      success
      message
      response { challengeToken expiresAt delivery }
    }
  }
}

mutation VerifyApplicantSignup($challengeToken: String!, $otp: String!, $password: String!) {
  auth {
    verifyApplicantSignup(
      input: { challengeToken: $challengeToken, otp: $otp, password: $password }
    ) {
      success
      message
      response { id email roles }
    }
  }
}

query Sessions {
  auth {
    sessions {
      success
      message
      response {
        sessions { id current createdAt updatedAt expiresAt ipAddress userAgent }
      }
    }
  }
}

mutation RevokeSession($sessionId: ID!) {
  auth { revokeSession(sessionId: $sessionId) { success message } }
}

mutation RevokeOtherSessions {
  auth { revokeOtherSessions { success message } }
}

mutation RevokeAllSessions {
  auth { revokeAllSessions { success message } }
}

mutation StartPasswordReset($email: String!) {
  auth {
    startPasswordReset(input: { email: $email }) {
      success
      message
      response { challengeToken expiresAt delivery }
    }
  }
}

mutation CompletePasswordReset($challengeToken: String!, $otp: String!, $newPassword: String!) {
  auth {
    completePasswordReset(
      input: { challengeToken: $challengeToken, otp: $otp, newPassword: $newPassword }
    ) {
      success
      message
    }
  }
}

mutation ChangePassword($currentPassword: String!, $newPassword: String!) {
  auth {
    changePassword(input: { currentPassword: $currentPassword, newPassword: $newPassword }) {
      success
      message
    }
  }
}

mutation StartEmailChange($newEmail: String!, $currentPassword: String!) {
  auth {
    startEmailChange(input: { newEmail: $newEmail, currentPassword: $currentPassword }) {
      success
      message
      response { challengeToken expiresAt delivery }
    }
  }
}

mutation CompleteEmailChange($challengeToken: String!, $otp: String!) {
  auth {
    completeEmailChange(input: { challengeToken: $challengeToken, otp: $otp }) {
      success
      message
      response { id email emailVerified displayName }
    }
  }
}

mutation ChangeDisplayName($displayName: String!) {
  auth {
    changeDisplayName(input: { displayName: $displayName }) {
      success
      message
      response { id email displayName }
    }
  }
}
